      : (()=>{const M=D.janela.slice().sort((a,b)=>b.msgs-a.msgs)[0];
          if(!TEMA) return `A divisão de filas se mantém: Fabricio no chat da Shopee, Yasmin no Mercado Livre e Sara no Magalu. <b>${M.nome.split(' ')[0]} lidera em mensagens digitadas (${NB(M.msgs)})</b> — e mensagem não é atendimento: este mês não tem a contagem de tickets distintos por pessoa, então o ranking de volume fica em aberto. ${RES} ${DIAS}`;
          const V=D.janela.slice().sort((a,b)=>(ATJ(b)||0)-(ATJ(a)||0))[0], vA=ATJ(V), mA=ATJ(M);
          return `A divisão de filas se mantém: Fabricio no chat da Shopee, Yasmin no Mercado Livre e Sara no Magalu. <b>${V.nome.split(' ')[0]} lidera em atendimentos (${NB(vA)} casos, ${FX(V.msgs/vA)} mensagens cada)</b>${M.nome!==V.nome?`, enquanto ${M.nome.split(' ')[0]} lidera em mensagens (${NB(M.msgs)}${mA?', '+FX(M.msgs/mA)+' por caso':''})`:` e também em mensagens (${NB(V.msgs)})`} — fila curta rende muito caso, fila longa rende muita mensagem, e as duas contas medem coisas diferentes. ${RES} ${DIAS}`;})()}</div></div>`;})();


  if(D.tickets){const T=D.tickets;
  h += `<div class="slab">Tickets e SLA do marketplace <span class="hint">base consolidada de atendimentos · ${NB(T.total)} tickets</span></div>
    <div class="obsbox"><span class="oi">ℹ️</span><span>Esta seção usa a base de <b>tickets</b> e o <b>histórico de status</b> do Predize, que trazem o SLA definido por cada marketplace — critério diferente do SLA de 12h dos protocolos de chat. Dos ${NB(T.total)} tickets, <b>${NB(T.em_aberto)} ainda estavam com prazo em curso</b> no fechamento do período e não entram no cálculo.</span></div>
    <div class="kgrid">`+[
      {l:'SLA do marketplace',v:T.sla_pct+'%',g:T.sla_pct>=70?'linear-gradient(90deg,#22C55E,#4ADE80)':'linear-gradient(90deg,#EAB308,#FF6B35)',
       c:T.sla_pct>=70?'#4ADE80':'#FACC15',s:`${NB(T.sla_ok)} de ${NB(T.sla_avaliados)} com prazo encerrado`,gh:'🎯',b:[T.sla_pct>=70?'b-ok':'b-wr',NB(T.em_aberto)+' ainda no prazo']},
      {l:'1ª resposta humana',v:T.t1h_med,g:'linear-gradient(90deg,#EAB308,#FF6B35)',c:'#FACC15',
       s:`${T.com_humano_pct}% dos tickets chegaram a um atendente`,gh:'🙋',b:['b-nt',NB(T.com_humano)+' tickets']},
      {l:'Cobertura da IA (MIA)',v:T.mia_pct+'%',g:'linear-gradient(90deg,#06B6D4,#3B82F6)',
       s:`${NB(T.mia)} tickets com resposta automática`,gh:'🤖',b:['b-nt','ciclo mediano de '+T.ciclo_med]},
      {l:'Em mediação',v:NB(T.mediacao),g:'linear-gradient(90deg,#EF4444,#EC4899)',c:'#F87171',
       s:`${T.mediacao_pct}% dos tickets escalaram para o marketplace`,gh:'⚖️',b:['b-al',T.mediacao_canal.map(m=>m.c+': '+m.n).join(' · ')]}
    ].map(cardKPI).join('')+`</div>
    <div style="margin-top:14px">
      <div class="panel"><p class="pt">Cumprimento de SLA por canal e tipo</p>
        <table><thead><tr><th>Canal</th><th>Avaliados</th><th>No prazo</th><th>%</th></tr></thead>
        <tbody>${T.sla_canal.map(c=>`<tr><td><span class="dot" style="background:${CC[c.id]||'#7C818C'};margin-right:8px"></span>${c.c}</td>
          <td>${NB(c.n)}</td><td>${NB(c.ok)}</td><td style="color:${c.pct>=70?'#4ADE80':c.pct>=50?'#FACC15':'#F87171'};font-weight:700">${c.pct}%</td></tr>`).join('')}</tbody></table>
        <table style="margin-top:16px"><thead><tr><th>Tipo de atendimento</th><th>Avaliados</th><th>No prazo</th><th>%</th></tr></thead>
        <tbody>${T.sla_tipo.filter(x=>x.n>=5).map(c=>`<tr><td>${c.t}</td><td>${NB(c.n)}</td><td>${NB(c.ok)}</td>
          <td style="color:${c.pct>=70?'#4ADE80':c.pct>=50?'#FACC15':'#F87171'};font-weight:700">${c.pct}%</td></tr>`).join('')}</tbody></table>
        <div class="note">O <b>Magalu cumpre ${T.sla_canal.find(c=>c.id==='magalu')?.pct}% do SLA</b> contra ${T.sla_canal.find(c=>c.id==='mercadolivre')?.pct}% do Mercado Livre. Por tipo, o gargalo é a <b>pré-venda (${T.sla_tipo.find(x=>x.t==='Pré-venda')?.pct}%)</b> — a mesma conclusão que aparece na seção de pré-venda, agora confirmada pelo prazo do próprio marketplace.</div></div></div>`;
  }


  h += `<div class="slab">Pré-venda</div><div class="g2">
    <div class="panel"><p class="pt">Agente virtual × agente humano</p>
      <table><thead><tr><th>Tipo</th><th>Perguntas</th><th>Resposta mediana</th><th>No SLA</th><th>Gerou venda</th></tr></thead>

      <tr class="tot"><td>Total</td><td>${D.pre.total}</td><td>—</td><td>${D.pre.sla}%</td><td>${D.pre.venda}%</td></tr></tbody></table>
      <div class="note green">O agente virtual responde em <b>${D.pre.tipos.find(t=>t.t==='Agente Virtual').med}</b> e converte <b>${D.pre.tipos.find(t=>t.t==='Agente Virtual').venda}%</b>; o humano leva ${D.pre.tipos.find(t=>t.t==='Agente Humano').med} e converte ${D.pre.tipos.find(t=>t.t==='Agente Humano').venda}%. ${D.pre.sem_resposta} perguntas ficaram sem resposta.</div></div>
    <div class="panel"><p class="pt">Pré-venda por atendente</p>
      <table><thead><tr><th>Atendente</th><th>Perguntas</th><th>Resposta mediana</th><th>No SLA</th></tr></thead>
      <tbody>${D.atendentes.map(a=>`<tr><td><span class="dot" style="background:${AVC[a.nome]};margin-right:8px"></span>${a.nome}</td><td>${a.pre}</td><td>${a.pre_med}</td><td>${a.pre_sla}%</td></tr>`).join('')}
      <tr><td>Virtual / sem atendente</td><td>${D.sem_atendente.pre}</td><td>—</td><td>—</td></tr></tbody></table>
      <div class="note">Além destas ${D.pre.total} perguntas de anúncio, o chat trouxe outras <b>${NB(C.contexto.find(c=>c.c==='Pré-Venda').n)} conversas de pré-venda</b>, das quais ${C.contexto.find(c=>c.c==='Pré-Venda').hum}% chegaram a um atendente.</div></div></div>`;


  return h;
}

/* ---------- gráficos ---------- */
function graficos(D){
  const C=D.chat, K=D.kpi;
  /* fila diaria: estoque (07h/17h) + fluxo (entradas/respostas) */
  if(D.fila)(function(){
    const S=D.fila.dias,W=1000,p={l:48,r:14,t:16,b:30};
    const HA=170,GAP=40,HB=132,H=p.t+HA+GAP+HB+p.b;
    const iw=W-p.l-p.r,bw=iw/S.length;
    const passo=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)))/2;return Math.ceil(v/p)*p;};
    const maxS=passo(Math.max(...S.map(d=>Math.max(d.p7,d.p17)))*1.06);
    const maxF=passo(Math.max(...S.map(d=>Math.max(d.ent,d.resp)))*1.06);
    const yS=v=>p.t+HA-(v/maxS)*HA, yB0=p.t+HA+GAP, yB=v=>yB0+HB-(v/maxF)*HB;
    const s=svg(W,H);
    s.appendChild(tx(p.l,p.t-4,'ESTOQUE — TICKETS AGUARDANDO ATENDENTE',{anchor:'start',size:9,weight:700,fill:'#6B7079'}));
    s.appendChild(tx(p.l,yB0-10,'FLUXO DO DIA — ENTRARAM NA FILA vs SAÍRAM',{anchor:'start',size:9,weight:700,fill:'#6B7079'}));
    for(let i=0;i<=4;i++){const v=maxS*i/4;
      s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:yS(v),y2:yS(v),stroke:'#212329'}));
      s.appendChild(tx(p.l-8,yS(v)+3.5,NB(Math.round(v)),{anchor:'end',size:9.5}));}
    for(let i=0;i<=3;i++){const v=maxF*i/3;
      s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:yB(v),y2:yB(v),stroke:'#212329'}));
      s.appendChild(tx(p.l-8,yB(v)+3.5,NB(Math.round(v)),{anchor:'end',size:9.5}));}
    /* zigue-zague do estoque: 07h -> 17h (dia) e 17h -> 07h seguinte (noite) */
    S.forEach((d,i)=>{
      const x7=p.l+i*bw+bw*.26, x17=p.l+i*bw+bw*.78;
      const cor=d.delta>0?'#F87171':'#4ADE80';
      s.appendChild(mk('line',{x1:x7,x2:x17,y1:yS(d.p7),y2:yS(d.p17),stroke:cor,'stroke-width':2.6,'stroke-linecap':'round'}));
      if(i<S.length-1){const xn=p.l+(i+1)*bw+bw*.26;
        s.appendChild(mk('line',{x1:x17,x2:xn,y1:yS(d.p17),y2:yS(S[i+1].p7),stroke:'#5E636D','stroke-width':1.5,'stroke-dasharray':'3 3'}));}
      s.appendChild(mk('circle',{cx:x7,cy:yS(d.p7),r:3.2,fill:'#0A0A0B',stroke:'#F87171','stroke-width':2}));
      s.appendChild(mk('circle',{cx:x17,cy:yS(d.p17),r:3.2,fill:cor}));
      if(i===0||i===S.length-1||d.p17===Math.max(...S.map(z=>z.p17)))
        s.appendChild(tx(x17,yS(d.p17)-9,NB(d.p17),{size:9.5,fill:'#C9CDD4',weight:700}));
      /* fluxo */
      const g=bw*.42,w=bw*.30,xb=p.l+i*bw+bw*.12;
      s.appendChild(mk('rect',{x:xb,y:yB(d.ent),width:w,height:Math.max(1,yB(0)-yB(d.ent)),fill:'#FF6B35',rx:2,opacity:.92}));
      s.appendChild(mk('rect',{x:xb+g,y:yB(d.resp),width:w,height:Math.max(1,yB(0)-yB(d.resp)),fill:'#22C55E',rx:2,opacity:.92}));
      s.appendChild(tx(p.l+i*bw+bw/2,H-p.b+16,d.rot,{size:9.5,fill:'#7C818C'}));
    });
    el('c-fila').appendChild(s);
    el('l-fila').innerHTML=
      `<span><u style="background:#0A0A0B;border:2px solid #F87171;border-radius:50%"></u>Abertura às 07h</span>`+
      `<span><u style="background:#9aa0aa;border-radius:50%"></u>Fechamento às 17h</span>`+
      `<span><u style="background:#4ADE80"></u>Dia em que a fila caiu</span>`+
      `<span><u style="background:#F87171"></u>Dia em que a fila subiu</span>`+
      `<span><u style="background:#5E636D"></u>Entre jornadas (noite e fim de semana)</span>`+
      `<span><u style="background:#FF6B35"></u>Entraram na fila</span><span><u style="background:#22C55E"></u>Saíram da fila</span>`;
  })();
  /* composicao da fila das 07h por canal */
  if(D.fila&&D.fila.canais&&D.fila.canais.length)(function(){
    const S=D.fila.dias,W=1000,H=250,p={l:48,r:14,t:26,b:30};
    const ord=['shopee','mercadolivre','magalu','madeira','via'].filter(k=>S[0].canal[k]!==undefined);
    const iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/S.length;
    const passo=v=>{const q=Math.pow(10,Math.floor(Math.log10(v)))/2;return Math.ceil(v/q)*q;};
    const max=passo(Math.max(...S.map(d=>d.p7))*1.06);
    const y=v=>p.t+ih-(v/max)*ih,s=svg(W,H);
    s.appendChild(tx(p.l,p.t-10,'PENDENTES ÀS 07h — COMPOSIÇÃO POR CANAL',{anchor:'start',size:9,weight:700,fill:'#6B7079'}));
    for(let i=0;i<=4;i++){const v=max*i/4;
      s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:y(v),y2:y(v),stroke:'#212329'}));
      s.appendChild(tx(p.l-8,y(v)+3.5,NB(Math.round(v)),{anchor:'end',size:9.5}));}
    S.forEach((d,i)=>{const x=p.l+i*bw+bw*.17,w=bw*.66;let acc=0;
      ord.forEach(k=>{const v=d.canal[k].p7;if(!v)return;const hh=(v/max)*ih;
        s.appendChild(mk('rect',{x,y:p.t+ih-acc-hh,width:w,height:hh,fill:CC[k]||'#3F444C',opacity:.92}));acc+=hh;});
      s.appendChild(tx(x+w/2,H-p.b+16,d.rot,{size:9.5,fill:'#7C818C'}));});
    el('c-filac').appendChild(s);
    el('l-filac').innerHTML=ord.map(k=>{const c=D.fila.canais.find(c=>c.id===k);
      return c?`<span><u style="background:${CC[k]||'#3F444C'}"></u>${c.nome} · ${NB(c.p7_fim)} em ${S[S.length-1].rot}</span>`:''}).filter(Boolean).join('');
  })();
}

/* ---------- gráficos do Reclame Aqui ---------- */

  /* hora */

    const max=Math.max(...Object.values(P.horas)),y=v=>p.t+ih-(v/max)*ih,s=svg(W,H);

    const step=Math.max(1,Math.ceil(max/5));
    for(let i=0;i<=max;i+=step){s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:y(i),y2:y(i),stroke:'#212329'}));
      s.appendChild(tx(p.l-7,y(i)+3.5,i,{anchor:'end',size:9.5}));}

      if(hh%2===0)s.appendChild(tx(x+bw/2,H-p.b+16,String(hh).padStart(2,'0'),{size:9.5}));}
    el('ra-hora').appendChild(s);
    const dentro=Object.entries(P.horas).filter(([h])=>+h>=7&&+h<18).reduce((a,[,v])=>a+v,0);
    const fora=P.total-dentro;

  })();
  /* dia */
  (function(){

    const vals=Object.values(P.dias_mes),max=Math.max(...vals),y=v=>p.t+ih-(v/max)*ih,s=svg(W,H);
    const step=Math.max(1,Math.ceil(max/5));
    for(let i=0;i<=max;i+=step){s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:y(i),y2:y(i),stroke:'#212329'}));
      s.appendChild(tx(p.l-7,y(i)+3.5,i,{anchor:'end',size:9.5}));}
    for(let d=1;d<=31;d++){const v=P.dias_mes[d]||0,x=p.l+(d-1)*bw;
      if(v)s.appendChild(mk('rect',{x:x+bw*.18,y:y(v),width:bw*.64,height:ih-(y(v)-p.t),fill:v>=max*0.85?'#EF4444':'#FF6B35',rx:3,opacity:.9}));
      if(d%2===1)s.appendChild(tx(x+bw/2,H-p.b+16,String(d).padStart(2,'0'),{size:9.5}));}
    el('ra-dia').appendChild(s);
    const media=(P.total/P.dias).toFixed(1).replace('.',',');
    const picos=Object.entries(P.dias_mes).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0].padStart(2,'0'));
    el('ra-ndia').innerHTML=raPer==='semestre'

  })();

  if(el('ra-mes')&&P.meses.length>1){
    const M=P.meses,W=1000,H=200,p={l:34,r:8,t:16,b:26};

        fill:m.parcial?'#3B82F6':'#FF6B35',rx:4,opacity:m.parcial?.55:.9}));
      s.appendChild(tx(x+bw/2,y(m.n)-7,m.n,{size:11.5,fill:'#fff',weight:700}));
      s.appendChild(tx(x+bw/2,H-p.b+16,m.m+(m.parcial?' *':''),{size:10.5}));});
    el('ra-mes').appendChild(s);
    const med=(M.filter(m=>!m.parcial).reduce((a,b)=>a+b.n,0)/6).toFixed(1);
    el('ra-nmes').innerHTML=`${(()=>{const ch=M.filter(x=>!x.parcial),ult=ch[ch.length-1],pen=ch[ch.length-2],pc=M.find(x=>x.parcial);
      return `Depois de cinco meses entre <b>32 e 41 reclamações</b>, <b>${ult.m==='Ago'?'agosto':ult.m} fechou em ${ult.n}</b> — queda de ${Math.round((1-ult.n/pen.n)*100)}% sobre o mês anterior e o menor volume da janela.`+
        (pc?` Setembro aparece com ${pc.n} porque a janela cobre só os ${RA.periodos.semestre.janela.slice(-10,-8)} primeiros dias do mês.`:'')+
        ` É a primeira quebra do platô, mas ainda é um mês só: setembro fechado é que confirma se virou tendência.`;})()} <span style="color:#5E636D">* mês parcial.</span>`;
  }
  /* notas */
  if(el('ra-notas')&&P.top_avaliadas.length){
    const N=P.notas,W=1000,H=200,p={l:30,r:8,t:16,b:26};
    const iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/11;
    const max=Math.max(...Object.values(N)),y=v=>p.t+ih-(v/max)*ih,s=svg(W,H);
    const step=Math.max(1,Math.ceil(max/5));
    for(let i=0;i<=max;i+=step){s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:y(i),y2:y(i),stroke:'#212329'}));
      s.appendChild(tx(p.l-7,y(i)+3.5,i,{anchor:'end',size:9.5}));}
    for(let n=10;n>=0;n--){const v=N[n]||0,x=p.l+(10-n)*bw;
      const cor=n>=9?'#22C55E':n>=7?'#84CC16':n>=5?'#EAB308':n>=3?'#FF6B35':'#EF4444';
      if(v){s.appendChild(mk('rect',{x:x+bw*.22,y:y(v),width:bw*.56,height:ih-(y(v)-p.t),fill:cor,rx:3,opacity:.9}));
        s.appendChild(tx(x+bw/2,y(v)-6,v,{size:11,fill:'#fff',weight:700}));}
      s.appendChild(tx(x+bw/2,H-p.b+16,n,{size:10.5}));}
    el('ra-notas').appendChild(s);
    const prom=(N[10]||0)+(N[9]||0),det=Object.entries(N).filter(([n])=>+n<=6).reduce((a,b)=>a+b[1],0);
    el('ra-nnotas').innerHTML=`<b>${N[0]||0} avaliações nota zero</b> contra ${prom} notas 9 e 10. Os detratores (até 6) somam ${det} das ${P.avaliadas}, o que puxa a média para ${(P.nota_media??RA.nota_consumidor).toFixed(2).replace('.',',')}/10. A concentração no extremo zero é típica de cliente que avaliou depois de desistir — e é o indicador mais lento de virar, porque só se move quando um cliente novo avalia bem.`;
  }
  /* problemas e produtos */
  [['ra-prob',P.problemas,'#EF4444'],['ra-prod',P.produtos,'#3B82F6'],['ra-cat',P.categorias||[],'#A855F7']].forEach(([id,arr,cor])=>{
    if(!el(id)||!arr.length)return;
    const W=1000,rh=34,H=arr.length*rh+8,mx=Math.max(...arr.map(a=>a.v)),bx=330,s=svg(W,H);
    arr.forEach((a,i)=>{const y=i*rh+8,w=(a.v/mx)*(W-bx-110);
      s.appendChild(tx(0,y+16,a.p,{anchor:'start',size:12.5,fill:'#B7BBC4'}));
      s.appendChild(mk('rect',{x:bx,y:y+3,width:Math.max(2,w),height:18,fill:cor,rx:4,opacity:i===0?.92:.55}));
      s.appendChild(tx(bx+w+10,y+17,a.v.toFixed(2).replace('.',',')+'%',{anchor:'start',size:11}));});
    el(id).appendChild(s);
  });
  /* temas */
  (function(){
    const T=P.temas,W=1000,rh=34,H=T.length*rh+8,mx=Math.max(...T.map(t=>t.v)),bx=400,s=svg(W,H);
    T.forEach((t,i)=>{const y=i*rh+8,w=(t.v/mx)*(W-bx-120);
      const lbl=t.t.length>48?t.t.slice(0,46)+'…':t.t;
      s.appendChild(tx(0,y+16,`${i+1}. ${lbl}`,{anchor:'start',size:12.5,fill:'#B7BBC4'}));
      s.appendChild(mk('rect',{x:bx,y:y+3,width:Math.max(2,w),height:18,fill:i===0?'#EF4444':'#FF6B35',rx:4,opacity:i===0?.92:.6}));
      s.appendChild(tx(bx+w+10,y+17,NB(t.v)+' visualizações',{anchor:'start',size:11}));});
    el('ra-tema').appendChild(s);
  })();
}

/* ---------- render ---------- */
/* ======================================================
   LEITURAS RECOLHIDAS
   Toda nota interpretativa (.note) e caixa de observação (.obsbox)
   vira um marcador "!" que só revela o texto no hover.
   ====================================================== */
function leituras(root){
  if(!root) return;
  root.querySelectorAll('.note, .obsbox, .alertbox').forEach(n=>{
    if(n.dataset.le) return;
    const txt=(n.textContent||'').trim();
    if(!txt) return;                       // notas ainda vazias (gráficos) são tratadas depois
    let cls='', rot='Leitura';
    const st=(n.getAttribute('style')||'');
    if(n.classList.contains('obsbox')){
      if(/239,68,68/.test(st)){cls=' ru';rot='Alerta';}
      else if(/234,179,8/.test(st)){cls=' al';rot='Atenção';}
      else if(/34,197,94/.test(st)){cls=' bo';rot='Destaque';}
      else {rot='Observação';}
    }
    if(n.classList.contains('alertbox')){
      cls = n.classList.contains('cor') ? ' bo' : n.classList.contains('rd') ? ' ru' : ' al';
      rot = n.classList.contains('cor') ? 'Correção' : 'Leitura do canal';
      if(n.getAttribute('data-rot')) rot = n.getAttribute('data-rot');
    }
    const html=n.innerHTML.replace(/<span class="oi">[^<]*<\/span>/,'').replace(/^\s*<span>[^<]{0,4}<\/span>\s*/,'').replace(/^\s*<span>|<\/span>\s*$/g,'');
    const span=document.createElement('span');
    span.className='le'+cls;
    span.dataset.le='1';
    span.innerHTML='<i>!</i>'+rot+'<span class="tipbox">'+html+'</span>';
    span.title='';
    n.replaceWith(span);
  });
  // tooltips perto da borda direita abrem alinhados à direita; os do fim da página, para baixo
  const lg=root.getBoundingClientRect?root.getBoundingClientRect():null;
  root.querySelectorAll('.le').forEach(e=>{
    const r=e.getBoundingClientRect();
    if(lg && r.left-lg.left > lg.width*0.55) e.classList.add('right');
    if(r.top < 260) e.classList.add('down');
  });
}

function render(){
  const v=el('view');
  if(atual==='ra'){v.innerHTML=`<div class="fade">${viewRA()}</div>`;graficosRA();leituras(v);return;}
  if(atual==='rep'){v.innerHTML=`<div class="fade">${viewRep()}</div>`;leituras(v);return;}
  if(atual==='geral'){v.innerHTML=`<div class="fade">${viewGeral()}</div>`;leituras(v);return;}
  const m=DATA.meses.find(x=>x.key===atual);
  v.innerHTML=`<div class="fade">${viewMes(m)}</div>`;
  if(m.dados) graficos(m.dados);
  leituras(v);
}
pintaRepBar();pintaTabs();pintaTopo();render();
</script>
