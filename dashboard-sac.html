<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Atendimento SAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B; --bar:#000; --card:#141518; --card2:#17181C; --line:#26282E; --line2:#33363E;
  --tx:#FFFFFF; --mid:#B7BBC4; --mut:#7C818C;
  --orange:#FF6B35; --blue:#3B82F6; --green:#22C55E; --purple:#A855F7;
  --yellow:#EAB308; --cyan:#06B6D4; --red:#EF4444; --pink:#EC4899;
  --shopee:#FF6B35; --meli:#EAB308; --magalu:#3B82F6; --madeira:#22C55E;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1330px;margin:0 auto;padding:0 20px 80px}

/* topbar */
.topbar{background:var(--bar);border-bottom:1px solid var(--line);padding:7px 0;margin-bottom:12px}
.topbar .in{max-width:1330px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px}
.chipbtn{border:1px solid var(--line2);background:#131417;border-radius:7px;padding:4px 10px;font-size:12px;
  color:var(--mid);font-weight:500}
.topbar .t{font-size:12.5px;color:var(--mid)}

/* hero */
.hero{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:linear-gradient(100deg,rgba(255,107,53,.16) 0%, rgba(255,107,53,.03) 32%, rgba(20,21,24,1) 62%),var(--card);
  padding:13px 16px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.hero .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(140deg,#FF8A3D,#F0522B);flex:none;box-shadow:0 6px 18px rgba(255,107,53,.28)}
.hero h1{font-size:17px;font-weight:800;letter-spacing:.4px;margin:0;text-transform:uppercase}
.hero p{margin:2px 0 0;color:var(--mut);font-size:11.5px}
.hero .pills{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:999px;padding:4px 11px;
  font-size:11px;font-weight:600;background:rgba(0,0,0,.35)}
.pill.g{border-color:rgba(34,197,94,.5);color:#4ADE80}
.pill.b{border-color:rgba(59,130,246,.5);color:#60A5FA}
.pill.o{border-color:rgba(255,107,53,.5);color:#FF8A5B}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}


/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:16px 0 0;
  scrollbar-width:thin}
.tab{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;font-size:13px;color:var(--mut);
  font-weight:500;border:0;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
  font-family:var(--f)}
.tab i{width:7px;height:7px;border-radius:50%;background:#3A3D45;display:inline-block;flex:none}
.tab:hover{color:var(--mid)}
.tab.on{color:var(--orange);border-bottom-color:var(--orange)}
.tab.on i{background:var(--orange);box-shadow:0 0 0 3px rgba(255,107,53,.18)}
.tab.done i{background:var(--green)}
.tab .bdg{font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:5px;text-transform:uppercase}
.bdg.gr{background:rgba(34,197,94,.16);color:#4ADE80}
.bdg.or{background:rgba(255,107,53,.16);color:#FF8A5B}
.bdg.gy{background:#202329;color:var(--mut)}
.bdg.rd{background:rgba(239,68,68,.16);color:#F87171}
.tab:focus-visible{outline:2px solid var(--orange);outline-offset:-4px;border-radius:6px}

/* section label */
.slab{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);
  margin:26px 0 11px;display:flex;align-items:center;gap:12px}
.slab::after{content:"";flex:1;height:1px;background:var(--line)}
.slab .hint{font-size:11px;font-weight:500;letter-spacing:.2px;text-transform:none;color:#5E636D}

/* kpi cards */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:11px}
.kc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 15px 14px;
  overflow:hidden}
.kc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--g)}
.kc .lab{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.kc .val{font-size:26px;font-weight:800;letter-spacing:-.7px;margin:8px 0 0;line-height:1.05;color:var(--c)}
.kc .sub{font-size:12px;color:var(--mut);margin-top:6px}
.kc .gh{position:absolute;right:14px;bottom:14px;font-size:30px;opacity:.09;pointer-events:none}
.kc .bdg2{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:11px;font-weight:600;
  padding:4px 9px;border-radius:6px}
.b-ok{background:rgba(34,197,94,.13);color:#4ADE80}
.b-wr{background:rgba(234,179,8,.13);color:#FACC15}
.b-al{background:rgba(239,68,68,.14);color:#F87171}
.b-nt{background:rgba(59,130,246,.13);color:#60A5FA}

/* mês cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 14px;text-align:center}
.mc .mn{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.mc .mv{font-size:29px;font-weight:800;letter-spacing:-.7px;margin:9px 0 3px;color:var(--c)}
.mc .ms{font-size:12px;color:var(--mid);font-weight:600}
.mc .mf{font-size:10.5px;color:#5E636D;margin-top:9px}
.mc.empty{border-style:dashed;opacity:.55}
.mc.empty .mv{color:#3A3D45}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.pt{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);margin:0 0 12px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pt small{font-weight:500;letter-spacing:.2px;text-transform:none;color:#5E636D;font-size:11.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:11.5px;color:var(--mid);margin-top:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.note{margin-top:12px;padding:10px 12px;background:#101114;border:1px solid var(--line);border-left:3px solid var(--orange);
  border-radius:8px;color:var(--mid);font-size:12.5px;line-height:1.65}
.note b{color:#fff;font-weight:600}
details.met{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
details.met summary{cursor:pointer;font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);list-style:none}
details.met summary::-webkit-details-marker{display:none}
details.met summary::before{content:'▸ ';color:var(--orange)}
details.met[open] summary::before{content:'▾ '}
details.met ul{margin-top:12px}
.note.blue{border-left-color:var(--blue)}
.note.green{border-left-color:var(--green)}

/* barra-resumo de reputação */
.repbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:7px 11px;margin-top:10px}
.repbar .tt{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.repchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#101114;
  border-radius:999px;padding:5px 11px;font-size:12px;color:var(--mid);cursor:pointer;font-family:var(--f)}
.repchip:hover{border-color:var(--line2)}
.repchip b{color:#fff;font-weight:700}
.repchip .sd{width:8px;height:8px;border-radius:50%;flex:none}
.repbar .lk{margin-left:auto;font-size:11.5px;color:var(--orange);cursor:pointer;background:none;border:0;
  font-family:var(--f);font-weight:600}

/* reputação */
.tbhist th,.tbhist td{text-align:center;padding:7px 6px;font-size:11.5px;white-space:nowrap}
.tbhist td:first-child,.tbhist th:first-child,.tbhist td:nth-child(2),.tbhist th:nth-child(2){text-align:left}
.tbhist .hj{background:rgba(255,255,255,.04)}
.aud{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:11px}
.aud .rc{overflow:visible}
.aud .rc::before{border-radius:12px 12px 0 0}
.tip{position:relative;cursor:help;border-bottom:1px dotted #4A4E56}
.tip .tipbox{visibility:hidden;opacity:0;position:absolute;left:0;bottom:calc(100% + 9px);width:min(330px,72vw);
  background:#14171B;border:1px solid #333740;border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.55;
  color:#C9CDD4;font-weight:400;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.55);transition:opacity .14s;
  pointer-events:none;text-align:left;white-space:normal;letter-spacing:0}
.tip .tipbox b{color:#F0F2F5}
.tip .tipbox em{color:#7C818C;font-style:normal;display:block;margin-top:6px;font-size:11px}
.tip:hover .tipbox{visibility:visible;opacity:1}
.tip.tr .tipbox{left:auto;right:0}
.le{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:10px;cursor:help;
  background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.28);color:#93C5FD;
  border-radius:999px;padding:3px 10px 3px 4px;font-size:11px;font-weight:600;letter-spacing:.2px;
  transition:background .14s,border-color .14s}
.le:hover{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.5)}
.le>i{width:16px;height:16px;border-radius:50%;background:#3B82F6;color:#0B0D10;
  display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;flex:0 0 16px}
.le.al{background:rgba(234,179,8,.10);border-color:rgba(234,179,8,.30);color:#FDE68A}
.le.al>i{background:#EAB308}
.le.ru{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.30);color:#FCA5A5}
.le.ru>i{background:#EF4444}
.le.bo{background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.30);color:#86EFAC}
.le.bo>i{background:#22C55E}
.le .tipbox{visibility:hidden;opacity:0;position:absolute;left:0;bottom:calc(100% + 9px);width:min(460px,80vw);
  background:#14171B;border:1px solid #333740;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.6;
  color:#C9CDD4;font-weight:400;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.55);transition:opacity .14s;
  pointer-events:none;text-align:left;white-space:normal;letter-spacing:0}
.le .tipbox b{color:#F0F2F5}
.le:hover .tipbox{visibility:visible;opacity:1}
.le.down .tipbox{bottom:auto;top:calc(100% + 9px)}
.le.right .tipbox{left:auto;right:0}
.trg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px}
.trc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;overflow:hidden}
.trc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.trc h4{font-size:13.5px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.trc .big{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.trc .big small{font-size:13px;font-weight:600;letter-spacing:0;margin-left:3px}
.trc .cap2{font-size:10.5px;color:#7C818C;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.trbar{position:relative;height:22px;background:#1C1F24;border-radius:5px;margin:11px 0 5px;overflow:hidden}
.trbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.trbar b{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.85}
.trbar span{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:10.5px;color:#C9CDD4;font-weight:700}
.trrow{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-top:1px dashed #23262C}
.trrow span{color:#7C818C}
.trrow b{color:#E6E9EE}
.audrow:nth-last-of-type(-n+2) .tipbox{bottom:auto;top:calc(100% + 9px)}
@media (max-width:640px){ .tip .tipbox{width:78vw} }
.audbar{height:6px;border-radius:3px;background:#24272D;overflow:hidden;margin-top:4px}
.audbar i{display:block;height:100%;border-radius:3px}
.audrow{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;margin-top:9px}
.repgrid{display:grid;grid-template-columns:repeat(var(--rn,4),minmax(0,1fr));gap:11px}
.repgrid .rc{min-width:0;padding:12px 11px}
.repgrid .rc-h h4{font-size:13px}
.repgrid .rc-h .src{margin-left:0;flex-basis:100%}
.repgrid .rc-v b{font-size:22px}
.repgrid .rc-v span{font-size:11px}
.rc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:hidden}
.rc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.rc-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rc-h h4{font-size:14px;font-weight:700;margin:0}
.rc-h .src{font-size:10.5px;color:#5E636D;margin-left:auto}
.rc-v{display:flex;align-items:baseline;gap:7px;margin:9px 0 2px}
.rc-v b{font-size:25px;font-weight:800;letter-spacing:-.8px;line-height:1}
.rc-v span{font-size:11.5px;color:var(--mut)}
.regua{display:flex;gap:3px;margin:13px 0 4px}
.regua i{height:7px;flex:1;border-radius:3px;opacity:.32}
.regua i.on{opacity:1}
.marca{position:relative;height:14px;font-size:9.5px;color:var(--mut)}
.marca span{position:absolute;transform:translateX(-50%);white-space:nowrap;top:-1px}
.rc-p{font-size:11px;color:var(--mut);border-top:1px solid var(--line);margin-top:9px;padding-top:8px;
  display:flex;gap:12px;flex-wrap:wrap}
.rc-p b{color:var(--tx);font-weight:600}
.ri{display:flex;align-items:center;gap:8px;padding:5.5px 0;border-top:1px solid var(--line);font-size:12px}
.ri .n{color:var(--mid);flex:1}
.ri .v{font-weight:700;font-size:13px}
.ri .lm{font-size:10.5px;color:#5E636D;min-width:74px;text-align:right}
.ri .sd{width:8px;height:8px;border-radius:50%;flex:none}
.alertbox{background:rgba(234,179,8,.09);border:1px solid rgba(234,179,8,.28);border-radius:8px;padding:7px 10px;
  font-size:11px;color:#FACC15;margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.alertbox.rd{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.38);color:#FCA5A5}
.alertbox.top{margin:0 0 15px;padding:11px 13px;font-size:12px;line-height:1.55}
.alertbox.top b{color:#FECACA}

/* tabela */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);
  text-align:right;padding:0 0 11px;border-bottom:1px solid var(--line2)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 0;border-bottom:1px solid var(--line);text-align:right;color:var(--mid);font-weight:500}
td:first-child{color:var(--tx);font-weight:600}
tbody tr:last-child td{border-bottom:0}
tr.tot td{color:#fff;font-weight:700}

/* canal cards */
.chc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;overflow:hidden}
.chc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.chc h3{font-size:16px;font-weight:700;margin:0}
.chc .big{font-size:28px;font-weight:800;letter-spacing:-.7px;margin:10px 0 14px;color:var(--c)}
.chc .big small{font-size:11.5px;font-weight:500;color:var(--mut);letter-spacing:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.kv b{color:var(--tx);font-weight:600}

/* atendente */
.at{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.at .top{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0A0A0B;flex:none}
.at h3{font-size:16px;font-weight:700;margin:0}
.at .role{font-size:11.5px;color:var(--mut)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:9px;overflow:hidden;margin-top:14px}
.mini div{background:var(--card2);padding:11px}
.mini .l{font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.mini .v{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.5px}

/* seletor de período */
.perbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.perbtn{border:1px solid var(--line2);background:#101114;border-radius:8px;padding:6px 13px;font-size:12.5px;
  color:var(--mid);cursor:pointer;font-family:var(--f);font-weight:600}
.perbtn:hover{color:#fff}
.perbtn.on{background:var(--orange);border-color:var(--orange);color:#0A0A0B}
.perinfo{font-size:11.5px;color:#5E636D;margin-left:4px}

/* caixa de observação */
.obsbox{display:flex;gap:9px;align-items:flex-start;background:rgba(59,130,246,.07);
  border:1px solid rgba(59,130,246,.22);border-radius:9px;padding:10px 13px;margin-bottom:11px;
  font-size:12px;color:#AFC6EA;line-height:1.6}
.obsbox b{color:#DCE9FF;font-weight:600}
.obsbox .oi{flex:none;opacity:.9}

/* capacidade */
.cap{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
.capc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;overflow:hidden}
.capc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.capc h4{font-size:14px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.capbig{display:flex;gap:16px;align-items:flex-end;margin-bottom:12px}
.capbig div{flex:1}
.capbig .l{font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.capbig .v{font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.1;margin-top:3px}
.capbig .u{font-size:10.5px;color:var(--mut);font-weight:500}
.gauge{height:6px;border-radius:4px;background:#1C1E24;overflow:hidden;margin:2px 0 4px}
.gauge i{display:block;height:100%;border-radius:4px}

/* listas */
ul.ls{margin:0;padding-left:17px;color:var(--mid);font-size:12.5px;line-height:1.7}
ul.ls li{margin-bottom:8px}
ul.ls b{color:#fff;font-weight:600}

/* empty state */
.empty-state{background:var(--card);border:1px dashed var(--line2);border-radius:12px;padding:56px 28px;text-align:center}
.empty-state .ei{font-size:38px;opacity:.35}
.empty-state h3{font-size:18px;font-weight:700;margin:14px 0 6px}
.empty-state p{color:var(--mut);font-size:13px;margin:0 auto;max-width:52ch;line-height:1.65}
.empty-state code{background:#0C0D10;border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:12px;color:#FF8A5B}

footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);color:#5E636D;font-size:11.5px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

@media (max-width:1500px){ .repgrid{grid-template-columns:repeat(min(var(--rn,4),3),minmax(0,1fr))} }
@media (max-width:1100px){ .repgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){
  .g2,.g3{grid-template-columns:1fr}

s protocolos tiveram atendente dentro de 12 horas úteis</b>; 40.0% (883 conversas) não chegaram a um humano.", "<b>12775 mensagens (39%) chegam fora da escala</b> — noites, intervalo de almoço e fins de semana — e ficam represadas até o próximo turno.", "<b>Pré-venda é o maior vazamento</b>: 2d 20h de mediana no atendimento humano, 3.0% no SLA e 22 perguntas sem resposta.", "<b>Um único atendente sustenta a Shopee</b>: 801 dos 2.205 protocolos de chat estão com Fabricio.", "<b>814 tickets de pós-venda seguiam abertos</b> (52 parados na equipe), com ciclo mediano de 5d úteis 0h de trabalho."]}, "metodo": ["<b>Jornada considerada: segunda a sexta, das 07h às 11h e das 12h às 17h</b> — 9 horas úteis por dia, 23 dias úteis no período. Todos os indicadores de tempo têm duas leituras: <b>tempo corrido</b> (relógio) e <b>tempo útil</b> (só dentro da escala).", "<b>Sara Juste iniciou em 13/07/2026.</b> Os indicadores dela cobrem 19 dias corridos (13 dias úteis), contra 31 dos demais.", "<b>Tempo útil</b> desconta noites, o intervalo das 11h às 12h e os fins de semana. Uma mensagem recebida sexta às 16h50 e respondida segunda às 7h10 conta como 30 minutos úteis, não como 62 horas.", "<b>Clientes por dia</b> é o total de conversas distintas dividido pelos dias úteis previstos na escala, não pelos dias em que houve atividade registrada. A coluna de ocupação mostra a diferença entre os dois.", "<b>Tempo por cliente</b> divide os 540 minutos úteis do dia por essa média. É o teto teórico: supõe o atendente 100% do tempo em atendimento, sem reuniões nem tarefas paralelas.", "<b>Respostas automáticas</b> reúnem IA (MIA2), mensagens automáticas do marketplace e avisos de ausência. Manuais são as digitadas por um atendente na plataforma.", "<b>SLA de protocolo de chat</b> é de 12 horas. Passamos a medir em <b>horas úteis</b>, o que é mais justo com a escala — o número corrido também aparece para comparação.", "<b>Tickets sem responsável</b> (2.569 de pós-venda) são majoritariamente mensageria automática do Mercado Livre.", "<b>Protocolos encerrados</b> (26 de 2.205) refletem registro de baixa na plataforma, não casos resolvidos.", "<b>Divisão de canais</b>: Fabricio responde a Shopee, Yasmin o Mercado Livre e Sara o Magalu e o Madeira Madeira. A seção de carga soma tudo que entrou no canal de cada um, independentemente de quem respondeu.", "<b>Mensagens automáticas do Mercado Livre.</b> Todo cliente do canal recebe avisos de nota fiscal emitida, pedido recebido e pedido entregue. São 9.727 mensagens no período (76.9% das enviadas no canal), que inflam o volume total sem representar trabalho de atendimento. Sem elas, o total do período seria 48.586 em vez de 58.313.", "<b>Ritmo necessário</b> = 540 minutos úteis do dia ÷ atendimentos que chegam por dia útil ao canal e exigem resposta humana. É o tempo máximo que o atendente pode gastar em cada caso para não virar o dia com fila. Mensagens automáticas não entram no cálculo.", "<b>Usuários administrativos foram excluídos</b> das tabelas de atendimento (Paola Miranda)."], "sara_herdados": 58}}, {"key": "2026-08", "nome": "Agosto", "ano": 2026, "status": "fechado", "dados": {"periodo": {"ini": "01/08/2026", "fim": "31/08/2026"}, "parcial": false, "kpi": {"msgs": 67334, "recebidas": 34946, "enviadas": 32388, "conversas": 10347, "auto_pct": 62.4, "manual": 6956, "ia": 7065, "pos": 4759, "reclam": 750, "pre": 392, "med_resp": "5m 07s", "p1h": 61.5, "med_resp_u": "1m 27s", "p1h_u": 64.6, "med_manual_u": "4h 31m", "p1h_manual_u": 17.1, "fechados": 850, "abertos": 1188, "aguard_atend": 140, "med_ciclo": "6d 5h", "med_ciclo_u": "4d úteis 0h", "dias_uteis": 21, "rec_jornada": 19262, "rec_fora": 15684, "man_fora": 185}, "canais": [{"id": "shopee", "nome": "Shopee", "msgs": 31661, "rec": 20533, "env": 11128, "conversas": 3998, "auto_pct": 35.4, "med": "3m 20s", "med_u": "1m 35s", "p1h": 59.1, "pos": 0, "reclam": 0, "fech_pct": 0, "pre": 0, "msg_conv": 7.9}, {"id": "mercadolivre", "nome": "Mercado Livre", "msg 27990, "tickets": 7725, "por_ticket": 3.6, "respostas": 11897, "retornos": 9454, "fechados": 2559, "reaberturas": 52, "transicoes": [{"t": "Aguardando Atendente -> Aguardando Cliente", "n": 11897}, {"t": "Aguardando Cliente -> Aguardando Atendente", "n": 9454}, {"t": "Novo -> Aguardando Cliente", "n": 1967}, {"t": "Aguardando Cliente -> Fechado", "n": 1479}, {"t": "Mensageria Automática -> Novo", "n": 1020}, {"t": "Aguardando Atendente -> Fechado", "n": 600}, {"t": "Novo -> Fechado", "n": 336}, {"t": "Mensageria Automática -> Bloqueado", "n": 233}], "pingpong_med": 2.0, "pingpong_max": 20, "muitos": 44, "muitos_pct": 0.6, "fecha_hora": [{"h": 0, "n": 226}, {"h": 1, "n": 101}, {"h": 2, "n": 99}, {"h": 3, "n": 511}, {"h": 4, "n": 92}, {"h": 5, "n": 86}, {"h": 6, "n": 27}, {"h": 7, "n": 5}, {"h": 9, "n": 39}, {"h": 10, "n": 65}, {"h": 11, "n": 84}, {"h": 12, "n": 70}, {"h": 13, "n": 94}, {"h": 14, "n": 41}, {"h": 15, "n": 44}, {"h": 16, "n": 91}, {"h": 17, "n": 123}, {"h": 18, "n": 68}, {"h": 19, "n": 386}, {"h": 20, "n": 56}, {"h": 21, "n": 23}, {"h": 22, "n": 88}, {"h": 23, "n": 140}]}}, "sara_herdados": 0, "leitura": {"bom": ["<b>O canal cresceu 15% e o tempo de resposta melhorou</b>: 67.334 mensagens contra 58.313 em julho, com mediana útil de 1m 27s (era 1m 50s).", "<b>O SLA de chat saltou de 35.8% para 50.0%</b> e a fatia de protocolos que nunca chegou a um humano caiu de 40.0% para 33.7%, mesmo com o volume de protocolos subindo 72%.", "<b>Reclamações formais caíram para 750</b> (eram 767 em julho) enquanto o pós-venda subiu 32%, para 4.759 tickets — mais volume gerando menos conflito formal.", "<b>O ciclo de resolução encurtou</b>: mediana de 4d úteis 0h de trabalho, contra 5d úteis 0h em julho.", "<b>Magalu é o canal que resolve</b>: 57.5% dos tickets fechados e 84.8% de SLA do marketplace, contra 10.0% de fechamento no Mercado Livre.", "<b>Sara mantém o melhor desempenho individual</b>: mediana de 2h 04m em horário útil, 57.3% de fechamento e 94.2% de SLA no chat.", "<b>O agente virtual converte 13.3%</b> das perguntas de pré-venda respondendo em 31s."], "ruim": ["<b>Fecha-se menos do que entra.</b> Os tickets fechados caíram de 1.042 (julho) para 850, enquanto os abertos subiram de 814 para 1.188 — 140 deles parados na equipe. É a fila crescendo mês a mês.", "<b>Pré-venda é o pior indicador do mês</b>: 96 das 392 perguntas ficaram sem resposta (24.5%, contra 8% em julho), com 2.3% de SLA e mediana de 1d 23h no atendimento humano.", "<b>A Shopee entrou em zona crítica de ritmo</b>: 1.726 atendimentos exigindo resposta humana em 21 dias úteis dão <b>6.6 minutos por caso</b> — o mais apertado já registrado — e o canal cumpre só 12.5% do SLA do marketplace.", "<b>15.684 mensagens (45%) chegam fora da escala</b> — noites, intervalo de almoço e fins de semana. A fatia subiu de 39% em julho para 45%.", "<b>1.283 protocolos de chat (33.7%) não chegaram a nenhum atendente</b> e 2.139 dos 3.803 seguem sem responsável designado.", "<b>Metade dos prazos do marketplace estourou</b>: 745 de 1.458 tickets com prazo encerrado dentro do SLA (51.1%), com outros 7.439 ainda correndo.", "<b>Fabricio responde em 5h 20m de mediana útil</b> e só 7.4% em até 1 hora — reflexo de sustentar sozinho 1.193 protocolos de chat da Shopee."]}, "metodo": ["<b>Mês fechado.</b> Os dados cobrem 01/08/2026 a 31/08/2026 — 31 dias corridos e 21 dias úteis — e substituem a leitura parcial que ia até 28/08. Todos os totais mudaram, inclusive o dia 28, que na leitura anterior estava incompleto (500 mensagens contra 2.924 no fechamento).", "<b>Jornada considerada: segunda a sexta, das 07h às 11h e das 12h às 17h</b> — 9 horas úteis por dia. Todos os indicadores de tempo têm duas leituras: <b>tempo corrido</b> (relógio) e <b>tempo útil</b> (só dentro da escala).", "<b>Tempo útil</b> desconta noites, o intervalo das 11h às 12h e os fins de semana. Uma mensagem recebida sexta às 16h50 e respondida segunda às 7h10 conta como 30 minutos úteis, não como 62 horas.", "<b>Comparação com julho.</b> Julho teve 23 dias úteis e agosto 21. Indicadores por dia útil já corrigem essa diferença; totais absolutos, não — agosto cresceu 15% em mensagens com dois dias úteis a menos.", "<b>Paola Miranda não é atendente.</b> É usuária administrativa e não faz parte da equipe de atendimento. Nos dias 27 e 28/08 ela respondeu 302 protocolos e 294 mensagens, todas da Shopee — mutirão para limpar o gargalo acumulado do canal, não rotina de atendimento. Aparece na tabela de responsáveis do chat porque o volume é material, sempre marcada como apoio, e fica fora das tabelas de atendentes, de carga e de capacidade.", "<b>Clientes por dia</b> é o total de conversas distintas dividido pelos dias úteis previstos na escala, não pelos dias em que houve atividade registrada. A coluna de ocupação mostra a diferença entre os dois.", "<b>Tempo por cliente</b> divide os 540 minutos úteis do dia por essa média. É o teto teórico: supõe o atendente 100% do tempo em atendimento, sem reuniões nem tarefas paralelas.", "<b>Respostas automáticas</b> reúnem IA (MIA2), mensagens automáticas do marketplace e avisos de ausência. Manuais são as digitadas por um atendente na plataforma. Respostas dadas direto no marketplace aparecem como \"por fora\" e não entram em nenhum dos dois grupos.", "<b>SLA de protocolo de chat</b> é de 12 horas, medido em <b>horas úteis</b> — o número corrido também aparece para comparação.", "<b>Tickets sem responsável</b> (3.608 de pós-venda) são majoritariamente mensageria automática do Mercado Livre.", "<b>Protocolos encerrados</b> (317 de 3.803) refletem registro de baixa na plataforma, não casos resolvidos.", "<b>Divisão de canais</b>: Fabricio responde a Shopee, Yasmin o Mercado Livre e Sara o Magalu e o Madeira Madeira. A seção de carga soma tudo que entrou no canal de cada um, independentemente de quem respondeu.", "<b>Mensagens automáticas do Mercado Livre.</b> Todo cliente do canal recebe avisos de nota fiscal emitida, pedido recebido e pedido entregue. São 14.250 mensagens no período (83.3% das enviadas no canal), que inflam o volume total sem representar trabalho de atendimento. Sem elas, o total do mês seria 53.084 em vez de 67.334.", "<b>Ritmo necessário</b> = 540 minutos úteis do dia ÷ atendimentos que chegam por dia útil ao canal e exigem resposta humana. É o tempo máximo que o atendente pode gastar em cada caso para não virar o dia com fila. Mensagens automáticas não entram no cálculo.", "<b>Via Varejo aparece na aba Reputação, mas não nos gráficos por canal.</b> São duas coisas diferentes: a reputação é a nota da conta no marketplace, enquanto os gráficos de volume vêm do Predize, onde o canal registrou 84 mensagens em agosto (0,1% do total) e segue somado apenas aos totais gerais. É justamente esse contraste que explica a nota baixa: base pequena de pedidos, em que cada problema pesa muito no percentual.", "<b>Efeito da MIA</b> compara a média de retornos do cliente por ticket entre atendimentos que tiveram resposta da IA e os que não tiveram, considerando só tickets com histórico de mudança de status."], "tempo_real": {"limiar": 15, "dias_uteis": 21, "atendentes": [{"nome": "Yasmin Fernandes", "tickets": 1256, "msgs": 2671, "blocos": 106, "ativo_min": 6346.0, "ativo_h": 105.8, "por_atend": 5.1, "por_msg": 2.4, "ativo_dia_h": 5.0, "ocupacao": 56, "dias_ativos": 22, "msgs_atend": 2.1, "teto": 9.0, "uso_pct": 57}, {"nome": "Fabricio Barros", "tickets": 1391, "msgs": 2238, "blocos": 120, "ativo_min": 4078.4, "ativo_h": 68.0, "por_atend": 2.9, "por_msg": 1.8, "ativo_dia_h": 3.2, "ocupacao": 36, "dias_ativos": 20, "msgs_atend": 1.6, "teto": 8.2, "uso_pct": 35}, {"nome": "Sara Juste", "tickets": 709, "msgs": 1752, "blocos": 196, "ativo_min": 5864.2, "ativo_h": 97.7, "por_atend": 8.3, "por_msg": 3.3, "ativo_dia_h": 4.7, "ocupacao": 52, "dias_ativos": 23, "msgs_atend": 2.5, "teto": 16.0, "uso_pct": 52}], "equipe": {"por_atend": 4.9, "por_msg": 2.4, "ativo_h": 271.5, "tickets": 3356, "msgs": 6661, "oc     <div class="slab">Histórico diário</div>

        <thead><tr><th style="text-align:left">Canal</th><th style="text-align:left">Indicador</th>${HIST.datas.map((d,k)=>`<th${k===HIST.datas.length-1?' class="hj"':''}>${d}</th>`).join('')}<th>Var.</th></tr></thead>
        <tbody>${HIST.series.map(sr=>{
          const vals=sr.v, ult=vals[vals.length-1], prim=vals.find(x=>x!==null);

          const cor=Math.abs(dif)<0.005?'#7C818C':(melhor>0?'#22C55E':'#F87171');
          const seta=Math.abs(dif)<0.005?'=':(melhor>0?'▲':'▼');
          const fmt=x=>x===null?'<span style="color:#3A3D44">—</span>':(sr.un==='%'?x.toFixed(2).replace('.',','):x.toFixed(2).replace('.',','));

              return `<td style="color:${c}${k===vals.length-1?';font-weight:700':''}"${k===vals.length-1?' class="hj"':''}>${fmt(x)}</td>`;
            }).join('')}

        }).join('')}</tbody></table></div>
      <div class="note">Verde e vermelho marcam a direção da variação em relação à leitura anterior, já considerando que no Mercado Livre <b>menos é melhor</b>. A coluna final compara a leitura de hoje com a primeira do acompanhamento. Em um mês, a <b>Shopee subiu 4,75 pontos</b> de taxa de resposta e é o único canal com saldo positivo — ainda que já tenha devolvido 3,48 pontos desde o pico de 11/09, em cinco leituras seguidas de queda. O <b>Mercado Livre é a série que mudou de patamar</b>: oscilava entre 0,88% e 0,93% até 08/09 e não desce de 0,97% desde 14/09 — agora em 1,05%, acima do teto. O <b>Magalu</b> está parado em 4,3 há 14 leituras e o <b>Reclame Aqui</b> em 6,1. Madeira Madeira e Via Varejo saíram do acompanhamento nesta edição. As datas não são diárias corridas: correspondem às leituras efetivamente capturadas dos painéis.</div></div>

    <details class="met" style="margin-top:14px"><summary>Como atualizar estes números</summary>
      <ul class="ls"><li>Os dados ficam no bloco <b>REP</b>, no início do script deste arquivo, separados dos dados mensais.</li>
      <li>Troque os valores de cada canal e a data em <b>atualizado</b>. O campo <b>st</b> define a cor (<b>ok</b>, <b>atencao</b>, <b>ruim</b>) e <b>nivel</b> posiciona o marcador na régua de 0 a 5.</li>

}

function pintaTabs(){
  const t=[`<button class="tab ${atual==='geral'?'on':''}" data-k="geral"><i></i>Visão Geral</button>`,
    `<button class="tab ${atual==='rep'?'on':''}" data-k="rep"><i></i>Reputação <span class="bdg or">Diário</span></button>`,
    `<button class="tab ${atual==='ra'?'on':''}" data-k="ra"><i></i>Reclame Aqui <span class="bdg or">Regular</span></button>`];
  DATA.meses.forEach(m=>{
    const b = m.status==='fechado' ? '<span class="bdg gr">Fechado</span>'
            : m.status==='parcial' ? '<span class="bdg or">Parcial</span>'
            : '<span class="bdg gy">Aguardando</span>';
    t.push(`<button class="tab ${atual===m.key?'on':''} ${m.status==='fechado'&&atual!==m.key?'done':''}" data-k="${m.key}"><i></i>${m.nome} ${m.ano} ${b}</button>`);
  });
  el('tabs').innerHTML=t.join('');
  el('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{atual=b.dataset.k;pintaTabs();pintaTopo();render();window.scrollTo({top:0,behavior:'smooth'})});
}

      <tbody>${D.pre.tipos.map(t=>`<tr><td>${t.t}</td><td>${t.n}</td><td>${t.med}</td><td>${t.sla}%</td><td>${t.venda}%</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td>${D.pre.total}</td><td>—</td><td>${D.pre.sla}%</td><td>${D.pre.venda}%</td></tr></tbody></table>
      <div class="note green">O agente virtual responde em <b>${D.pre.tipos.find(t=>t.t==='Agente Virtual').med}</b> e converte <b>${D.pre.tipos.find(t=>t.t==='Agente Virtual').venda}%</b>; o humano leva ${D.pre.tipos.find(t=>t.t==='Agente Humano').med} e converte ${D.pre.tipos.find(t=>t.t==='Agente Humano').venda}%. ${D.pre.sem_resposta} perguntas ficaram sem resposta.</div></div>
    <div class="panel"><p class="pt">Pré-venda por atendente</p>
      <table><thead><tr><th>Atendente</th><th>Perguntas</th><th>Resposta mediana</th><th>No SLA</th></tr></thead>
      <tbody>${D.atendentes.map(a=>`<tr><td><span class="dot" style="background:${AVC[a.nome]};margin-right:8px"></span>${a.nome}</td><td>${a.pre}</td><td>${a.pre_med}</td><td>${a.pre_sla}%</td></tr>`).join('')}
      <tr><td>Virtual / sem atendente</td><td>${D.sem_atendente.pre}</td><td>—</td><td>—</td></tr></tbody></table>
      <div class="note">Além destas ${D.pre.total} perguntas de anúncio, o chat trouxe outras <b>${NB(C.contexto.find(c=>c.c==='Pré-Venda').n)} conversas de pré-venda</b>, das quais ${C.contexto.find(c=>c.c==='Pré-Venda').hum}% chegaram a um atendente.</div></div></div>`;

  h += `<div class="slab">Leitura do mês</div><div class="g2">
    <div class="panel"><p class="pt">✅ O que está funcionando</p><ul class="ls">${D.leitura.bom.map(x=>'<li>'+x+'</li>').join('')}</ul></div>
    <div class="panel"><p class="pt">⚠️ O que exige ação</p><ul class="ls">${D.leitura.ruim.map(x=>'<li>'+x+'</li>').join('')}</ul></div></div>`;

  h += `<div class="slab">Notas</div><details class="met"><summary>Como ler estes números · critérios de cálculo</summary>
    <ul class="ls">${D.metodo.map(x=>'<li>'+x+'</li>').join('')}</ul></details>`;
  return h;
}

  })();

    el('ra-mes').appendChild(s);
    const med=(M.filter(m=>!m.parcial).reduce((a,b)=>a+b.n,0)/6).toFixed(1);
    el('ra-nmes').innerHTML=`${(()=>{const ch=M.filter(x=>!x.parcial),ult=ch[ch.length-1],pen=ch[ch.length-2],pc=M.find(x=>x.parcial);
      return `Depois de cinco meses entre <b>32 e 41 reclamações</b>, <b>${ult.m==='Ago'?'agosto':ult.m} fechou em ${ult.n}</b> — queda de ${Math.round((1-ult.n/pen.n)*100)}% sobre o mês anterior e o menor volume da janela.`+
        (pc?` Setembro aparece com ${pc.n} porque a janela cobre só os ${RA.periodos.semestre.janela.slice(-10,-8)} primeiros dias do mês.`:'')+
        ` É a primeira quebra do platô, mas ainda é um mês só: setembro fechado é que confirma se virou tendência.`;})()} <span style="color:#5E636D">* mês parcial.</span>`;
  }
  /* notas */
  if(el('ra-notas')&&P.top_avaliadas.length){
    const N=P.notas,W=1000,H=200,p={l:30,r:8,t:16,b:26};
    const iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/11;
    const max=Math.max(...Object.values(N)),y=v=>p.t+ih-(v/max)*ih,s=svg(W,H);
    const step=Math.max(1,Math.ceil(max/5));
    for(let i=0;i<=max;i+=step){s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:y(i),y2:y(i),stroke:'#212329'}));
      s.appendChild(tx(p.l-7,y(i)+3.5,i,{anchor:'end',size:9.5}));}
    for(let n=10;n>=0;n--){const v=N[n]||0,x=p.l+(10-n)*bw;
      const cor=n>=9?'#22C55E':n>=7?'#84CC16':n>=5?'#EAB308':n>=3?'#FF6B35':'#EF4444';
      if(v){s.appendChild(mk('rect',{x:x+bw*.22,y:y(v),width:bw*.56,height:ih-(y(v)-p.t),fill:cor,rx:3,opacity:.9}));
        s.appendChild(tx(x+bw/2,y(v)-6,v,{size:11,fill:'#fff',weight:700}));}
      s.appendChild(tx(x+bw/2,H-p.b+16,n,{size:10.5}));}
    el('ra-notas').appendChild(s);
    const prom=(N[10]||0)+(N[9]||0),det=Object.entries(N).filter(([n])=>+n<=6).reduce((a,b)=>a+b[1],0);
    el('ra-nnotas').innerHTML=`<b>${N[0]||0} avaliações nota zero</b> contra ${prom} notas 9 e 10. Os detratores (até 6) somam ${det} das ${P.avaliadas}, o que puxa a média para ${(P.nota_media??RA.nota_consumidor).toFixed(2).replace('.',',')}/10. A concentração no extremo zero é típica de cliente que avaliou depois de desistir — e é o indicador mais lento de virar, porque só se move quando um cliente novo avalia bem.`;
  }
  /* problemas e produtos */
  [['ra-prob',P.problemas,'#EF4444'],['ra-prod',P.produtos,'#3B82F6'],['ra-cat',P.categorias||[],'#A855F7']].forEach(([id,arr,cor])=>{
    if(!el(id)||!arr.length)return;
    const W=1000,rh=34,H=arr.length*rh+8,mx=Math.max(...arr.map(a=>a.v)),bx=330,s=svg(W,H);
    arr.forEach((a,i)=>{const y=i*rh+8,w=(a.v/mx)*(W-bx-110);
      s.appendChild(tx(0,y+16,a.p,{anchor:'start',size:12.5,fill:'#B7BBC4'}));
      s.appendChild(mk('rect',{x:bx,y:y+3,width:Math.max(2,w),height:18,fill:cor,rx:4,opacity:i===0?.92:.55}));
      s.appendChild(tx(bx+w+10,y+17,a.v.toFixed(2).replace('.',',')+'%',{anchor:'start',size:11}));});
    el(id).appendChild(s);
  });
  /* temas */
  (function(){
    const T=P.temas,W=1000,rh=34,H=T.length*rh+8,mx=Math.max(...T.map(t=>t.v)),bx=400,s=svg(W,H);
    T.forEach((t,i)=>{const y=i*rh+8,w=(t.v/mx)*(W-bx-120);
      const lbl=t.t.length>48?t.t.slice(0,46)+'…':t.t;
      s.appendChild(tx(0,y+16,`${i+1}. ${lbl}`,{anchor:'start',size:12.5,fill:'#B7BBC4'}));
      s.appendChild(mk('rect',{x:bx,y:y+3,width:Math.max(2,w),height:18,fill:i===0?'#EF4444':'#FF6B35',rx:4,opacity:i===0?.92:.6}));
      s.appendChild(tx(bx+w+10,y+17,NB(t.v)+' visualizações',{anchor:'start',size:11}));});
    el('ra-tema').appendChild(s);
  })();
}

/* ---------- render ---------- */
/* ======================================================
   LEITURAS RECOLHIDAS
   Toda nota interpretativa (.note) e caixa de observação (.obsbox)
   vira um marcador "!" que só revela o texto no hover.
   ====================================================== */
function leituras(root){
  if(!root) return;
  root.querySelectorAll('.note, .obsbox').forEach(n=>{
    if(n.dataset.le) return;
    const txt=(n.textContent||'').trim();
    if(!txt) return;                       // notas ainda vazias (gráficos) são tratadas depois
    let cls='', rot='Leitura';
    const st=(n.getAttribute('style')||'');
    if(n.classList.contains('obsbox')){
      if(/239,68,68/.test(st)){cls=' ru';rot='Alerta';}
      else if(/234,179,8/.test(st)){cls=' al';rot='Atenção';}
      else if(/34,197,94/.test(st)){cls=' bo';rot='Destaque';}
      else {rot='Observação';}
    }
    const html=n.innerHTML.replace(/<span class="oi">[^<]*<\/span>/,'').replace(/^\s*<span>|<\/span>\s*$/g,'');
    const span=document.createElement('span');
    span.className='le'+cls;
    span.dataset.le='1';
    span.innerHTML='<i>!</i>'+rot+'<span class="tipbox">'+html+'</span>';
    span.title='';
    n.replaceWith(span);
  });
  // tooltips perto da borda direita abrem alinhados à direita; os do fim da página, para baixo
  const lg=root.getBoundingClientRect?root.getBoundingClientRect():null;
  root.querySelectorAll('.le').forEach(e=>{
    const r=e.getBoundingClientRect();
    if(lg && r.left-lg.left > lg.width*0.55) e.classList.add('right');
    if(r.top < 260) e.classList.add('down');
  });
}

function render(){
  const v=el('view');
  if(atual==='ra'){v.innerHTML=`<div class="fade">${viewRA()}</div>`;graficosRA();leituras(v);return;}
  if(atual==='rep'){v.innerHTML=`<div class="fade">${viewRep()}</div>`;leituras(v);return;}
  if(atual==='geral'){v.innerHTML=`<div class="fade">${viewGeral()}</div>`;leituras(v);return;}
  const m=DATA.meses.find(x=>x.key===atual);
  v.innerHTML=`<div class="fade">${viewMes(m)}</div>`;
  if(m.dados) graficos(m.dados);
  leituras(v);
}
pintaRepBar();pintaTabs();pintaTopo();render();
