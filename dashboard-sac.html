<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Atendimento SAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B; --bar:#000; --card:#141518; --card2:#17181C; --line:#26282E; --line2:#33363E;
  --tx:#FFFFFF; --mid:#B7BBC4; --mut:#7C818C;
  --orange:#FF6B35; --blue:#3B82F6; --green:#22C55E; --purple:#A855F7;
  --yellow:#EAB308; --cyan:#06B6D4; --red:#EF4444; --pink:#EC4899;
  --shopee:#FF6B35; --meli:#EAB308; --magalu:#3B82F6; --madeira:#22C55E;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1330px;margin:0 auto;padding:0 20px 80px}

/* topbar */
.topbar{background:var(--bar);border-bottom:1px solid var(--line);padding:7px 0;margin-bottom:12px}
.topbar .in{max-width:1330px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px}
.chipbtn{border:1px solid var(--line2);background:#131417;border-radius:7px;padding:4px 10px;font-size:12px;
  color:var(--mid);font-weight:500}
.topbar .t{font-size:12.5px;color:var(--mid)}

/* hero */
.hero{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:linear-gradient(100deg,rgba(255,107,53,.16) 0%, rgba(255,107,53,.03) 32%, rgba(20,21,24,1) 62%),var(--card);
  padding:13px 16px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.hero .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(140deg,#FF8A3D,#F0522B);flex:none;box-shadow:0 6px 18px rgba(255,107,53,.28)}
.hero h1{font-size:17px;font-weight:800;letter-spacing:.4px;margin:0;text-transform:uppercase}
.hero p{margin:2px 0 0;color:var(--mut);font-size:11.5px}
.hero .pills{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:999px;padding:4px 11px;
  font-size:11px;font-weight:600;background:rgba(0,0,0,.35)}
.pill.g{border-color:rgba(34,197,94,.5);color:#4ADE80}
.pill.b{border-color:rgba(59,130,246,.5);color:#60A5FA}
.pill.o{border-color:rgba(255,107,53,.5);color:#FF8A5B}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}


/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:16px 0 0;
  scrollbar-width:thin}
.tab{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;font-size:13px;color:var(--mut);
  font-weight:500;border:0;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
  font-family:var(--f)}
.tab i{width:7px;height:7px;border-radius:50%;background:#3A3D45;display:inline-block;flex:none}
.tab:hover{color:var(--mid)}
.tab.on{color:var(--orange);border-bottom-color:var(--orange)}
.tab.on i{background:var(--orange);box-shadow:0 0 0 3px rgba(255,107,53,.18)}
.tab.done i{background:var(--green)}
.tab .bdg{font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:5px;text-transform:uppercase}
.bdg.gr{background:rgba(34,197,94,.16);color:#4ADE80}
.bdg.or{background:rgba(255,107,53,.16);color:#FF8A5B}
.bdg.gy{background:#202329;color:var(--mut)}
.bdg.rd{background:rgba(239,68,68,.16);color:#F87171}
.tab:focus-visible{outline:2px solid var(--orange);outline-offset:-4px;border-radius:6px}

/* section label */
.slab{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);
  margin:26px 0 11px;display:flex;align-items:center;gap:12px}
.slab::after{content:"";flex:1;height:1px;background:var(--line)}
.slab .hint{font-size:11px;font-weight:500;letter-spacing:.2px;text-transform:none;color:#5E636D}

/* kpi cards */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:11px}
.kc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 15px 14px;
  overflow:hidden}
.kc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--g)}
.kc .lab{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.kc .val{font-size:26px;font-weight:800;letter-spacing:-.7px;margin:8px 0 0;line-height:1.05;color:var(--c)}
.kc .sub{font-size:12px;color:var(--mut);margin-top:6px}
.kc .gh{position:absolute;right:14px;bottom:14px;font-size:30px;opacity:.09;pointer-events:none}
.kc .bdg2{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:11px;font-weight:600;
  padding:4px 9px;border-radius:6px}
.b-ok{background:rgba(34,197,94,.13);color:#4ADE80}
.b-wr{background:rgba(234,179,8,.13);color:#FACC15}
.b-al{background:rgba(239,68,68,.14);color:#F87171}
.b-nt{background:rgba(59,130,246,.13);color:#60A5FA}

/* mês cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 14px;text-align:center}
.mc .mn{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.mc .mv{font-size:29px;font-weight:800;letter-spacing:-.7px;margin:9px 0 3px;color:var(--c)}
.mc .ms{font-size:12px;color:var(--mid);font-weight:600}
.mc .mf{font-size:10.5px;color:#5E636D;margin-top:9px}
.mc.empty{border-style:dashed;opacity:.55}
.mc.empty .mv{color:#3A3D45}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.pt{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);margin:0 0 12px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pt small{font-weight:500;letter-spacing:.2px;text-transform:none;color:#5E636D;font-size:11.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:11.5px;color:var(--mid);margin-top:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.note{margin-top:12px;padding:10px 12px;background:#101114;border:1px solid var(--line);border-left:3px solid var(--orange);
  border-radius:8px;color:var(--mid);font-size:12.5px;line-height:1.65}
.note b{color:#fff;font-weight:600}
details.met{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
details.met summary{cursor:pointer;font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);list-style:none}
details.met summary::-webkit-details-marker{display:none}
details.met summary::before{content:'▸ ';color:var(--orange)}
details.met[open] summary::before{content:'▾ '}
details.met ul{margin-top:12px}
.note.blue{border-left-color:var(--blue)}
.note.green{border-left-color:var(--green)}

/* barra-resumo de reputação */
.repbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:7px 11px;margin-top:10px}
.repbar .tt{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.repchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#101114;
  border-radius:999px;padding:5px 11px;font-size:12px;color:var(--mid);cursor:pointer;font-family:var(--f)}
.repchip:hover{border-color:var(--line2)}
.repchip b{color:#fff;font-weight:700}
.repchip .sd{width:8px;height:8px;border-radius:50%;flex:none}
.repbar .lk{margin-left:auto;font-size:11.5px;color:var(--orange);cursor:pointer;background:none;border:0;
  font-family:var(--f);font-weight:600}

/* reputação */
.tbhist th,.tbhist td{text-align:center;padding:7px 4px;font-size:11px;white-space:nowrap}
/* a série cresce a cada leitura: aperta as colunas de data para caberem sem rolagem */
.tbhist th:nth-child(n+3):nth-last-child(n+2),.tbhist td:nth-child(n+3):nth-last-child(n+2){padding:7px 3px;font-size:10.5px}
.tbhist td:first-child,.tbhist th:first-child,.tbhist td:nth-child(2),.tbhist th:nth-child(2){text-align:left}
.tbhist .hj{background:rgba(255,255,255,.04)}
.aud{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:11px}
.aud .rc{overflow:visible}
.aud .rc::before{border-radius:12px 12px 0 0}
.tip{position:relative;cursor:help;border-bottom:1px dotted #4A4E56}
.tip .tipbox{visibility:hidden;opacity:0;position:absolute;left:0;bottom:calc(100% + 9px);width:min(330px,72vw);
  background:#14171B;border:1px solid #333740;border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.55;
  color:#C9CDD4;font-weight:400;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.55);transition:opacity .14s;
  pointer-events:none;text-align:left;white-space:normal;letter-spacing:0}
.tip .tipbox b{color:#F0F2F5}
.tip .tipbox em{color:#7C818C;font-style:normal;display:block;margin-top:6px;font-size:11px}
.tip:hover .tipbox{visibility:visible;opacity:1}
.tip.tr .tipbox{left:auto;right:0}
.le{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:10px;cursor:help;
  background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.28);color:#93C5FD;
  border-radius:999px;padding:3px 10px 3px 4px;font-size:11px;font-weight:600;letter-spacing:.2px;
  transition:background .14s,border-color .14s}
.le:hover{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.5)}
.le>i{width:16px;height:16px;border-radius:50%;background:#3B82F6;color:#0B0D10;
  display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;flex:0 0 16px}
.le.al{background:rgba(234,179,8,.10);border-color:rgba(234,179,8,.30);color:#FDE68A}
.le.al>i{background:#EAB308}
.le.ru{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.30);color:#FCA5A5}
.le.ru>i{background:#EF4444}
.le.bo{background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.30);color:#86EFAC}
.le.bo>i{background:#22C55E}
.le .tipbox{visibility:hidden;opacity:0;position:absolute;left:0;bottom:calc(100% + 9px);width:min(460px,80vw);
  background:#14171B;border:1px solid #333740;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.6;
  color:#C9CDD4;font-weight:400;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.55);transition:opacity .14s;
  pointer-events:none;text-align:left;white-space:normal;letter-spacing:0}
.le .tipbox b{color:#F0F2F5}
.le:hover .tipbox{visibility:visible;opacity:1}
.le.down .tipbox{bottom:auto;top:calc(100% + 9px)}
.le.right .tipbox{left:auto;right:0}
.trg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px}
.trc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}
.trc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c);border-radius:12px 12px 0 0}
.trc:has(.le:hover){z-index:5}
.trc h4{font-size:13.5px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.trc .big{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.trc .big small{font-size:13px;font-weight:600;letter-spacing:0;margin-left:3px}
.trc .cap2{font-size:10.5px;color:#7C818C;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.trbar{position:relative;height:22px;background:#1C1F24;border-radius:5px;margin:11px 0 5px;overflow:hidden}
.trbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.trbar b{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.85}
.trbar span{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:10.5px;color:#C9CDD4;font-weight:700}
.trrow{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-top:1px dashed #23262C}
/* capacidade real: barra empilhada demanda = entregue + só IA + sem nada */
.fbar{position:relative;height:26px;background:#1C1F24;border-radius:5px;margin:10px 0 6px;display:flex;overflow:hidden}
.fbar i{display:block;height:100%}
.fleg{display:flex;flex-wrap:wrap;gap:5px 13px;font-size:10.5px;color:#7C818C;margin-bottom:9px}
.fleg span{display:flex;align-items:center;gap:5px}
.fleg u{width:9px;height:9px;border-radius:2px;text-decoration:none;flex:none}
/* repartição da jornada */
.jbar{position:relative;height:30px;background:#1C1F24;border-radius:6px;display:flex;overflow:hidden;margin:9px 0 7px}
.jbar i{display:flex;align-items:center;justify-content:center;height:100%;font-size:10.5px;font-weight:700;color:#0B0D10;white-space:nowrap;overflow:hidden}
.trrow span{color:#7C818C}
.trrow b{color:#E6E9EE}
.audrow:nth-last-of-type(-n+2) .tipbox{bottom:auto;top:calc(100% + 9px)}
@media (max-width:640px){ .tip .tipbox{width:78vw} }
.audbar{height:6px;border-radius:3px;background:#24272D;overflow:hidden;margin-top:4px}
.audbar i{display:block;height:100%;border-radius:3px}
.audrow{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;margin-top:9px}
.repgrid{display:grid;grid-template-columns:repeat(var(--rn,4),minmax(0,1fr));gap:11px}
.repgrid .rc{min-width:0;padding:12px 11px}
.repgrid .rc-h h4{font-size:13px}
.repgrid .rc-h .src{margin-left:0;flex-basis:100%}
.repgrid .rc-v b{font-size:22px}
.repgrid .rc-v span{font-size:11px}
.rc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.rc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c);border-radius:12px 12px 0 0}
.rc:has(.le:hover){z-index:5}
.rc-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rc-h h4{font-size:14px;font-weight:700;margin:0}
.rc-h .src{font-size:10.5px;color:#5E636D;margin-left:auto}
.rc-v{display:flex;align-items:baseline;gap:7px;margin:9px 0 2px}
.rc-v b{font-size:25px;font-weight:800;letter-spacing:-.8px;line-height:1}
.rc-v span{font-size:11.5px;color:var(--mut)}
.regua{display:flex;gap:3px;margin:13px 0 4px}
.regua i{height:7px;flex:1;border-radius:3px;opacity:.32}
.regua i.on{opacity:1}
.marca{position:relative;height:14px;font-size:9.5px;color:var(--mut)}
.marca span{position:absolute;transform:translateX(-50%);white-space:nowrap;top:-1px}
.rc-p{font-size:11px;color:var(--mut);border-top:1px solid var(--line);margin-top:9px;padding-top:8px;
  display:flex;gap:12px;flex-wrap:wrap}
.rc-p b{color:var(--tx);font-weight:600}
.ri{display:flex;align-items:center;gap:8px;padding:5.5px 0;border-top:1px solid var(--line);font-size:12px}
.ri .n{color:var(--mid);flex:1}
.ri .v{font-weight:700;font-size:13px}
.ri .lm{font-size:10.5px;color:#5E636D;min-width:74px;text-align:right}
.ri .sd{width:8px;height:8px;border-radius:50%;flex:none}
.alertbox{background:rgba(234,179,8,.09);border:1px solid rgba(234,179,8,.28);border-radius:8px;padding:7px 10px;
  font-size:11px;color:#FACC15;margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.alertbox.rd{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.38);color:#FCA5A5}
.alertbox.cor{background:rgba(59,130,246,.10);border-color:rgba(59,130,246,.35);color:#BFDBFE}
.alertbox.cor b{color:#DBEAFE}
.alertbox.top{margin:0 0 15px;padding:11px 13px;font-size:12px;line-height:1.55}
.alertbox.top b{color:#FECACA}

/* tabela */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);
  text-align:right;padding:0 0 11px;border-bottom:1px solid var(--line2)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 0;border-bottom:1px solid var(--line);text-align:right;color:var(--mid);font-weight:500}
td:first-child{color:var(--tx);font-weight:600}
tbody tr:last-child td{border-bottom:0}
tr.tot td{color:#fff;font-weight:700}

/* canal cards */
.chc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;overflow:hidden}
.chc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.chc h3{font-size:16px;font-weight:700;margin:0}
.chc .big{font-size:28px;font-weight:800;letter-spacing:-.7px;margin:10px 0 14px;color:var(--c)}
.chc .big small{font-size:11.5px;font-weight:500;color:var(--mut);letter-spacing:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.kv b{color:var(--tx);font-weight:600}

/* atendente */
.at{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.at .top{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0A0A0B;flex:none}
.at h3{font-size:16px;font-weight:700;margin:0}
.at .role{font-size:11.5px;color:var(--mut)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:9px;overflow:hidden;margin-top:14px}
.mini div{background:var(--card2);padding:11px}
.mini .l{font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.mini .v{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.5px}

/* seletor de período */
.perbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.perbtn{border:1px solid var(--line2);background:#101114;border-radius:8px;padding:6px 13px;font-size:12.5px;
  color:var(--mid);cursor:pointer;font-family:var(--f);font-weight:600}
.perbtn:hover{color:#fff}
.perbtn.on{background:var(--orange);border-color:var(--orange);color:#0A0A0B}
.perinfo{font-size:11.5px;color:#5E636D;margin-left:4px}

/* caixa de observação */
.obsbox{display:flex;gap:9px;align-items:flex-start;background:rgba(59,130,246,.07);
  border:1px solid rgba(59,130,246,.22);border-radius:9px;padding:10px 13px;margin-bottom:11px;
  font-size:12px;color:#AFC6EA;line-height:1.6}
.obsbox b{color:#DCE9FF;font-weight:600}
.obsbox .oi{flex:none;opacity:.9}

/* capacidade */
.cap{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
.capc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;overflow:hidden}
.capc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.capc h4{font-size:14px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.capbig{display:flex;gap:16px;align-items:flex-end;margin-bottom:12px}
.capbig div{flex:1}
.capbig .l{font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.capbig .v{font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.1;margin-top:3px}
.capbig .u{font-size:10.5px;color:var(--mut);font-weight:500}

s protocolos tiveram atendente dentro de 12 horas úteis</b>; 40.0% (883 conversas) não chegaram a um humano.", "<b>12775 mensagens (39%) chegam fora da escala</b> — noites, intervalo de almoço e fins de semana — e ficam represadas até o próximo turno.", "<b>Pré-venda é o maior vazamento</b>: 2d 20h de mediana no atendimento humano, 3.0% no SLA e 22 perguntas sem resposta.", "<b>Um único atendente sustenta a Shopee</b>: 801 dos 2.205 protocolos de chat estão com Fabricio.", "<b>814 tickets de pós-venda seguiam abertos</b> (52 parados na equipe), com ciclo mediano de 5d úteis 0h de trabalho."]}, "metodo": ["<b>Jornada considerada: segunda a sexta, das 07h às 11h e das 12h às 17h</b> — 9 horas úteis por dia, 23 dias úteis no período. Todos os indicadores de tempo têm duas leituras: <b>tempo corrido</b> (relógio) e <b>tempo útil</b> (só dentro da escala).", "<b>Sara Juste iniciou em 13/07/2026.</b> Os indicadores dela cobrem 19 dias corridos (13 dias úteis), contra 31 dos demais.", "<b>Tempo útil</b> desconta noites, o intervalo das 11h às 12h e os fins de semana. Uma mensagem recebida sexta às 16h50 e respondida segunda às 7h10 conta como 30 minutos úteis, não como 62 horas.", "<b>Clientes por dia</b> é o total de conversas distintas dividido pelos dias úteis previstos na escala, não pelos dias em que houve atividade registrada. A coluna de ocupação mostra a diferença entre os dois.", "<b>Tempo por cliente</b> divide os 540 minutos úteis do dia por essa média. É o teto teórico: supõe o atendente 100% do tempo em atendimento, sem reuniões nem tarefas paralelas.", "<b>Respostas automáticas</b> reúnem IA (MIA2), mensagens automáticas do marketplace e avisos de ausência. Manuais são as digitadas por um atendente na plataforma.", "<b>SLA de protocolo de chat</b> é de 12 horas. Passamos a medir em <b>horas úteis</b>, o que é mais justo com a escala — o número corrido também aparece para comparação.", "<b>Tickets sem responsável</b> (2.569 de pós-venda) são majoritariamente mensageria automática do Mercado Livre.", "<b>Protocolos encerrados</b> (26 de 2.205) refletem registro de baixa na plataforma, não casos resolvidos.", "<b>Divisão de canais</b>: Fabricio responde a Shopee, Yasmin o Mercado Livre e Sara o Magalu e o Madeira Madeira. A seção de carga soma tudo que entrou no canal de cada um, independentemente de quem respondeu.", "<b>Mensagens automáticas do Mercado Livre.</b> Todo cliente do canal recebe avisos de nota fiscal emitida, pedido recebido e pedido entregue. São 9.727 mensagens no período (76.9% das enviadas no canal), que inflam o volume total sem representar trabalho de atendimento. Sem elas, o total do período seria 48.586 em vez de 58.313.", "<b>Ritmo necessário</b> = 540 minutos úteis do dia ÷ atendimentos que chegam por dia útil ao canal e exigem resposta humana. É o tempo máximo que o atendente pode gastar em cada caso para não virar o dia com fila. Mensagens automáticas não entram no cálculo.", "<b>Usuários administrativos foram excluídos</b> das tabelas de atendimento (Paola Miranda)."], "sara_herdados": 58}}, {"key": "2026-08", "nome": "Agosto", "ano": 2026, "status": "fechado", "dados": {"periodo": {"ini": "01/08/2026", "fim": "31/08/2026"}, "parcial": false, "kpi": {"msgs": 67334, "recebidas": 34946, "enviadas": 32388, "conversas": 10347, "auto_pct": 62.4, "manual": 6956, "ia": 7065, "pos": 4759, "reclam": 750, "pre": 392, "med_resp": "5m 07s", "p1h": 61.5, "med_resp_u": "1m 27s", "p1h_u": 64.6, "med_manual_u": "4h 31m", "p1h_manual_u": 17.1, "fechados": 850, "abertos": 1188, "aguard_atend": 140, "med_ciclo": "6d 5h", "med_ciclo_u": "4d úteis 0h", "dias_uteis": 21, "rec_jornada": 19262, "rec_fora": 15684, "man_fora": 185}, "canais": [{"id": "shopee", "nome": "Shopee", "msgs": 31661, "rec": 20533, "env": 11128, "conversas": 3998, "auto_pct": 35.4, "med": "3m 20s", "med_u": "1m 35s", "p1h": 59.1, "pos": 0, "reclam": 0, "fech_pct": 0, "pre": 0, "msg_conv": 7.9}, {"id": "mercadolivre", "nome": "Mercado Livre", "msg chat.", "<b>O agente virtual converte 13.3%</b> das perguntas de pré-venda respondendo em 31s."], "ruim": ["<b>Fecha-se menos do que entra.</b> Os tickets fechados caíram de 1.042 (julho) para 850, enquanto os abertos subiram de 814 para 1.188 — 140 deles parados na equipe. É a fila crescendo mês a mês.", "<b>Pré-venda é o pior indicador do mês</b>: 96 das 392 perguntas ficaram sem resposta (24.5%, contra 8% em julho), com 2.3% de SLA e mediana de 1d 23h no atendimento humano.", "<b>A Shopee entrou em zona crítica de ritmo</b>: 1.726 atendimentos exigindo resposta humana em 21 dias úteis dão <b>6.6 minutos por caso</b> — o mais apertado já registrado — e o canal cumpre só 12.5% do SLA do marketplace.", "<b>15.684 mensagens (45%) chegam fora da escala</b> — noites, intervalo de almoço e fins de semana. A fatia subiu de 39% em julho para 45%.", "<b>1.283 protocolos de chat (33.7%) não chegaram a nenhum atendente</b> e 2.139 dos 3.803 seguem sem responsável designado.", "<b>Metade dos prazos do marketplace estourou</b>: 745 de 1.458 tickets com prazo encerrado dentro do SLA (51.1%), com outros 7.439 ainda correndo.", "<b>Fabricio responde em 5h 20m de mediana útil</b> e só 7.4% em até 1 hora — reflexo de sustentar sozinho 1.193 protocolos de chat da Shopee."]}, "metodo": ["<b>Mês fechado.</b> Os dados cobrem 01/08/2026 a 31/08/2026 — 31 dias corridos e 21 dias úteis — e substituem a leitura parcial que ia até 28/08. Todos os totais mudaram, inclusive o dia 28, que na leitura anterior estava incompleto (500 mensagens contra 2.924 no fechamento).", "<b>Jornada considerada: segunda a sexta, das 07h às 11h e das 12h às 17h</b> — 9 horas úteis por dia. Todos os indicadores de tempo têm duas leituras: <b>tempo corrido</b> (relógio) e <b>tempo útil</b> (só dentro da escala).", "<b>Tempo útil</b> desconta noites, o intervalo das 11h às 12h e os fins de semana. Uma mensagem recebida sexta às 16h50 e respondida segunda às 7h10 conta como 30 minutos úteis, não como 62 horas.", "<b>Comparação com julho.</b> Julho teve 23 dias úteis e agosto 21. Indicadores por dia útil já corrigem essa diferença; totais absolutos, não — agosto cresceu 15% em mensagens com dois dias úteis a menos.", "<b>Paola Miranda não é atendente.</b> É usuária administrativa e não faz parte da equipe de atendimento. Nos dias 27 e 28/08 ela respondeu 302 protocolos e 294 mensagens, todas da Shopee — mutirão para limpar o gargalo acumulado do canal, não rotina de atendimento. Aparece na tabela de responsáveis do chat porque o volume é material, sempre marcada como apoio, e fica fora das tabelas de atendentes, de carga e de capacidade.", "<b>Clientes por dia</b> é o total de conversas distintas dividido pelos dias úteis previstos na escala, não pelos dias em que houve atividade registrada. A coluna de ocupação mostra a diferença entre os dois.", "<b>Tempo por cliente</b> divide os 540 minutos úteis do dia por essa média. É o teto teórico: supõe o atendente 100% do tempo em atendimento, sem reuniões nem tarefas paralelas.", "<b>Respostas automáticas</b> reúnem IA (MIA2), mensagens automáticas do marketplace e avisos de ausência. Manuais são as digitadas por um atendente na plataforma. Respostas dadas direto no marketplace aparecem como \"por fora\" e não entram em nenhum dos dois grupos.", "<b>SLA de protocolo de chat</b> é de 12 horas, medido em <b>horas úteis</b> — o número corrido também aparece para comparação.", "<b>Tickets sem responsável</b> (3.608 de pós-venda) são majoritariamente mensageria automática do Mercado Livre.", "<b>Protocolos encerrados</b> (317 de 3.803) refletem registro de baixa na plataforma, não casos resolvidos.", "<b>Divisão de canais</b>: Fabricio responde a Shopee, Yasmin o Mercado Livre e Sara o Magalu e o Madeira Madeira. A seção de carga soma tudo que entrou no canal de cada um, independentemente de quem respondeu.", "<b>Mensagens automáticas do Mercado Livre.</b> Todo cliente do canal recebe avisos de nota fiscal emitida, pedido recebido e pedido entregue. São 14.250 mensagens no período (83.3% das enviadas no canal), que inflam o volume total sem representar trabalho de atendimento. Sem elas, o total do mês seria 53.084 em vez de 67.334.", "<b>Ritmo necessário</b> = 540 minutos úteis do dia ÷ atendimentos que chegam por dia útil ao canal e exigem resposta humana. É o tempo máximo que o atendente pode gastar em cada caso para não virar o dia com fila. Mensagens automáticas não entram no cálculo.", "<b>Via Varejo aparece na aba Reputação, mas não nos gráficos por canal.</b> São duas coisas diferentes: a reputação é a nota da conta no marketplace, enquanto os gráficos de volume vêm do Predize, onde o canal registrou 84 mensagens em agosto (0,1% do total) e segue somado apenas aos totais gerais. É justamente esse contraste que explica a nota baixa: base pequena de pedidos, em que cada problema pesa muito no percentual.", "<b>Efeito da MIA</b> compara a média de retornos do cliente por ticket entre atendimentos que tiveram resposta da IA e os que não tiveram, considerando só tickets com histórico de mudança de status."], "tempo_real": {"limiar": 15, "dias_uteis": 21, "atendentes": [{"nome": "Yasmin Fernandes", "tickets": 1256, "msgs": 2671, "blocos": 106, "ativo_min": 6346.0, "ativo_h": 105.8, "por_atend": 5.1, "por_msg": 2.4, "ativo_dia_h": 5.0, "ocupacao": 56, "dias_ativos": 22, "msgs_atend": 2.1, "teto": 9.0, "uso_pct": 57}, {"nome": "Fabricio Barros", "tickets": 1391, "msgs": 2238, "blocos": 120, "ativo_min": 4078.4, "ativo_h": 68.0, "por_atend": 2.9, "por_msg": 1.8, "ativo_dia_h": 3.2, "ocupacao": 36, "dias_ativos": 20, "msgs_atend": 1.6, "teto": 8.2, "uso_pct": 35}, {"nome": "Sara Juste", "tickets": 709, "msgs": 1752, "blocos": 196, "ativo_min": 5864.2, "ativo_h": 97.7, "por_atend": 8.3, "por_msg": 3.3, "ativo_dia_h": 4.7, "ocupacao": 52, "dias_ativos": 23, "msgs_atend": 2.5, "teto": 16.0, "uso_pct": 52}], "equipe": {"por_atend": 4.9, "por_msg": 2.4, "ativo_h": 271.5, "tickets": 3356, "msgs": 6661, "oc 9, "sem_nada": 666}}, "leitura": {"bom": ["<b>Setembro fechou como o maior mês da série</b>: 94.598 mensagens contra 67.334 em agosto — 40% a mais — e a mediana de resposta ficou em 1m 29s em horário útil, praticamente igual à de agosto (1m 27s).", "<b>O SLA de chat subiu pelo terceiro mês seguido</b>: 59.0% dos protocolos chegaram a um humano em até 12h úteis, contra 50.0% em agosto e 35.8% em julho.", "<b>O ciclo de resolução do pós-venda caiu pela metade</b>: mediana de 2d úteis 1h, contra 4d úteis 0h em agosto.", "<b>A fatia de protocolos sem nenhum toque humano caiu para 30.2%</b>, contra 33.7% em agosto, mesmo com o volume de protocolos dobrando (8.031 contra 3.803).", "<b>A equipe entregou 6.072 atendimentos com resposta humana</b> em 21 dias úteis — 289,1 por dia, contra 232 em agosto. A produção subiu junto com o volume.", "<b>O agente virtual segue resolvendo pré-venda em 31s com 100% de SLA</b> e é o único caminho da loja que não estoura prazo."], "ruim": ["<b>31,7 atendimentos por dia não recebem resposta nenhuma</b> — nem humana, nem automática. São 666 no mês, e é essa a fila que vira reclamação formal depois.", "<b>Chegam 472,7 atendimentos por dia e a equipe responde 289,1</b>: 61,2% de cobertura. Com 2h diárias reservadas para assistência, e-mail e WhatsApp, cabem 414 por dia — faltam 58,7, ou 1.233 no mês.", "<b>A Shopee segue com o SLA do marketplace no chão</b>: 15.3% no geral, com o chat praticamente zerado. O canal concentra 297,6 atendimentos por dia útil num atendente só.", "<b>Reclamações formais chegaram a 1.097</b>, contra 750 em agosto — 46% a mais, e o maior número da série.", "<b>23.221 mensagens (46%) chegam fora da escala</b> — noites, intervalo de almoço e fins de semana — e ficam represadas até o próximo turno.", "<b>Pré-venda segue parada no atendimento humano</b>: 123 das 413 perguntas sem resposta e 18.2% de SLA.", "<b>Os tickets em aberto subiram para 1.569</b>, contra 1.188 em agosto. Fecha-se menos do que entra pelo terceiro mês seguido."]}, "metodo": ["<b>Mês fechado.</b> Os dados cobrem 01/09/2026 a 30/09/2026. São 30 dias corridos e <b>21 dias úteis</b>: setembro tem 22 dias de semana, mas o dia 7 foi feriado da Independência e não houve nenhuma resposta manual da equipe, então ele saiu do denominador. Todos os indicadores por dia usam 21.", "<b>Jornada considerada: segunda a sexta, das 07h às 11h e das 12h às 17h</b> — 9 horas úteis por dia. Todos os indicadores de tempo têm duas leituras: <b>tempo corrido</b> (relógio) e <b>tempo útil</b> (só dentro da escala).", "<b>Tempo útil</b> desconta noites, o intervalo das 11h às 12h e os fins de semana. Uma mensagem recebida sexta às 16h50 e respondida segunda às 7h10 conta como 30 minutos úteis, não como 62 horas.", "<b>Há dois SLAs diferentes no relatório e eles não se contradizem.</b> O SLA de chat da aba de protocolos mede se um humano respondeu em até 12 horas úteis — esse melhorou. O SLA da seção de tickets é o prazo do próprio marketplace, mais curto — esse despencou. A leitura conjunta é que a equipe responde, mas cada vez mais perto ou depois do limite do canal.", "<b>Paola Miranda não é atendente.</b> É usuária administrativa e não faz parte da equipe. Aparece marcada como apoio na tabela de chat pelo volume residual e fica fora das tabelas de atendentes, carga, capacidade e do auditor de qualidade.", "<b>Clientes por dia</b> é o total de conversas distintas dividido pelos dias úteis previstos na escala, não pelos dias em que houve atividade registrada. A coluna de ocupação mostra a diferença entre os dois.", "<b>Tempo por cliente</b> divide os 540 minutos úteis do dia por essa média. É o teto teórico: supõe o atendente 100% do tempo em atendimento, sem reuniões nem tarefas paralelas.", "<b>Respostas automáticas</b> reúnem IA (MIA2), mensagens automáticas do marketplace e avisos de ausência. Manuais são as digitadas por um atendente na plataforma. Respostas dadas direto no marketplace aparecem como \"por fora\" e não entram em nenhum dos dois grupos.", "Tickets sem responsável são majoritariamente mensageria automática do Mercado Livre.", "Protocolos encerrados (4.970 de 8.031) refletem registro de baixa na plataforma. não casos resolvidos.", "<b>Divisão de canais</b>: Fabricio responde a Shopee, Yasmin o Mercado Livre e Sara o Magalu e o Madeira Madeira. A seção de carga soma tudo que entrou no canal de cada um, independentemente de quem respondeu.", "<b>Mensagens automáticas do Mercado Livre.</b> Todo cliente do canal recebe avisos de nota fiscal emitida. pedido recebido e pedido entregue. São 21.381 mensagens enviadas no período (84.2% das enviadas no canal). que inflam o volume total sem representar trabalho de atendimento.", "<b>Ritmo necessário</b> = 540 minutos úteis do dia ÷ atendimentos que chegam por dia útil ao canal e exigem resposta humana. É o tempo máximo que o atendente pode gastar em cada caso para não virar o dia com fila. Mensagens automáticas não entram no cálculo.", "<b>A Shopee não gera tickets de pós-venda no Predize</b>: todo o atendimento do canal entra como protocolo de chat. Por isso a coluna de pós-venda aparece zerada para ela na tabela de canais.", "<b>Canal Via</b> não aparece nos gráficos por canal por representar fração mínima do volume de mensagens, mas está somado aos totais gerais e aparece na tabela de SLA de tickets.", "<b>Efeito da MIA</b> compara a média de retornos do cliente por ticket entre atendimentos que tiveram resposta da IA e os que não tiveram, considerando só tickets com histórico de mudança de status.", "<b>Atendimento, na seção de capacidade, é um ticket que recebeu pelo menos uma mensagem do cliente no mês</b> — não é mensagem nem conversa. Demanda, entrega e fila usam todos essa mesma unidade, para que as três se somem.", "<b>A reserva de 120 minutos por dia é um parâmetro, não uma medição.</b> Representa o tempo que cada atendente gasta fora da Predize com abertura de assistência técnica, e-mail, WhatsApp, reuniões e tarefas paralelas. Como esse tempo não é registrado em lugar nenhum, foi declarado em 2 horas; se o número real for outro, a capacidade muda junto e basta trocar o campo <b>reserva</b> no bloco <b>capacidade_real</b>.", "<b>Tempo real por atendimento é um piso, não o custo total.</b> Ele conta só os blocos em que houve mensagem sendo enviada. Ler o caso, abrir o pedido, consultar rastreio e decidir o encaminhamento não geram mensagem e ficam de fora. Por isso a capacidade calculada é otimista e a faixa honesta vai da entrega observada até ela.", "<b>A fila sem resposta humana não é toda problema.</b> Ela inclui os tickets em que só a Mia respondeu, e boa parte deles é aviso de status que não pede intervenção. O número que importa acompanhar é o de <b>sem resposta nenhuma</b>: nem humano, nem automação."], "producao": {"dias_uteis": 21, "atendentes": [{"nome": "Yasmin Fernandes", "msgs": 2704, "atend": 1317, "msgs_dia": 128.8, "atend_dia": 62.7, "msgs_por_atend": 2.1, "dias_ativos": 21, "canais": [{"id": "mercadolivre", "msgs": 2687, "atend": 1300, "nome": "Mercado Livre"}, {"id": "via", "msgs": 17, "atend": 17, "nome": "Via Varejo"}], "tipos": [{"t": "MENSAGERIA", "msgs": 1689, "atend": 897, "nome": "Pós-venda"}, {"t": "RECLAMACAO", "msgs": 859, "atend": 264, "nome": "Reclamação"}, {"t": "PRE-VENDA", "msgs": 156, "atend": 156, "nome": "Pré-venda"}]}, {"nome": "Fabricio Barros", "msgs": 5913, "atend": 4183, "msgs_dia": 281.6, "atend_dia": 199.2, "msgs_por_atend": 1.4, "dias_ativos": 21, "canais": [{"id": "shopee", "msgs": 5847, "atend": 4125, "nome": "Shopee"}, {"id": "magalu", "msgs": 66, "atend": 58, "nome": "Magalu"}], "tipos": [{"t": "CHAT", "msgs": 5847, "atend": 4125, "nome": "Chat"}, {"t": "MENSAGERIA", "msgs": 61, "atend": 55, "nome": "Pós-venda"}, {"t": "RECLAMACAO", "msgs": 5, "atend": 3, "nome": "Reclamação"}]}, {"nome": "Sara Juste", "msgs": 1682, "atend": 797, "msgs_dia": 80.1, "atend_dia": 38.0, "msgs_por_atend": 2.1, "dias_ativos": 21, "canais": [{"id": "magalu", "msgs": no": 21.3}, "matriz": {"canais": [{"id": "shopee", "nome": "Shopee", "dono": "Fabricio Barros", "msgs": 4333, "atend": 3284, "msgs_dia": 288.9}, {"id": "mercadolivre", "nome": "Mercado Livre", "dono": "Yasmin Fernandes", "msgs": 1887, "atend": 943, "msgs_dia": 125.8}, {"id": "magalu", "nome": "Magalu", "dono": "Sara Juste", "msgs": 1702, "atend": 759, "msgs_dia": 113.5}, {"id": "madeira", "nome": "Madeira Madeira", "dono": "Sara Juste", "msgs": 21, "atend": 7, "msgs_dia": 1.4}], "pessoas": [{"nome": "Fabricio Barros", "equipe": true, "msgs": 3957, "atend": 2947, "dias": 15, "primeiro": "01/10", "ultimo": "22/10", "msgs_dia": 263.8, "atend_dia": 196.5, "msgs_dia_ativo": 263.8, "atend_dia_ativo": 196.5, "canais": {"shopee": {"msgs": 3957, "atend": 2947}, "mercadolivre": {"msgs": 0, "atend": 0}, "magalu": {"msgs": 0, "atend": 0}, "madeira": {"msgs": 0, "atend": 0}}, "principal": "shopee"}, {"nome": "Yasmin Fernandes", "equipe": true, "msgs": 1876, "atend": 932, "dias": 15, "primeiro": "01/10", "ultimo": "22/10", "msgs_dia": 125.1, "atend_dia": 62.1, "msgs_dia_ativo": 125.1, "atend_dia_ativo": 62.1, "canais": {"shopee": {"msgs": 0, "atend": 0}, "mercadolivre": {"msgs": 1876, "atend": 932}, "magalu": {"msgs": 0, "atend": 0}, "madeira": {"msgs": 0, "atend": 0}}, "principal": "mercadolivre"}, {"nome": "Sara Juste", "equipe": true, "msgs": 1572, "atend": 695, "dias": 15, "primeiro": "01/10", "ultimo": "22/10", "msgs_dia": 104.8, "atend_dia": 46.3, "msgs_dia_ativo": 104.8, "atend_dia_ativo": 46.3, "canais": {"shopee": {"msgs": 0, "atend": 0}, "mercadolivre": {"msgs": 0, "atend": 0}, "magalu": {"msgs": 1551, "atend": 688}, "madeira": {"msgs": 21, "atend": 7}}, "principal": "magalu"}, {"nome": "Paola Miranda", "equipe": false, "msgs": 538, "atend": 531, "dias": 3, "primeiro": "20/10", "ultimo": "22/10", "msgs_dia": 35.9, "atend_dia": 35.4, "msgs_dia_ativo": 179.3, "atend_dia_ativo": 177.0, "canais": {"shopee": {"msgs": 376, "atend": 372}, "mercadolivre": {"msgs": 11, "atend": 11}, "magalu": {"msgs": 151, "atend": 148}, "madeira": {"msgs": 0, "atend": 0}}, "principal": "shopee"}], "dias_uteis": 15, "total_msgs": 7943, "total_atend": 4993, "equipe_msgs": 7405, "fora_msgs": 538}, "apoio": [{"nome": "Paola Miranda", "msgs": 538, "atend": 531, "canais": ["Shopee", "Magalu", "Mercado Livre"], "primeiro": "20/10", "ultimo": "22/10", "dias": 3}]}, "metodo": ["<b>Mês parcial.</b> Os dados cobrem <b>01/10 a 22/10/2026</b>: 22 dias corridos e <b>15 dias úteis</b>. São 16 dias de semana no período, mas o dia 12 foi feriado de Nossa Senhora Aparecida e não houve nenhuma resposta manual da equipe, então ele saiu do denominador. <b>O dia 23 ficou fora</b>: a exportação foi tirada às 14h34, no meio da jornada, e manter um dia cortado pela metade derrubaria todas as médias. Todos os indicadores por dia usam 15.", "<b>Jornada considerada: segunda a sexta, das 07h às 11h e das 12h às 17h</b> — 9 horas úteis por dia. Todos os indicadores de tempo têm duas leituras: <b>tempo corrido</b> (relógio) e <b>tempo útil</b> (só dentro da escala).", "<b>Tempo útil</b> desconta noites, o intervalo das 11h às 12h e os fins de semana. Uma mensagem recebida sexta às 16h50 e respondida segunda às 7h10 conta como 30 minutos úteis, não como 62 horas.", "<b>A fila por dia é o status do próprio Predize, não uma inferência por mensagem.</b> Um ticket está <b>pendente</b> enquanto está em <b>\"Aguardando Atendente\"</b> — exatamente o que a plataforma mostra como fila do time. <b>Entraram</b> são as transições para esse status no dia; <b>saíram</b>, as transições para fora dele. Tudo vem da exportação <i>Histórico de Status de Atendimento</i>, e a identidade fecha dentro da jornada: 17h = 07h + entradas entre 07h e 17h − saídas entre 07h e 17h. Ticket fechado não é critério: um ticket aberto que já saiu de \"Aguardando Atendente\" não está mais pendente para o atendente, e um ticket fechado direto da fila conta como saída. <b>Esta seção cobre apenas Shopee, Mercado Livre, Magalu</b>; Madeira Madeira e Via ficaram de fora por volume irrelevante.", "<b>Quando o ticket entrou na fila, e por que isso foi corrigido.</b> A entrada normal é a transição para \"Aguardando Atendente\". Quando o primeiro registro de um ticket já aparece <i>saindo</i> desse status, a entrada não foi logada — nesse caso vale a <b>data de criação do ticket</b>, quando ela cai dentro da janela. Antes esses casos eram tratados como \"já aguardavam desde 01/10\", o que inflava enormemente a fila da Shopee: milhares de tickets que na verdade nasceram ao longo do mês apareciam pendentes desde a primeira manhã, e a abertura do canal chegava a passar de 4.000. Com a correção, só 566 tickets de todos os canais contam como herdados de antes de 01/10.", "<b>Quem respondeu: atendente, Mia ou por fora.</b> Cada saída da fila foi cruzada com as mensagens enviadas no mesmo ticket, numa margem de 10 minutos em torno da mudança de status. Há mensagem <b>manual</b> nessa janela → conta como <b>atendente</b>; há mensagem da <b>MIA2</b> → conta como <b>Mia</b>; há mensagem com origem <b>\"por fora\"</b> → foi respondido direto no marketplace, sem passar pela plataforma. Quando não há mensagem nenhuma, o ticket saiu da fila por fechamento ou bloqueio e conta como <b>sem resposta</b>. No período, 47,4% das saídas foram do atendente e 44,0% da Mia.", "<b>Os últimos dias da janela ainda não fecharam.</b> Quem entrou na fila em 20 ou 21/10 pode não ter sido respondido até o corte da exportação, na manhã de 22/10. Como a Mia responde em minutos e uma pessoa leva horas, essa cauda derruba artificialmente a coluna do atendente nos últimos dias. Por isso as médias de quem respondeu usam só os <b>12 dias já resolvidos</b> (até 19/10), em que menos de 2% das entradas seguiam na fila. Na tabela, os dias parciais aparecem esmaecidos e marcados.", "<b>Conferência com a lista de tickets.</b> O modelo fecha a janela com 468 tickets em \"Aguardando Atendente\" às 24h de 22/10; a exportação de tickets mostra 273 nesse status, mas ela é um retrato de <b>23/10 às 14h34</b>, depois de uma manhã inteira de trabalho que derrubou a fila. Os dois números medem instantes diferentes, por isso não coincidem — o que confere é a ordem de grandeza e o sentido do movimento.", "<b>Há dois SLAs diferentes no relatório e eles não se contradizem.</b> O SLA de chat da aba de protocolos mede se um humano respondeu em até 12 horas úteis. O SLA da seção de tickets é o prazo do próprio marketplace, mais curto. A leitura conjunta é que a equipe responde, mas cada vez mais perto ou depois do limite do canal.", "<b>Cuidado com medianas que melhoram por composição.</b> O tempo mediano de resposta de um canal mistura o que a automação fecha e o que uma pessoa fecha. Quando a fatia automática cresce, a mediana cai sem que ninguém tenha ficado mais rápido. É o que aconteceu na Shopee e na pré-venda neste recorte — cada caso está anotado na leitura da seção correspondente.", "<b>Paola Miranda não é atendente.</b> É usuária administrativa e não faz parte da equipe. Neste recorte ela respondeu <b>538 mensagens em 3 dias</b> (20/10 a 22/10) para aliviar o acumulado: 376 na Shopee, 11 no Mercado Livre, 151 no Magalu. Ela aparece no bloco \"quem respondeu, canal por canal\" e na tabela de chat, marcada como administrativo, e fica fora das tabelas de atendentes, carga, capacidade e do auditor de qualidade.", "<b>Clientes por dia</b> é o total de conversas distintas dividido pelos dias úteis previstos na escala, não pelos dias em que houve atividade registrada. A coluna de ocupação mostra a diferença entre os dois.", "<b>Tempo por cliente</b> divide os 540 minutos úteis do dia por essa média. É o teto teórico: supõe o atendente 100% do tempo em atendimento, sem reuniões nem tarefas paralelas.", "<b>Respostas automáticas</b> reúnem IA (MIA2), mensagens automáticas do marketplace e avisos de ausência. Manuais são as digitadas por um atendente na plataforma. Respostas dadas direto no marketplace aparecem como \"por fora\" e não entram em nenhum dos dois grupos.", "Tickets sem responsável são majoritariamente mensageria automática do Mercado Livre.", "Protocolos encerrados (3.371 de 6.385) refletem registro de baixa na plataforma, não casos resolvidos.", "<b>Divisão de canais</b>: Fabricio responde a Shopee, Yasmin o Mercado Livre e Sara o Magalu e o Madeira Madeira. A seção de carga soma tudo que entrou no canal de cada um, independentemente de quem respondeu.", "<b>Mensagens automáticas do Mercado Livre.</b> Todo cliente do canal recebe avisos de nota fiscal emitida, pedido recebido e pedido entregue. São 16.740 mensagens enviadas no período (86,6% das enviadas no canal), que inflam o volume total sem representar trabalho de atendimento.", "<b>A Shopee não gera tickets de pós-venda no Predize</b>: todo o atendimento do canal entra como protocolo de chat. Por isso a coluna de pós-venda aparece zerada para ela na tabela de canais.", "<b>Canal Via</b> não aparece nos gráficos por canal por representar fração mínima do volume de mensagens, mas está somado aos totais gerais, aparece na tabela de SLA de tickets e entra na quebra por canal da fila diária — ali as linhas precisam somar o total, por isso ele é mostrado junto com o Madeira Madeira na coluna \"Outros\".", "<b>Efeito da MIA</b> compara a média de retornos do cliente por ticket entre atendimentos que tiveram resposta da IA e os que não tiveram, considerando só tickets com histórico de mudança de status.", "<b>Atendimento, na seção de capacidade, é um ticket que recebeu pelo menos uma mensagem do cliente no mês</b> — não é mensagem nem conversa. Demanda, entrega e fila usam todos essa mesma unidade, para que as três se somem.", "<b>A reserva de 120 minutos por dia é um parâmetro, não uma medição.</b> Representa o tempo que cada atendente gasta fora da Predize com abertura de assistência técnica, e-mail, WhatsApp, reuniões e tarefas paralelas. Como esse tempo não é registrado em lugar nenhum, foi declarado em 2 horas; se o número real for outro, a capacidade muda junto e basta trocar o campo <b>reserva</b> no bloco <b>capacidade_real</b>.", "<b>Tempo real por atendimento é um piso, não o custo total.</b> Ele conta só os blocos em que houve mensagem sendo enviada. Ler o caso, abrir o pedido, consultar rastreio e decidir o encaminhamento não geram mensagem e ficam de fora. Por isso a capacidade calculada é otimista e a faixa honesta vai da entrega observada até ela.", "<b>A fila sem resposta humana não é toda problema.</b> Ela inclui os tickets em que só a Mia respondeu, e boa parte deles é aviso de status que não pede intervenção. O número que importa acompanhar é o de <b>sem resposta nenhuma</b>: nem humano, nem automação.", "<b>Reputação e Reclame Aqui atualizados em 23/10.</b> Os painéis dos três marketplaces e a exportação do Reclame Aqui (01/04 a 22/10) foram recapturados nesta leitura, com o histórico diário atualizado. A <b>nota do Magalu subiu para 5,0</b>, topo da escala. O auditor de qualidade do Predize também foi atualizado, com janela de 01/09 a 23/10 — exceto o painel da Mia, que não veio nesta captura e segue na leitura anterior.", "<b>Cuidado ao comparar com setembro.</b> Quinze dias úteis contra 21. As médias por dia são comparáveis; os totais, não. Indicadores de ciclo e fechamento também ficam distorcidos num recorte curto: um ticket aberto em 21/10 ainda não teve tempo de ser fechado, e isso infla a fatia de \"em aberto\"."], "leitura": {"bom": ["<b>A pré-venda deixou de ignorar perguntas</b>: só 39 das 313 ficaram sem resposta (12,5%), contra 73 de 175 (41,7%) no recorte de 01 a 14/10 e 123 de 413 (29,8%) em setembro.", "<b>A fila sem resposta nenhuma caiu para 28,1 por dia útil</b> — 422 atendimentos em 15 dias úteis —, contra 48,1 por dia no recorte de 01 a 14/10 e 31,7 em setembro.", "<b>A cobertura subiu para 59,2%</b>: a equipe responde 316,3 dos 534,6 atendimentos que chegam por dia útil, contra 54,0% no recorte de 01 a 14/10 e 61,2% em setembro.", "<b>O Mercado Livre acelerou semana a semana</b>: a mediana de primeira resposta foi de 2m 09s na semana de 01 a 04/10 para 49s na de 19 a 22/10, e a fatia respondida em até 1 hora subiu de 71,9% para 74,8%. E, diferente da Shopee, a melhora é real: o tempo das respostas <b>humanas</b> do canal caiu de 10h 02m para 6h 46m úteis no mesmo intervalo.", "<b>A Mia carrega metade da fila do atendente.</b> Dos 759,0 tickets que entram em \"Aguardando Atendente\" por dia útil nos três canais, 367,9 saem com mensagem de um atendente e 328,9 com resposta da Mia — sem a automação a fila do dia seria quase o dobro do que a equipe consegue tocar.", "<b>A fila fecha o dia menor do que abriu, todos os dias.</b> A abertura média é de 739 tickets aguardando atendente e o fechamento, 507 — nos 15 dias úteis não houve um só em que a fila terminasse maior. A mediana de espera é de 2h 01m de trabalho.", "<b>A equipe digitou 7.405 mensagens e tocou 4.574 atendimentos</b> em 15 dias úteis — 493,7 mensagens por dia útil, acima das 490,4 de setembro, com a mesma gente."], "ruim": ["<b>Na Shopee a automação já responde mais que a pessoa.</b> Dos 481,3 tickets que entram na fila do canal por dia útil, 229,7 saem com resposta da Mia contra 214,2 do atendente. Como a Shopee é 63% de tudo que entra na fila, é ela que define a média da operação — no Mercado Livre e no Magalu a proporção se inverte.", "<b>Quase um quinto da fila estoura 12 horas úteis.</b> A mediana de permanência em \"Aguardando Atendente\" é de 2h 01m de trabalho (5h 41m corridos), mas <b>18,9% dos tickets passam de 12 horas úteis</b> esperando. Por canal: Shopee em 2h 38m, Mercado Livre em 2h 35m, Magalu em 57m 11s. O Magalu resolve em menos da metade do tempo dos outros dois com a mesma equipe.", "<b>A aceleração da Shopee é de composição, não de velocidade.</b> A mediana do canal na semana de 19 a 22/10 despencou para 1m 31s úteis, contra 1h 05m na primeira semana do mês — mas foi porque a automação passou a chegar primeiro mais vezes: a fatia de primeiras respostas fechadas por uma pessoa caiu de 38,6% para 33,8%, e o tempo das respostas humanas <b>piorou</b> de 8h 04m para 10h 33m úteis no mesmo intervalo.", "<b>A pré-venda humana não melhorou; o número agregado é que mudou de composição.</b> O SLA geral subiu para 47,0% porque o agente virtual respondeu 146 das 313 perguntas com 100% de SLA. Entre as 167 que foram para uma pessoa, o SLA é de <b>0,6%</b> e a mediana de resposta é de <b>4d 22h</b>.", "<b>O SLA de tickets do marketplace caiu para 14,5%</b> (613 de 4.238 avaliados), contra 18,1% no recorte de 01 a 14/10 e 15,3% em setembro. E 6.144 dos 10.382 tickets seguem em aberto.", "<b>O chat segue 14 pontos abaixo de setembro</b>: 45,2% dos protocolos tiveram um atendente em até 12h úteis, contra 59,0% em setembro — estabilizou no recorte de outubro, mas no patamar baixo. E 33,2% (2.123) não tiveram nenhum toque humano.", "<b>18.759 mensagens (47%) chegam fora da escala</b> — noites, intervalo de almoço e fins de semana. A fila do atendente não estoura à noite porque a Mia responde no lugar: entre as jornadas ela sobe 3.277 no período inteiro, contra 3.487 retirados dentro das jornadas. Ainda assim, 19,4 tickets por dia saem da fila <b>sem nenhuma resposta</b>, por fechamento ou bloqueio.", "<b>Faltam 61,1 atendimentos por dia</b> para a conta fechar: cabem 473,5 com as 2h de reserva e chegam 534,6.", "<b>O Mercado Livre acumula pendência sem acumular volume.</b> Entram 153,8 atendimentos por dia na fila do canal — um terço do que entra na Shopee —, mas 142 tickets ainda estavam esperando no fechamento de 22/10, quase tanto quanto os 241 da Shopee, que recebe o triplo. E é o único dos três em que a saída sem resposta nenhuma é relevante: 11,8 tickets por dia saem da fila por fechamento ou bloqueio, contra 2,8 na Shopee."]}, "fila": {"dias": [{"d": 1, "dow": 3, "rot": "01/10", "p7": 596, "p17": 462, "ent": 812, "ent_jornada": 561, "resp": 802, "resp_jornada": 695, "hum": 424, "hum_j     <div class="panel"><p class="pt">⚠️ O que ainda pesa</p><ul class="ls">

  h+=`<details class="met" style="margin-top:14px"><summary>Como atualizar estes números</summary>

      <li><b>A régua do Magalu foi recapturada e a nota é 4,6</b>, não os 4,3 que vinham sendo exibidos desde 08/09. O painel alterna entre dois formatos — régua de faixas e metas com bases absolutas — e só o segundo aparecia; o relatório mantinha o último valor conhecido e sinalizava a defasagem há três leituras. As bases desta leitura: 3.785 pedidos entregues, 3.499 interações avaliadas e 47 cancelamentos. <b>No histórico diário a correção vale a partir de 15/10</b>: as leituras entre 08/09 e 13/10 ficam como foram registradas, porque não há como saber em que data a nota efetivamente subiu.</li>

  return h;

/* ---------- abas ---------- */
function pintaTabs(){
  const t=[`<button class="tab ${atual==='geral'?'on':''}" data-k="geral"><i></i>Visão Geral</button>`,
    `<button class="tab ${atual==='rep'?'on':''}" data-k="rep"><i></i>Reputação <span class="bdg or">Diário</span></button>`,
    `<button class="tab ${atual==='ra'?'on':''}" data-k="ra"><i></i>Reclame Aqui <span class="bdg or">Regular</span></button>`];
  DATA.meses.forEach(m=>{
    const b = m.status==='fechado' ? '<span class="bdg gr">Fechado</span>'
            : m.status==='parcial' ? '<span class="bdg or">Parcial</span>'
            : '<span class="bdg gy">Aguardando</span>';
    t.push(`<button class="tab ${atual===m.key?'on':''} ${m.status==='fechado'&&atual!==m.key?'done':''}" data-k="${m.key}"><i></i>${m.nome} ${m.ano} ${b}</button>`);
  });
  el('tabs').innerHTML=t.join('');
  el('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{atual=b.dataset.k;pintaTabs();pintaTopo();render();window.scrollTo({top:0,behavior:'smooth'})});
}

function viewGeral(){
  const tot = comDados.reduce((a,m)=>{const k=m.dados.kpi;return{
    msgs:a.msgs+k.msgs, conv:a.conv+k.conversas, pos:a.pos+k.pos, rec:a.rec+k.reclam,
    pre:a.pre+k.pre, chat:a.chat+m.dados.chat.total, ab:a.ab+k.abertos, man:a.man+k.manual};},
    {msgs:0,conv:0,pos:0,rec:0,pre:0,chat:0,ab:0,man:0});
  const ult=comDados[comDados.length-1].dados;
  const kc=[
    {l:'Total de mensagens',v:NB(tot.msgs),g:'linear-gradient(90deg,#FF6B35,#F59E0B)',c:'#fff',s:'Todos os canais',gh:'💬',b:['b-nt',NB(tot.conv)+' conversas']},
    {l:'Protocolos de chat',v:NB(tot.chat),g:'linear-gradient(90deg,#3B82F6,#06B6D4)',c:'#fff',s:'Shopee e Magalu',gh:'🎧',b:['b-al',ult.chat.sla_hum_u+'% no SLA de 12h úteis']},

    {l:'Perguntas de pré-venda',v:NB(tot.pre),g:'linear-gradient(90deg,#EAB308,#FF6B35)',c:'#fff',s:'Em página de anúncio',gh:'🛒',b:['b-al',ult.pre.tipos.find(t=>t.t==='Agente Humano').sla+'% no SLA (humano)']},
    {l:'Respostas manuais',v:NB(tot.man),g:'linear-gradient(90deg,#06B6D4,#3B82F6)',c:'#fff',s:'Digitadas por atendente',gh:'✍️',b:['b-nt',ult.kpi.auto_pct+'% do total é automático']}
  ];
  if(ult.tempo_real){const E=ult.tempo_real.equipe;
    kc.push({l:'Tempo real por atendimento',v:String(E.por_atend).replace('.',',')+' min',
      g:'linear-gradient(90deg,#14B8A6,#22C55E)',c:'#5EEAD4',
      s:`Medido na plataforma · ${comDados[comDados.length-1].nome.toLowerCase()}`,gh:'⏱',
      b:[E.ocupacao>=70?'b-al':E.ocupacao>=45?'b-wr':'b-ok',E.ocupacao+'% da jornada ocupada']});}

      g:'linear-gradient(90deg,#EF4444,#F97316)',c:'#F87171',
      s:`De ${String(C.demanda_dia).replace('.',',')} que chegam, ${String(C.entrega_dia).replace('.',',')} têm resposta humana`,gh:'📥',
      b:['b-al',String(C.fila_sem_nada_dia).replace('.',',')+' sem resposta nenhuma']});}
  let h = `<div class="slab">Indicadores acumulados <span class="hint">${comDados.length} mês(es) carregado(s)</span></div>`
        + `<div class="kgrid">${kc.map(cardKPI).join('')}</div>`
        + (ult.tempo_real?`<div class="note" style="margin-top:11px">${(()=>{const T=ult.tempo_real,E=T.equipe,
            o=[...T.atendentes].sort((a,b)=>a.por_atend-b.por_atend);
            return `<b>Tempo real por atendimento</b> é o tempo observado dentro da plataforma, não uma estimativa: respostas manuais separadas por até ${T.limiar} minutos contam como trabalho contínuo, e a soma desses blocos é dividida pelos atendimentos distintos. No último período a equipe gastou <b>${String(E.por_atend).replace('.',',')} minutos por atendimento</b> e ocupou <b>${E.ocupacao}% da jornada</b> — ${String(E.ativo_dia_h).replace('.',',')} das 9 horas úteis por pessoa. Individualmente vai de <b>${String(o[0].por_atend).replace('.',',')} min (${o[0].nome.split(' ')[0]})</b> a <b>${String(o[o.length-1].por_atend).replace('.',',')} min (${o[o.length-1].nome.split(' ')[0]})</b>, porque a fila de cada canal é diferente: chat resolve rápido, reclamação exige investigação. O detalhamento por atendente, com o teto de cada um, está na aba do mês.`;})()}</div>`:'')

    <thead><tr><th>Mês</th><th>Dias úteis</th><th>Mensagens</th><th>Conversas</th><th>Mediana útil</th><th>% até 1h útil</th><th>Protocolos</th><th>SLA chat útil</th><th>Tickets</th><th>Em aberto</th></tr></thead><tbody>`;
  comDados.forEach(m=>{const d=m.dados;
    h+=`<tr><td>${m.nome} ${m.ano}${m.status==='parcial'?' *':''}</td><td>${d.kpi.dias_uteis}</td><td>${NB(d.kpi.msgs)}</td><td>${NB(d.kpi.conversas)}</td>
    <td>${d.kpi.med_resp_u}</td><td>${d.kpi.p1h_u}%</td><td>${NB(d.chat.total)}</td><td>${d.chat.sla_hum_u}%</td>
    <td>${NB(d.kpi.pos)}</td><td>${NB(d.kpi.abertos)}</td></tr>`;});
  h+=`</tbody></table>${comDados.length===1?'<div class="note blue">Com um único mês carregado não há série histórica para comparar. Assim que agosto entrar, esta tabela mostra a variação mês a mês automaticamente.</div>':''}</div>`;

  const S=RA.periodos.semestre;
  h += `<div class="slab">Reputação externa <span class="hint">Reclame Aqui · últimos 6 meses</span></div>
    <div class="kgrid">`+[
      {l:'Índice Reclame Aqui',v:FX(RA.indice),g:'linear-gradient(90deg,#EAB308,#22C55E)',c:'#FACC15',
       s:`Faixa ${RA.faixa} · ${S.janela}`,gh:'😐',b:['b-nt','estável em '+FX(RA.indice)+' · '+FX(RA.paraRuim)+' até "Ruim"']},
      {l:'Reclamações no semestre',v:NB(S.total),g:'linear-gradient(90deg,#FF6B35,#F59E0B)',
       s:`${NB(S.respondidas)} respondidas · ${NB(S.nao_respondidas)} sem resposta`,gh:'📣',
       b:[S.nao_respondidas===0?'b-ok':'b-wr', S.nao_respondidas===0?'passivo zerado':NB(S.nao_respondidas)+' pendentes']},
      {l:'Tempo de resposta',v:S.tempo_resposta.split(' ')[0]+'d',g:'linear-gradient(90deg,#EF4444,#F97316)',c:'#F87171',
       s:`${S.tempo_resposta} · setembro sozinho: ${RA.periodos.set.tempo_resposta}`,gh:'⏳',b:['b-ok','o menor da série']},
      {l:'Índice de solução',v:S.indice_solucao+'%',g:'linear-gradient(90deg,#EAB308,#22C55E)',c:'#FACC15',
       s:`leitura de 02/09 · ${S.avaliadas} avaliações na janela atual`,gh:'📊',b:['b-wr',S.voltaria+'% voltaria a comprar']}
    ].map(cardKPI).join('')+`</div>
    <div class="note" style="margin-top:11px"><b>O passivo começou a ser trabalhado</b>: 7 reclamações respondidas em dois dias, pendentes caindo de 17 para <b>${S.nao_respondidas}</b> e a taxa de resposta voltando de 90,0% para ${S.pct_respondidas.toString().replace('.',',')}%. O tempo médio cedeu para ${S.tempo_resposta} e a nota do consumidor subiu para ${S.nota_media.toFixed(2).replace('.',',')}. O contraste dos recortes mensais segue valendo: <b>setembro fechou com 100% de resposta</b> (${RA.periodos.set.total} reclamações, nenhuma pendente, ${RA.periodos.set.tempo_resposta}), enquanto <b>outubro tinha ${RA.periodos.out.nao_respondidas} pendentes em ${RA.periodos.out.dias} dias</b> na última exportação do mês. <b>Outubro fechou como o pior mês da série</b>: ${RAM('Out')} reclamações, acima dos 38 de julho, com 22 dias corridos. O <b>índice reagiu pela primeira vez em seis leituras</b>: ${FX(RA.indice_anterior)} → ${FX(RA.indice)}, a ${FX(RA.paraRuim)} ponto de "Ruim". <b>Ele mede resolução</b>, e essa segue em ${S.indice_solucao}% com ${S.notas[0]} das ${S.avaliadas} avaliações em nota zero. Detalhamento na aba Reclame Aqui.</div>`;

  h += `<div class="slab">Qualidade do atendimento</div>
    <div class="panel"><p class="pt"><span class="tip">Auditor automático do Predize<span class="tipbox"><b>Como a nota é formada</b><br>A IA avalia cada mensagem em 5 critérios fixos, iguais para todos os sellers. Os <b>quatro primeiros</b> — empatia, tempo de resposta, clareza e tom de voz — julgam a mensagem de <b>quem atendeu</b>, seja humano ou a Mia. O <b>quinto, o CSAT</b>, é diferente: julga <b>como o comprador reagiu</b>, lendo as mensagens dele.<em>Passe o mouse sobre cada critério abaixo para ver o que ele mede.</em></span></span> <small>${AUDIT.periodo} · ${NB(AUDIT.total_tickets)} tickets avaliados</small></p>
      <div class="aud">${[...AUDIT.atendentes,{...AUDIT.ia,_ia:1}].map(a=>{
        const cor=v=>v>=75?'#22C55E':v>=60?'#EAB308':v>=45?'#F97316':'#EF4444';
        return `<div class="rc" style="--c:${a._ia?'#A855F7':cor(a.geral)}">
          <div class="rc-h"><h4>${a.nome.split(' ')[0]}${a._ia?' <span class="bdg2 b-nt" style="margin:0;font-size:9.5px">IA</span>':''}</h4>
            <span class="tip tr bdg2 ${a.geral>=60?'b-wr':'b-al'}" style="margin:0;border-bottom:0">${a.geral}/100<span class="tipbox" style="font-weight:400"><b>Nota geral</b><br>Média das cinco dimensões nas conversas fechadas do período, numa escala de 0 a 100. Cada mensagem do atendente é pontuada separadamente e depois consolidada por ticket.<em>Amostra: ${NB(a.tickets)} tickets avaliados em ${AUDIT.periodo}.</em></span></span>
            <span class="src">${a.canal} · ${NB(a.tickets)} tickets</span></div>
          ${AUDIT.dims.map(d=>`<div class="audrow"><span class="tip" style="color:#7C818C">${d.n}<span class="tipbox"><b>${d.n}</b><br>${d.d}${d.alerta?`<em>${d.alerta}</em>`:''}</span></span><b style="color:${cor(a[d.k])}">${a[d.k]}</b></div>
            <div class="audbar"><i style="width:${a[d.k]}%;background:${cor(a[d.k])}"></i></div>`).join('')}
        </div>`;}).join('')}</div>
      <div class="note"><b>O tempo de resposta é a pior dimensão dos três atendentes</b> — ${AUDIT.atendentes.map(a=>a.nome.split(' ')[0]+' '+a.resposta).join(', ')}, contra uma média ponderada de ${AUDIT.media.geral}/100 no geral. O tom de voz é a melhor (${AUDIT.media.tom}/100) e a clareza vem logo atrás (${AUDIT.media.clareza}/100): <b>a equipe escreve bem, mas demora</b>. É o mesmo diagnóstico que aparece no SLA dos marketplaces, agora medido dentro da conversa e não pelo relógio do canal.</div>
      <div class="note" style="margin-top:9px"><b>A Mia entra como referência, não como concorrente.</b> A IA pontua ${AUDIT.ia.geral}/100 contra ${AUDIT.media.geral} da equipe e ganha em todas as cinco dimensões, mas a diferença real está numa só: <b>tempo de resposta ${AUDIT.ia.resposta} contra ${AUDIT.media.resposta}</b>. Nas outras quatro o placar é apertado — empatia ${AUDIT.ia.empatia} a ${AUDIT.media.empatia}, clareza ${AUDIT.ia.clareza} a ${AUDIT.media.clareza}, tom ${AUDIT.ia.tom} a ${AUDIT.media.tom} e CSAT ${AUDIT.ia.csat} a ${AUDIT.media.csat}. Ou seja: <b>o que separa a IA da equipe é velocidade, não qualidade de escrita</b>. Ela aparece com ${NB(AUDIT.ia.tickets)} tickets avaliados contra ${NB(AUDIT.total_tickets)} dos três humanos somados${AUDIT.ia.stale?` — mas <b>o painel da Mia não veio nesta captura</b>: os números dela são a ${AUDIT.ia.stale}, enquanto os da equipe já cobrem até 23/10`:''}.</div>
      <div class="note" style="margin-top:9px">${(()=>{const o=[...AUDIT.atendentes].sort((a,b)=>b.tickets-a.tickets), g=o[0], pq=o.slice(1);
        return `As amostras são muito desiguais: <b>${NB(g.tickets)} tickets de ${g.nome.split(' ')[0]} contra ${pq.map(x=>NB(x.tickets)).join(' e ')}</b> dos outros dois. As notas de ${pq.map(x=>x.nome.split(' ')[0]).join(' e ')} vêm de poucas conversas e oscilam muito com um caso isolado — use-as como indício, não como avaliação consolidada.`;})()} ${AUDIT.excluidos.map(e=>e.nome.split(' ')[0]).join(' e ')} ficaram fora da análise: ${AUDIT.excluidos.map(e=>e.nome.split(' ')[0]+' ('+e.tickets+' tickets, '+e.motivo+')').join('; ')}.</div></div>`;

  return h;
}
function cardKPI(k){
  return `<div class="kc" style="--g:${k.g};--c:${k.c||'#fff'}">
    <div class="lab">${k.l}</div><div class="val">${k.v}</div><div class="sub">${k.s}</div>
    ${k.b?`<span class="bdg2 ${k.b[0]}">${k.b[1]}</span>`:''}<div class="gh">${k.gh||''}</div></div>`;
}

/* ================= MÊS ================= */

    <code>"dados": null</code> pelo bloco do mês dentro de <code>DATA.meses</code>, no início do script deste arquivo.
    As abas, os totais e o resumo por mês se ajustam sozinhos.</p></div>`;
  const D=m.dados, K=D.kpi, C=D.chat;
  const kc=[
    {l:'Mensagens no mês',v:NB(K.msgs),g:'linear-gradient(90deg,#FF6B35,#F59E0B)',s:`${NB(K.recebidas)} recebidas · ${NB(K.enviadas)} enviadas`,gh:'💬',b:['b-nt',NB(K.conversas)+' conversas']},
    {l:'Resposta mediana (útil)',v:K.med_resp_u,g:'linear-gradient(90deg,#22C55E,#4ADE80)',c:'#4ADE80',s:`${K.med_resp} em tempo corrido`,gh:'⏱',b:['b-ok',K.p1h_u+'% em até 1h útil']},
    {l:'Protocolos de chat',v:NB(C.total),g:'linear-gradient(90deg,#3B82F6,#06B6D4)',s:'SLA de 12h úteis para o 1º contato',gh:'🎧',b:['b-al',C.sla_hum_u+'% no SLA útil']},
    {l:'Tickets de pós-venda',v:NB(K.pos),g:'linear-gradient(90deg,#A855F7,#EC4899)',s:`${NB(K.reclam)} reclamações formais`,gh:'📦',b:['b-wr',NB(K.abertos)+' em aberto']},
    {l:'Perguntas de pré-venda',v:NB(K.pre),g:'linear-gradient(90deg,#EAB308,#FF6B35)',s:'Na página do anúncio',gh:'🛒',b:['b-al',D.pre.tipos.find(t=>t.t==='Agente Humano').sla+'% no SLA (humano)']},
    {l:'Chegadas fora da escala',v:Math.round(K.rec_fora/K.recebidas*100)+'%',g:'linear-gradient(90deg,#A855F7,#EC4899)',s:`${NB(K.rec_fora)} mensagens fora de 07h–17h ou no fim de semana`,gh:'🌙',b:['b-nt',K.auto_pct+'% das respostas são automáticas']}
  ];
  let h = '';
  h += `<div class="slab">Visão do mês <span class="hint">${D.periodo.ini} a ${D.periodo.fim}</span></div>
           <div class="kgrid">${kc.map(cardKPI).join('')}</div>`;

  h += `<div class="slab">Canais</div>
    <div class="kgrid">`+
    D.canais.map(c=>`<div class="chc" style="--c:${CC[c.id]}"><h3>${c.nome}</h3>
      <div class="big">${NB(c.msgs)} <small>mensagens</small></div>
      <div class="kv"><span>Conversas</span><b>${NB(c.conversas)}</b></div>
      <div class="kv"><span>Resposta mediana (útil)</span><b>${c.med_u}</b></div>
      <div class="kv"><span>Pós-venda · reclamações</span><b>${NB(c.pos)} · ${NB(c.reclam)}</b></div></div>`).join('')+`</div>`;

  if(D.fila){ const FL=D.fila, FD=FL.dias, ult=FD[FD.length-1], pri=FD[0];
    const cresceu = ult.p7 - pri.p7;
    const FM=x=>{const i=Math.trunc(x),d=Math.round(Math.abs(x-i)*10);return NB(i)+','+d;};
    const dentro=FD.reduce((t,d)=>t+d.delta,0);
    const noites=FD.slice(1).reduce((t,d,i)=>t+(d.p7-FD[i].p17),0);
    const MQ=FL.med_q_mad||FL.med_q;
    h += `<div class="slab">Fila do atendente <span class="hint">tickets em "Aguardando Atendente" · ${FL.canais_incluidos.join(', ')} · visão consolidada</span></div>
    <div class="kgrid">`+[
      {l:'Pendente às 07h',v:NB(Math.round(FL.med_p7)),g:'linear-gradient(90deg,#EF4444,#EC4899)',c:'#F87171',s:`média dos ${FL.dias_uteis} dias úteis · fecha o dia em ${NB(Math.round(FL.med_p17))}`,gh:'🌅'},
      {l:'Entram na fila por dia',v:FX(FL.med_ent),g:'linear-gradient(90deg,#FF6B35,#EAB308)',c:'#FACC15',s:`cliente respondeu, ticket novo ou reaberto`,gh:'📥'},
      {l:'Respondidos pelo atendente',v:FX(MQ.atendente),g:'linear-gradient(90deg,#22C55E,#4ADE80)',c:'#4ADE80',s:`por dia útil, dos que entraram no mesmo dia`,gh:'🙋',b:['b-ok',Math.round(MQ.atendente/(MQ.atendente+MQ.ia)*100)+'% da dupla']},
      {l:'Respondidos pela Mia',v:FX(MQ.ia),g:'linear-gradient(90deg,#06B6D4,#3B82F6)',c:'#38BDF8',s:`por dia útil · ${FX(MQ.fora)} respondidos direto no marketplace`,gh:'🤖',b:['b-nt',Math.round(MQ.ia/(MQ.atendente+MQ.ia)*100)+'% da dupla']}
    ].map(cardKPI).join('')+`</div>

    <div class="panel" style="margin-top:14px"><p class="pt"><span class="tip">O estoque da fila e o fluxo do dia<span class="tipbox"><b>Como cada número é apurado</b><br>Um ticket está <b>pendente</b> enquanto está no status <b>"Aguardando Atendente"</b> do Predize — a fila que o time vê na plataforma. Ticket fechado não é critério: o que conta é estar ou não aguardando resposta do atendente.<br><b>Entraram</b> são as transições para esse status no dia; <b>saíram</b>, as transições para fora dele. Tudo vem da exportação de histórico de status, restrita a ${FL.canais_incluidos.join(', ')}.<em>A conta fecha: 17h = 07h + entradas entre 07h e 17h − saídas entre 07h e 17h.</em></span></span> <small>${FL.dias_uteis} dias úteis · ${NB(FL.total_esperas)} passagens pela fila no período</small></p>
      <div id="c-fila"></div>
      <div class="fleg" id="l-fila"></div>
      <div class="alertbox" style="border-color:rgba(34,197,94,.3)" data-rot="Destaque"><span class="oi">!</span><span><b>A fila vira todo dia, mas nunca zera.</b> A abertura média é de <b>${NB(Math.round(FL.med_p7))}</b> tickets aguardando atendente e o fechamento, <b>${NB(Math.round(FL.med_p17))}</b> — <b>os ${FL.dias_uteis} dias úteis fecharam todos menores do que abriram</b>. O que sobra às 17h volta como abertura da manhã seguinte somado ao que entra de madrugada, e é por isso que a fila oscila entre ${NB(Math.min(...FD.map(d=>d.p17)))} e ${NB(Math.max(...FD.map(d=>d.p7)))} sem nunca chegar a zero.</span></div>
      <div class="alertbox" data-rot="Como se lê"><span class="oi">!</span><span><b>Quando cada ticket entrou na fila.</b> A entrada é a transição para "Aguardando Atendente" no histórico. Quando o primeiro registro de um ticket já aparece <i>saindo</i> desse status, a entrada não foi logada — aí vale a <b>data de criação do ticket</b>, se ela estiver dentro da janela. Só quando o ticket nasceu antes de 01/10 ele conta como herdado desde a abertura do mês: são <b>${NB(FL.herdados)}</b> no período, não mais do que isso. Como fecho de conferência, o modelo termina com ${NB(FL.abertos_fim)} pendentes e a lista de tickets do Predize mostra ${NB(FL.wa_tickets)} em "Aguardando Atendente" nestes três canais.</span></div>
      <div class="alertbox rd" data-rot="Alerta"><span class="oi">!</span><span><b>A Mia responde quase tanto quanto a equipe inteira.</b> Dos ${NB(Math.round(MQ.atendente+MQ.ia+MQ.fora+MQ.outro+MQ.fila))} tickets que entram na fila por dia útil, <b>${FX(MQ.atendente)} saem com mensagem de um atendente e ${FX(MQ.ia)} com resposta da Mia</b> — ${Math.round(MQ.ia/(MQ.atendente+MQ.ia)*100)}% da dupla é automação. Outros ${FX(MQ.fora)} são respondidos direto no marketplace, fora da Predize, e ${FX(MQ.outro)} saem da fila <b>sem resposta nenhuma</b>, por fechamento ou bloqueio. A média usa os ${FL.dias_maduros} dias já resolvidos (até ${FL.ult_maduro}).</span></div>
      <div class="alertbox" data-rot="Entre jornadas"><span class="oi">!</span><span><b>A fila cai na jornada e volta a encher fora dela.</b> Nos ${FL.dias_uteis} dias úteis ela recuou <b>${NB(Math.abs(dentro))}</b> entre 07h e 17h; nos ${FD.length-1} intervalos entre jornadas subiu <b>${NB(noites)}</b>, ${NB(Math.round(noites/(FD.length-1)))} por noite ou fim de semana — e ${Math.round(K.rec_fora/K.recebidas*100)}% das mensagens do mês chegam fora da escala. As duas contas fecham o trajeto da abertura de ${pri.rot} (${NB(pri.p7)}) ao fechamento de ${ult.rot} (${NB(ult.p17)}): ${NB(noites)} − ${NB(Math.abs(dentro))} = ${NB(ult.p17-pri.p7)}. ${(()=>{let pior=null;for(let i=1;i<FD.length;i++){const g=FD[i].p7-FD[i-1].p17;if(!pior||g>pior.g)pior={g,de:FD[i-1].rot,para:FD[i].rot};}
        return pior.g>0?`O maior salto noturno foi de ${NB(pior.g)} tickets entre ${pior.de} e ${pior.para}.`:'';})()}</span></div></div>

    <div class="panel" style="margin-top:14px"><p class="pt">Dia a dia <small>a conta de abertura, entradas, respostas e fechamento</small></p>
      <table class="tq"><thead>
        <tr><th rowspan="2">Dia</th><th rowspan="2">Pendentes<br>às 07h</th><th rowspan="2">Entraram<br>na fila</th>
            <th colspan="5" style="text-align:center;border-bottom:2px solid #2E3138">Desses que entraram, quem respondeu</th>
            <th rowspan="2">Pendentes<br>às 17h</th><th rowspan="2">Variação<br>do dia</th></tr>
        <tr><th>Atendente</th><th>Mia (IA)</th><th>Por fora</th><th>Sem<br>resposta</th><th>Ainda<br>na fila</th></tr></thead><tbody>
      ${FD.map(d=>`<tr${d.maduro?'':' style="opacity:.62"'}><td><b>${d.rot}</b> <span style="color:#5E636D;font-size:11px">${['seg','ter','qua','qui','sex','sáb','dom'][d.dow]}</span>${d.maduro?'':' <span class="bdg2 b-al" style="margin:0;font-size:9px">parcial</span>'}</td>
        <td><b>${NB(d.p7)}</b></td>
        <td style="color:#FACC15"><b>${NB(d.ent)}</b></td>
        <td style="color:#4ADE80">${NB(d.q_atendente)} <span style="color:#5E636D;font-size:11px">${Math.round(d.q_atendente/d.ent*100)}%</span></td>
        <td style="color:#38BDF8">${NB(d.q_ia)} <span style="color:#5E636D;font-size:11px">${Math.round(d.q_ia/d.ent*100)}%</span></td>
        <td style="color:#7C818C">${NB(d.q_fora)}</td>
        <td style="color:#F87171">${NB(d.q_outro)}</td>
        <td style="color:#7C818C">${NB(d.q_fila)}</td>
        <td><b style="color:${d.p17>d.p7?'#F87171':'#4ADE80'}">${NB(d.p17)}</b></td>
        <td style="color:${d.delta>0?'#F87171':'#4ADE80'};font-weight:700">${d.delta>0?'+'+NB(d.delta):NB(d.delta)}</td></tr>`).join('')}
      <tr class="tot"><td>Média por dia útil <span style="color:#5E636D;font-weight:500;font-size:11px">· respostas dos ${FL.dias_maduros} dias fechados</span></td><td><b>${FM(FL.med_p7)}</b></td>
        <td style="color:#FACC15"><b>${FM(FL.med_ent_mad)}</b></td>
        <td style="color:#4ADE80"><b>${FM(MQ.atendente)}</b></td>
        <td style="color:#38BDF8"><b>${FM(MQ.ia)}</b></td>
        <td style="color:#7C818C">${FM(MQ.fora)}</td>
        <td style="color:#F87171">${FM(MQ.outro)}</td>
        <td style="color:#7C818C">${FM(MQ.fila)}</td>
        <td><b style="color:#4ADE80">${FM(FL.med_p17)}</b></td>
        <td style="color:#4ADE80;font-weight:700">−${FM(Math.abs(FL.med_p17-FL.med_p7))}</td></tr></tbody></table>
      <div class="alertbox rd" data-rot="Alerta"><span class="oi">!</span><span><b>Os últimos ${FD.length-FL.dias_maduros} dias ainda não fecharam e estão marcados como parciais.</b> A exportação foi tirada na manhã de 22/10, então boa parte do que entrou em ${FD.slice(FL.dias_maduros).map(d=>d.rot).join(', ')} <b>ainda estava na fila</b> na hora do corte — ${NB(FD.slice(FL.dias_maduros).reduce((t,d)=>t+d.q_fila,0))} tickets. Isso puxa a coluna do atendente para baixo nesses dias e a da Mia para cima, porque a automação responde em minutos e a pessoa leva horas. <b>Por isso a média da última linha usa só os ${FL.dias_maduros} dias já resolvidos</b>, até ${FL.ult_maduro}.</span></div>
      <div class="alertbox" data-rot="Como se lê"><span class="oi">!</span><span><b>O que significa cada coluna de resposta.</b> <b>Atendente</b> é quando há mensagem manual no ticket nos 10 minutos ao redor da saída da fila. <b>Mia</b> é quando há mensagem da IA nessa janela. <b>Por fora</b> é resposta dada direto no marketplace, sem passar pela Predize — é gente respondendo, mas sem registro na plataforma. <b>Sem resposta</b> é o ticket que saiu da fila por fechamento ou bloqueio, sem nenhuma mensagem. <b>Ainda na fila</b> é o que não tinha saído até o corte da exportação.</span></div>
      <div class="alertbox" data-rot="Atenção"><span class="oi">!</span><span><b>Quanto tempo se espera na fila.</b> A mediana de permanência em "Aguardando Atendente" é de <b>${FL.med_espera_u}</b> de trabalho (${FL.med_espera} corridos), e <b>${FX(FL.acima_12h)}% dos tickets passam de 12 horas úteis</b> aguardando. No fechamento de ${ult.rot} ainda havia <b>${NB(FL.abertos_fim)} tickets na fila</b>: ${FL.abertos_canal.filter(c=>c.n).map(c=>NB(c.n)+' '+(ARTC[c.nome]||'na')+' '+c.nome).join(', ')}. Das ${NB(FL.respondidas)} saídas do período, ${FL.saidas_destino.map(x=>NB(x.n)+' para "'+x.s+'"').join(', ')}.</span></div></div>

`;

    /* ---------- quebra por canal ---------- */
    if(FL.canais && FL.canais.length){
      const CN=FL.canais, mxC=Math.max(...CN.map(c=>c.med_ent_mad||c.med_ent));
      h += `<div class="panel" style="margin-top:14px"><p class="pt"><span class="tip">A mesma conta, canal por canal<span class="tipbox"><b>Por que a quebra importa</b><br>A fila total é a soma de filas com donos diferentes e ritmos muito diferentes. Dois números separam um canal que anda de um canal parado: o <b>saldo dentro da jornada</b> (quanto a fila sobe ou desce entre 07h e 17h, com gente trabalhando) e a <b>cobertura humana</b> das saídas — quantas delas coincidem com uma mensagem digitada por um atendente.<em>As linhas somam o total: Madeira Madeira e Via aparecem juntos em "Outros".</em></span></span> <small>média por dia útil · respostas apuradas nos ${FL.dias_maduros} dias já fechados</small></p>
        <div class="trg">${CN.map(c=>{
          const cor=CC[c.id]||'#7C818C', Q=c.med_q_mad||c.med_q, dup=Q.atendente+Q.ia;

            <div class="trrow"><span>Ainda na fila em ${ult.rot}</span><b>${NB(c.abertos)}</b></div>
          </div>`;}).join('')}</div>
        <div class="fleg"><span><u style="background:#22C55E"></u>Atendente</span><span><u style="background:#38BDF8"></u>Mia (IA)</span><span><u style="background:#3F444C"></u>Por fora, sem resposta ou ainda na fila</span></div>
        <div id="c-filac"></div><div class="fleg" id="l-filac"></div>
        <div class="alertbox rd" data-rot="Alerta"><span class="oi">!</span><span>${(()=>{const sh=CN.find(c=>c.id==='shopee'),Q=sh.med_q_mad||sh.med_q;

        <div class="alertbox" data-rot="Atenção"><span class="oi">!</span><span>${(()=>{const ml=CN.find(c=>c.id==='mercadolivre'),mg=CN.find(c=>c.id==='magalu');

        <div class="alertbox" data-rot="Como se lê"><span class="oi">!</span><span><b>Por que a soma dos três canais é o total.</b> Esta análise cobre <b>apenas ${FL.canais_incluidos.join(', ')}</b>, como pedido. Madeira Madeira e Via ficaram de fora: juntos tiveram menos de uma dezena de passagens pela fila do atendente no período e distorciam as médias sem acrescentar nada. Os demais blocos do relatório seguem contando todos os canais.</span></div></div>

`;

  if(D.fila && D.fila.canais && D.fila.canais.length){

    const DOW=['seg','ter','qua','qui','sex','sáb','dom'];

          <th>Dia</th><th>Pendentes<br>às 07h</th><th>Entraram<br>na fila</th><th style="text-align:left">Composição<br>das entradas</th>
