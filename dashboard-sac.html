<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Atendimento SAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B; --bar:#000; --card:#141518; --card2:#17181C; --line:#26282E; --line2:#33363E;
  --tx:#FFFFFF; --mid:#B7BBC4; --mut:#7C818C;
  --orange:#FF6B35; --blue:#3B82F6; --green:#22C55E; --purple:#A855F7;
  --yellow:#EAB308; --cyan:#06B6D4; --red:#EF4444; --pink:#EC4899;
  --shopee:#FF6B35; --meli:#EAB308; --magalu:#3B82F6; --madeira:#22C55E;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1330px;margin:0 auto;padding:0 20px 80px}

/* topbar */
.topbar{background:var(--bar);border-bottom:1px solid var(--line);padding:7px 0;margin-bottom:12px}
.topbar .in{max-width:1330px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px}
.chipbtn{border:1px solid var(--line2);background:#131417;border-radius:7px;padding:4px 10px;font-size:12px;
  color:var(--mid);font-weight:500}
.topbar .t{font-size:12.5px;color:var(--mid)}

/* hero */
.hero{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:linear-gradient(100deg,rgba(255,107,53,.16) 0%, rgba(255,107,53,.03) 32%, rgba(20,21,24,1) 62%),var(--card);
  padding:13px 16px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.hero .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(140deg,#FF8A3D,#F0522B);flex:none;box-shadow:0 6px 18px rgba(255,107,53,.28)}
.hero h1{font-size:17px;font-weight:800;letter-spacing:.4px;margin:0;text-transform:uppercase}
.hero p{margin:2px 0 0;color:var(--mut);font-size:11.5px}
.hero .pills{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:999px;padding:4px 11px;
  font-size:11px;font-weight:600;background:rgba(0,0,0,.35)}
.pill.g{border-color:rgba(34,197,94,.5);color:#4ADE80}
.pill.b{border-color:rgba(59,130,246,.5);color:#60A5FA}
.pill.o{border-color:rgba(255,107,53,.5);color:#FF8A5B}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}


/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:16px 0 0;
  scrollbar-width:thin}
.tab{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;font-size:13px;color:var(--mut);
  font-weight:500;border:0;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
  font-family:var(--f)}
.tab i{width:7px;height:7px;border-radius:50%;background:#3A3D45;display:inline-block;flex:none}
.tab:hover{color:var(--mid)}
.tab.on{color:var(--orange);border-bottom-color:var(--orange)}
.tab.on i{background:var(--orange);box-shadow:0 0 0 3px rgba(255,107,53,.18)}
.tab.done i{background:var(--green)}
.tab .bdg{font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:5px;text-transform:uppercase}
.bdg.gr{background:rgba(34,197,94,.16);color:#4ADE80}
.bdg.or{background:rgba(255,107,53,.16);color:#FF8A5B}
.bdg.gy{background:#202329;color:var(--mut)}
.bdg.rd{background:rgba(239,68,68,.16);color:#F87171}
.tab:focus-visible{outline:2px solid var(--orange);outline-offset:-4px;border-radius:6px}

/* section label */
.slab{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);
  margin:26px 0 11px;display:flex;align-items:center;gap:12px}
.slab::after{content:"";flex:1;height:1px;background:var(--line)}
.slab .hint{font-size:11px;font-weight:500;letter-spacing:.2px;text-transform:none;color:#5E636D}

/* kpi cards */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:11px}
.kc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 15px 14px;
  overflow:hidden}
.kc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--g)}
.kc .lab{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.kc .val{font-size:26px;font-weight:800;letter-spacing:-.7px;margin:8px 0 0;line-height:1.05;color:var(--c)}
.kc .sub{font-size:12px;color:var(--mut);margin-top:6px}
.kc .gh{position:absolute;right:14px;bottom:14px;font-size:30px;opacity:.09;pointer-events:none}
.kc .bdg2{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:11px;font-weight:600;
  padding:4px 9px;border-radius:6px}
.b-ok{background:rgba(34,197,94,.13);color:#4ADE80}
.b-wr{background:rgba(234,179,8,.13);color:#FACC15}
.b-al{background:rgba(239,68,68,.14);color:#F87171}
.b-nt{background:rgba(59,130,246,.13);color:#60A5FA}

/* mês cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 14px;text-align:center}
.mc .mn{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.mc .mv{font-size:29px;font-weight:800;letter-spacing:-.7px;margin:9px 0 3px;color:var(--c)}
.mc .ms{font-size:12px;color:var(--mid);font-weight:600}
.mc .mf{font-size:10.5px;color:#5E636D;margin-top:9px}
.mc.empty{border-style:dashed;opacity:.55}
.mc.empty .mv{color:#3A3D45}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.pt{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);margin:0 0 12px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pt small{font-weight:500;letter-spacing:.2px;text-transform:none;color:#5E636D;font-size:11.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:11.5px;color:var(--mid);margin-top:13px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.note{margin-top:12px;padding:10px 12px;background:#101114;border:1px solid var(--line);border-left:3px solid var(--orange);
  border-radius:8px;color:var(--mid);font-size:12.5px;line-height:1.65}
.note b{color:#fff;font-weight:600}
details.met{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
details.met summary{cursor:pointer;font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);list-style:none}
details.met summary::-webkit-details-marker{display:none}
details.met summary::before{content:'▸ ';color:var(--orange)}
details.met[open] summary::before{content:'▾ '}
details.met ul{margin-top:12px}
.note.blue{border-left-color:var(--blue)}
.note.green{border-left-color:var(--green)}

/* barra-resumo de reputação */
.repbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:7px 11px;margin-top:10px}
.repbar .tt{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.repchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#101114;
  border-radius:999px;padding:5px 11px;font-size:12px;color:var(--mid);cursor:pointer;font-family:var(--f)}
.repchip:hover{border-color:var(--line2)}
.repchip b{color:#fff;font-weight:700}
.repchip .sd{width:8px;height:8px;border-radius:50%;flex:none}
.repbar .lk{margin-left:auto;font-size:11.5px;color:var(--orange);cursor:pointer;background:none;border:0;
  font-family:var(--f);font-weight:600}

/* reputação */
.tbhist th,.tbhist td{text-align:center;padding:7px 6px;font-size:11.5px;white-space:nowrap}
.tbhist td:first-child,.tbhist th:first-child,.tbhist td:nth-child(2),.tbhist th:nth-child(2){text-align:left}
.tbhist .hj{background:rgba(255,255,255,.04)}
.aud{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:11px}
.aud .rc{overflow:visible}
.aud .rc::before{border-radius:12px 12px 0 0}
.tip{position:relative;cursor:help;border-bottom:1px dotted #4A4E56}
.tip .tipbox{visibility:hidden;opacity:0;position:absolute;left:0;bottom:calc(100% + 9px);width:min(330px,72vw);
  background:#14171B;border:1px solid #333740;border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.55;
  color:#C9CDD4;font-weight:400;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.55);transition:opacity .14s;
  pointer-events:none;text-align:left;white-space:normal;letter-spacing:0}
.tip .tipbox b{color:#F0F2F5}
.tip .tipbox em{color:#7C818C;font-style:normal;display:block;margin-top:6px;font-size:11px}
.tip:hover .tipbox{visibility:visible;opacity:1}
.tip.tr .tipbox{left:auto;right:0}
.le{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:10px;cursor:help;
  background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.28);color:#93C5FD;
  border-radius:999px;padding:3px 10px 3px 4px;font-size:11px;font-weight:600;letter-spacing:.2px;
  transition:background .14s,border-color .14s}
.le:hover{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.5)}
.le>i{width:16px;height:16px;border-radius:50%;background:#3B82F6;color:#0B0D10;
  display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;flex:0 0 16px}
.le.al{background:rgba(234,179,8,.10);border-color:rgba(234,179,8,.30);color:#FDE68A}
.le.al>i{background:#EAB308}
.le.ru{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.30);color:#FCA5A5}
.le.ru>i{background:#EF4444}
.le.bo{background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.30);color:#86EFAC}
.le.bo>i{background:#22C55E}
.le .tipbox{visibility:hidden;opacity:0;position:absolute;left:0;bottom:calc(100% + 9px);width:min(460px,80vw);
  background:#14171B;border:1px solid #333740;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.6;
  color:#C9CDD4;font-weight:400;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.55);transition:opacity .14s;
  pointer-events:none;text-align:left;white-space:normal;letter-spacing:0}
.le .tipbox b{color:#F0F2F5}
.le:hover .tipbox{visibility:visible;opacity:1}
.le.down .tipbox{bottom:auto;top:calc(100% + 9px)}
.le.right .tipbox{left:auto;right:0}
.trg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px}
.trc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;overflow:hidden}
.trc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.trc h4{font-size:13.5px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.trc .big{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.trc .big small{font-size:13px;font-weight:600;letter-spacing:0;margin-left:3px}
.trc .cap2{font-size:10.5px;color:#7C818C;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.trbar{position:relative;height:22px;background:#1C1F24;border-radius:5px;margin:11px 0 5px;overflow:hidden}
.trbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.trbar b{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.85}
.trbar span{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:10.5px;color:#C9CDD4;font-weight:700}
.trrow{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-top:1px dashed #23262C}
/* capacidade real: barra empilhada demanda = entregue + só IA + sem nada */
.fbar{position:relative;height:26px;background:#1C1F24;border-radius:5px;margin:10px 0 6px;display:flex;overflow:hidden}
.fbar i{display:block;height:100%}
.fleg{display:flex;flex-wrap:wrap;gap:5px 13px;font-size:10.5px;color:#7C818C;margin-bottom:9px}
.fleg span{display:flex;align-items:center;gap:5px}
.fleg u{width:9px;height:9px;border-radius:2px;text-decoration:none;flex:none}
/* repartição da jornada */
.jbar{position:relative;height:30px;background:#1C1F24;border-radius:6px;display:flex;overflow:hidden;margin:9px 0 7px}
.jbar i{display:flex;align-items:center;justify-content:center;height:100%;font-size:10.5px;font-weight:700;color:#0B0D10;white-space:nowrap;overflow:hidden}
.trrow span{color:#7C818C}
.trrow b{color:#E6E9EE}
.audrow:nth-last-of-type(-n+2) .tipbox{bottom:auto;top:calc(100% + 9px)}
@media (max-width:640px){ .tip .tipbox{width:78vw} }
.audbar{height:6px;border-radius:3px;background:#24272D;overflow:hidden;margin-top:4px}
.audbar i{display:block;height:100%;border-radius:3px}
.audrow{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;margin-top:9px}
.repgrid{display:grid;grid-template-columns:repeat(var(--rn,4),minmax(0,1fr));gap:11px}
.repgrid .rc{min-width:0;padding:12px 11px}
.repgrid .rc-h h4{font-size:13px}
.repgrid .rc-h .src{margin-left:0;flex-basis:100%}
.repgrid .rc-v b{font-size:22px}
.repgrid .rc-v span{font-size:11px}
.rc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:hidden}
.rc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.rc-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rc-h h4{font-size:14px;font-weight:700;margin:0}
.rc-h .src{font-size:10.5px;color:#5E636D;margin-left:auto}
.rc-v{display:flex;align-items:baseline;gap:7px;margin:9px 0 2px}
.rc-v b{font-size:25px;font-weight:800;letter-spacing:-.8px;line-height:1}
.rc-v span{font-size:11.5px;color:var(--mut)}
.regua{display:flex;gap:3px;margin:13px 0 4px}
.regua i{height:7px;flex:1;border-radius:3px;opacity:.32}
.regua i.on{opacity:1}
.marca{position:relative;height:14px;font-size:9.5px;color:var(--mut)}
.marca span{position:absolute;transform:translateX(-50%);white-space:nowrap;top:-1px}
.rc-p{font-size:11px;color:var(--mut);border-top:1px solid var(--line);margin-top:9px;padding-top:8px;
  display:flex;gap:12px;flex-wrap:wrap}
.rc-p b{color:var(--tx);font-weight:600}
.ri{display:flex;align-items:center;gap:8px;padding:5.5px 0;border-top:1px solid var(--line);font-size:12px}
.ri .n{color:var(--mid);flex:1}
.ri .v{font-weight:700;font-size:13px}
.ri .lm{font-size:10.5px;color:#5E636D;min-width:74px;text-align:right}
.ri .sd{width:8px;height:8px;border-radius:50%;flex:none}
.alertbox{background:rgba(234,179,8,.09);border:1px solid rgba(234,179,8,.28);border-radius:8px;padding:7px 10px;
  font-size:11px;color:#FACC15;margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.alertbox.rd{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.38);color:#FCA5A5}
.alertbox.top{margin:0 0 15px;padding:11px 13px;font-size:12px;line-height:1.55}
.alertbox.top b{color:#FECACA}

/* tabela */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);
  text-align:right;padding:0 0 11px;border-bottom:1px solid var(--line2)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 0;border-bottom:1px solid var(--line);text-align:right;color:var(--mid);font-weight:500}
td:first-child{color:var(--tx);font-weight:600}
tbody tr:last-child td{border-bottom:0}
tr.tot td{color:#fff;font-weight:700}

/* canal cards */
.chc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;overflow:hidden}
.chc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.chc h3{font-size:16px;font-weight:700;margin:0}
.chc .big{font-size:28px;font-weight:800;letter-spacing:-.7px;margin:10px 0 14px;color:var(--c)}
.chc .big small{font-size:11.5px;font-weight:500;color:var(--mut);letter-spacing:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.kv b{color:var(--tx);font-weight:600}

/* atendente */
.at{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.at .top{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0A0A0B;flex:none}
.at h3{font-size:16px;font-weight:700;margin:0}
.at .role{font-size:11.5px;color:var(--mut)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:9px;overflow:hidden;margin-top:14px}
.mini div{background:var(--card2);padding:11px}
.mini .l{font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.mini .v{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.5px}

/* seletor de período */
.perbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.perbtn{border:1px solid var(--line2);background:#101114;border-radius:8px;padding:6px 13px;font-size:12.5px;
  color:var(--mid);cursor:pointer;font-family:var(--f);font-weight:600}
.perbtn:hover{color:#fff}
.perbtn.on{background:var(--orange);border-color:var(--orange);color:#0A0A0B}
.perinfo{font-size:11.5px;color:#5E636D;margin-left:4px}

/* caixa de observação */
.obsbox{display:flex;gap:9px;align-items:flex-start;background:rgba(59,130,246,.07);
  border:1px solid rgba(59,130,246,.22);border-radius:9px;padding:10px 13px;margin-bottom:11px;
  font-size:12px;color:#AFC6EA;line-height:1.6}
.obsbox b{color:#DCE9FF;font-weight:600}
.obsbox .oi{flex:none;opacity:.9}

/* capacidade */
.cap{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
.capc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;overflow:hidden}
.capc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.capc h4{font-size:14px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.capbig{display:flex;gap:16px;align-items:flex-end;margin-bottom:12px}
.capbig div{flex:1}
.capbig .l{font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.capbig .v{font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.1;margin-top:3px}
.capbig .u{font-size:10.5px;color:var(--mut);font-weight:500}
.gauge{height:6px;border-radius:4px;background:#1C1E24;overflow:hidden;margin:2px 0 4px}
.gauge i{display:block;height:100%;border-radius:4px}

/* listas */
ul.ls{margin:0;padding-left:17px;color:var(--mid);font-size:12.5px;line-height:1.7}
ul.ls li{margin-bottom:8px}
ul.ls b{color:#fff;font-weight:600}

/* empty state */
.empty-state{background:var(--card);border:1px dashed var(--line2);border-radius:12px;padding:56px 28px;text-align:center}
.empty-state .ei{font-size:38px;opacity:.35}

s protocolos tiveram atendente dentro de 12 horas úteis</b>; 40.0% (883 conversas) não chegaram a um humano.", "<b>12775 mensagens (39%) chegam fora da escala</b> — noites, intervalo de almoço e fins de semana — e ficam represadas até o próximo turno.", "<b>Pré-venda é o maior vazamento</b>: 2d 20h de mediana no atendimento humano, 3.0% no SLA e 22 perguntas sem resposta.", "<b>Um único atendente sustenta a Shopee</b>: 801 dos 2.205 protocolos de chat estão com Fabricio.", "<b>814 tickets de pós-venda seguiam abertos</b> (52 parados na equipe), com ciclo mediano de 5d úteis 0h de trabalho."]}, "metodo": ["<b>Jornada considerada: segunda a sexta, das 07h às 11h e das 12h às 17h</b> — 9 horas úteis por dia, 23 dias úteis no período. Todos os indicadores de tempo têm duas leituras: <b>tempo corrido</b> (relógio) e <b>tempo útil</b> (só dentro da escala).", "<b>Sara Juste iniciou em 13/07/2026.</b> Os indicadores dela cobrem 19 dias corridos (13 dias úteis), contra 31 dos demais.", "<b>Tempo útil</b> desconta noites, o intervalo das 11h às 12h e os fins de semana. Uma mensagem recebida sexta às 16h50 e respondida segunda às 7h10 conta como 30 minutos úteis, não como 62 horas.", "<b>Clientes por dia</b> é o total de conversas distintas dividido pelos dias úteis previstos na escala, não pelos dias em que houve atividade registrada. A coluna de ocupação mostra a diferença entre os dois.", "<b>Tempo por cliente</b> divide os 540 minutos úteis do dia por essa média. É o teto teórico: supõe o atendente 100% do tempo em atendimento, sem reuniões nem tarefas paralelas.", "<b>Respostas automáticas</b> reúnem IA (MIA2), mensagens automáticas do marketplace e avisos de ausência. Manuais são as digitadas por um atendente na plataforma.", "<b>SLA de protocolo de chat</b> é de 12 horas. Passamos a medir em <b>horas úteis</b>, o que é mais justo com a escala — o número corrido também aparece para comparação.", "<b>Tickets sem responsável</b> (2.569 de pós-venda) são majoritariamente mensageria automática do Mercado Livre.", "<b>Protocolos encerrados</b> (26 de 2.205) refletem registro de baixa na plataforma, não casos resolvidos.", "<b>Divisão de canais</b>: Fabricio responde a Shopee, Yasmin o Mercado Livre e Sara o Magalu e o Madeira Madeira. A seção de carga soma tudo que entrou no canal de cada um, independentemente de quem respondeu.", "<b>Mensagens automáticas do Mercado Livre.</b> Todo cliente do canal recebe avisos de nota fiscal emitida, pedido recebido e pedido entregue. São 9.727 mensagens no período (76.9% das enviadas no canal), que inflam o volume total sem representar trabalho de atendimento. Sem elas, o total do período seria 48.586 em vez de 58.313.", "<b>Ritmo necessário</b> = 540 minutos úteis do dia ÷ atendimentos que chegam por dia útil ao canal e exigem resposta humana. É o tempo máximo que o atendente pode gastar em cada caso para não virar o dia com fila. Mensagens automáticas não entram no cálculo.", "<b>Usuários administrativos foram excluídos</b> das tabelas de atendimento (Paola Miranda)."], "sara_herdados": 58}}, {"key": "2026-08", "nome": "Agosto", "ano": 2026, "status": "fechado", "dados": {"periodo": {"ini": "01/08/2026", "fim": "31/08/2026"}, "parcial": false, "kpi": {"msgs": 67334, "recebidas": 34946, "enviadas": 32388, "conversas": 10347, "auto_pct": 62.4, "manual": 6956, "ia": 7065, "pos": 4759, "reclam": 750, "pre": 392, "med_resp": "5m 07s", "p1h": 61.5, "med_resp_u": "1m 27s", "p1h_u": 64.6, "med_manual_u": "4h 31m", "p1h_manual_u": 17.1, "fechados": 850, "abertos": 1188, "aguard_atend": 140, "med_ciclo": "6d 5h", "med_ciclo_u": "4d úteis 0h", "dias_uteis": 21, "rec_jornada": 19262, "rec_fora": 15684, "man_fora": 185}, "canais": [{"id": "shopee", "nome": "Shopee", "msgs": 31661, "rec": 20533, "env": 11128, "conversas": 3998, "auto_pct": 35.4, "med": "3m 20s", "med_u": "1m 35s", "p1h": 59.1, "pos": 0, "reclam": 0, "fech_pct": 0, "pre": 0, "msg_conv": 7.9}, {"id": "mercadolivre", "nome": "Mercado Livre", "msg chat.", "<b>O agente virtual converte 13.3%</b> das perguntas de pré-venda respondendo em 31s."], "ruim": ["<b>Fecha-se menos do que entra.</b> Os tickets fechados caíram de 1.042 (julho) para 850, enquanto os abertos subiram de 814 para 1.188 — 140 deles parados na equipe. É a fila crescendo mês a mês.", "<b>Pré-venda é o pior indicador do mês</b>: 96 das 392 perguntas ficaram sem resposta (24.5%, contra 8% em julho), com 2.3% de SLA e mediana de 1d 23h no atendimento humano.", "<b>A Shopee entrou em zona crítica de ritmo</b>: 1.726 atendimentos exigindo resposta humana em 21 dias úteis dão <b>6.6 minutos por caso</b> — o mais apertado já registrado — e o canal cumpre só 12.5% do SLA do marketplace.", "<b>15.684 mensagens (45%) chegam fora da escala</b> — noites, intervalo de almoço e fins de semana. A fatia subiu de 39% em julho para 45%.", "<b>1.283 protocolos de chat (33.7%) não chegaram a nenhum atendente</b> e 2.139 dos 3.803 seguem sem responsável designado.", "<b>Metade dos prazos do marketplace estourou</b>: 745 de 1.458 tickets com prazo encerrado dentro do SLA (51.1%), com outros 7.439 ainda correndo.", "<b>Fabricio responde em 5h 20m de mediana útil</b> e só 7.4% em até 1 hora — reflexo de sustentar sozinho 1.193 protocolos de chat da Shopee."]}, "metodo": ["<b>Mês fechado.</b> Os dados cobrem 01/08/2026 a 31/08/2026 — 31 dias corridos e 21 dias úteis — e substituem a leitura parcial que ia até 28/08. Todos os totais mudaram, inclusive o dia 28, que na leitura anterior estava incompleto (500 mensagens contra 2.924 no fechamento).", "<b>Jornada considerada: segunda a sexta, das 07h às 11h e das 12h às 17h</b> — 9 horas úteis por dia. Todos os indicadores de tempo têm duas leituras: <b>tempo corrido</b> (relógio) e <b>tempo útil</b> (só dentro da escala).", "<b>Tempo útil</b> desconta noites, o intervalo das 11h às 12h e os fins de semana. Uma mensagem recebida sexta às 16h50 e respondida segunda às 7h10 conta como 30 minutos úteis, não como 62 horas.", "<b>Comparação com julho.</b> Julho teve 23 dias úteis e agosto 21. Indicadores por dia útil já corrigem essa diferença; totais absolutos, não — agosto cresceu 15% em mensagens com dois dias úteis a menos.", "<b>Paola Miranda não é atendente.</b> É usuária administrativa e não faz parte da equipe de atendimento. Nos dias 27 e 28/08 ela respondeu 302 protocolos e 294 mensagens, todas da Shopee — mutirão para limpar o gargalo acumulado do canal, não rotina de atendimento. Aparece na tabela de responsáveis do chat porque o volume é material, sempre marcada como apoio, e fica fora das tabelas de atendentes, de carga e de capacidade.", "<b>Clientes por dia</b> é o total de conversas distintas dividido pelos dias úteis previstos na escala, não pelos dias em que houve atividade registrada. A coluna de ocupação mostra a diferença entre os dois.", "<b>Tempo por cliente</b> divide os 540 minutos úteis do dia por essa média. É o teto teórico: supõe o atendente 100% do tempo em atendimento, sem reuniões nem tarefas paralelas.", "<b>Respostas automáticas</b> reúnem IA (MIA2), mensagens automáticas do marketplace e avisos de ausência. Manuais são as digitadas por um atendente na plataforma. Respostas dadas direto no marketplace aparecem como \"por fora\" e não entram em nenhum dos dois grupos.", "<b>SLA de protocolo de chat</b> é de 12 horas, medido em <b>horas úteis</b> — o número corrido também aparece para comparação.", "<b>Tickets sem responsável</b> (3.608 de pós-venda) são majoritariamente mensageria automática do Mercado Livre.", "<b>Protocolos encerrados</b> (317 de 3.803) refletem registro de baixa na plataforma, não casos resolvidos.", "<b>Divisão de canais</b>: Fabricio responde a Shopee, Yasmin o Mercado Livre e Sara o Magalu e o Madeira Madeira. A seção de carga soma tudo que entrou no canal de cada um, independentemente de quem respondeu.", "<b>Mensagens automáticas do Mercado Livre.</b> Todo cliente do canal recebe avisos de nota fiscal emitida, pedido recebido e pedido entregue. São 14.250 mensagens no período (83.3% das enviadas no canal), que inflam o volume total sem representar trabalho de atendimento. Sem elas, o total do mês seria 53.084 em vez de 67.334.", "<b>Ritmo necessário</b> = 540 minutos úteis do dia ÷ atendimentos que chegam por dia útil ao canal e exigem resposta humana. É o tempo máximo que o atendente pode gastar em cada caso para não virar o dia com fila. Mensagens automáticas não entram no cálculo.", "<b>Via Varejo aparece na aba Reputação, mas não nos gráficos por canal.</b> São duas coisas diferentes: a reputação é a nota da conta no marketplace, enquanto os gráficos de volume vêm do Predize, onde o canal registrou 84 mensagens em agosto (0,1% do total) e segue somado apenas aos totais gerais. É justamente esse contraste que explica a nota baixa: base pequena de pedidos, em que cada problema pesa muito no percentual.", "<b>Efeito da MIA</b> compara a média de retornos do cliente por ticket entre atendimentos que tiveram resposta da IA e os que não tiveram, considerando só tickets com histórico de mudança de status."], "tempo_real": {"limiar": 15, "dias_uteis": 21, "atendentes": [{"nome": "Yasmin Fernandes", "tickets": 1256, "msgs": 2671, "blocos": 106, "ativo_min": 6346.0, "ativo_h": 105.8, "por_atend": 5.1, "por_msg": 2.4, "ativo_dia_h": 5.0, "ocupacao": 56, "dias_ativos": 22, "msgs_atend": 2.1, "teto": 9.0, "uso_pct": 57}, {"nome": "Fabricio Barros", "tickets": 1391, "msgs": 2238, "blocos": 120, "ativo_min": 4078.4, "ativo_h": 68.0, "por_atend": 2.9, "por_msg": 1.8, "ativo_dia_h": 3.2, "ocupacao": 36, "dias_ativos": 20, "msgs_atend": 1.6, "teto": 8.2, "uso_pct": 35}, {"nome": "Sara Juste", "tickets": 709, "msgs": 1752, "blocos": 196, "ativo_min": 5864.2, "ativo_h": 97.7, "por_atend": 8.3, "por_msg": 3.3, "ativo_dia_h": 4.7, "ocupacao": 52, "dias_ativos": 23, "msgs_atend": 2.5, "teto": 16.0, "uso_pct": 52}], "equipe": {"por_atend": 4.9, "por_msg": 2.4, "ativo_h": 271.5, "tickets": 3356, "msgs": 6661, "oc 9, "sem_nada": 666}}, "leitura": {"bom": ["<b>Setembro fechou como o maior mês da série</b>: 94.598 mensagens contra 67.334 em agosto — 40% a mais — e a mediana de resposta ficou em 1m 29s em horário útil, praticamente igual à de agosto (1m 27s).", "<b>O SLA de chat subiu pelo terceiro mês seguido</b>: 59.0% dos protocolos chegaram a um humano em até 12h úteis, contra 50.0% em agosto e 35.8% em julho.", "<b>O ciclo de resolução do pós-venda caiu pela metade</b>: mediana de 2d úteis 1h, contra 4d úteis 0h em agosto.", "<b>A fatia de protocolos sem nenhum toque humano caiu para 30.2%</b>, contra 33.7% em agosto, mesmo com o volume de protocolos dobrando (8.031 contra 3.803).", "<b>A equipe entregou 6.072 atendimentos com resposta humana</b> em 21 dias úteis — 289,1 por dia, contra 232 em agosto. A produção subiu junto com o volume.", "<b>O agente virtual segue resolvendo pré-venda em 31s com 100% de SLA</b> e é o único caminho da loja que não estoura prazo."], "ruim": ["<b>31,7 atendimentos por dia não recebem resposta nenhuma</b> — nem humana, nem automática. São 666 no mês, e é essa a fila que vira reclamação formal depois.", "<b>Chegam 472,7 atendimentos por dia e a equipe responde 289,1</b>: 61,2% de cobertura. Com 2h diárias reservadas para assistência, e-mail e WhatsApp, cabem 414 por dia — faltam 58,7, ou 1.233 no mês.", "<b>A Shopee segue com o SLA do marketplace no chão</b>: 15.3% no geral, com o chat praticamente zerado. O canal concentra 297,6 atendimentos por dia útil num atendente só.", "<b>Reclamações formais chegaram a 1.097</b>, contra 750 em agosto — 46% a mais, e o maior número da série.", "<b>23.221 mensagens (46%) chegam fora da escala</b> — noites, intervalo de almoço e fins de semana — e ficam represadas até o próximo turno.", "<b>Pré-venda segue parada no atendimento humano</b>: 123 das 413 perguntas sem resposta e 18.2% de SLA.", "<b>Os tickets em aberto subiram para 1.569</b>, contra 1.188 em agosto. Fecha-se menos do que entra pelo terceiro mês seguido."]}, "metodo": ["<b>Mês fechado.</b> Os dados cobrem 01/09/2026 a 30/09/2026. São 30 dias corridos e <b>21 dias úteis</b>: setembro tem 22 dias de semana, mas o dia 7 foi feriado da Independência e não houve nenhuma resposta manual da equipe, então ele saiu do denominador. Todos os indicadores por dia usam 21.", "<b>Jornada considerada: segunda a sexta, das 07h às 11h e das 12h às 17h</b> — 9 horas úteis por dia. Todos os indicadores de tempo têm duas leituras: <b>tempo corrido</b> (relógio) e <b>tempo útil</b> (só dentro da escala).", "<b>Tempo útil</b> desconta noites, o intervalo das 11h às 12h e os fins de semana. Uma mensagem recebida sexta às 16h50 e respondida segunda às 7h10 conta como 30 minutos úteis, não como 62 horas.", "<b>Há dois SLAs diferentes no relatório e eles não se contradizem.</b> O SLA de chat da aba de protocolos mede se um humano respondeu em até 12 horas úteis — esse melhorou. O SLA da seção de tickets é o prazo do próprio marketplace, mais curto — esse despencou. A leitura conjunta é que a equipe responde, mas cada vez mais perto ou depois do limite do canal.", "<b>Paola Miranda não é atendente.</b> É usuária administrativa e não faz parte da equipe. Aparece marcada como apoio na tabela de chat pelo volume residual e fica fora das tabelas de atendentes, carga, capacidade e do auditor de qualidade.", "<b>Clientes por dia</b> é o total de conversas distintas dividido pelos dias úteis previstos na escala, não pelos dias em que houve atividade registrada. A coluna de ocupação mostra a diferença entre os dois.", "<b>Tempo por cliente</b> divide os 540 minutos úteis do dia por essa média. É o teto teórico: supõe o atendente 100% do tempo em atendimento, sem reuniões nem tarefas paralelas.", "<b>Respostas automáticas</b> reúnem IA (MIA2), mensagens automáticas do marketplace e avisos de ausência. Manuais são as digitadas por um atendente na plataforma. Respostas dadas direto no marketplace aparecem como \"por fora\" e não entram em nenhum dos dois grupos.", "Tickets sem responsável são majoritariamente mensageria automática do Mercado Livre.", "Protocolos encerrados (4.970 de 8.031) refletem registro de baixa na plataforma. não casos resolvidos.", "<b>Divisão de canais</b>: Fabricio responde a Shopee, Yasmin o Mercado Livre e Sara o Magalu e o Madeira Madeira. A seção de carga soma tudo que entrou no canal de cada um, independentemente de quem respondeu.", "<b>Mensagens automáticas do Mercado Livre.</b> Todo cliente do canal recebe avisos de nota fiscal emitida. pedido recebido e pedido entregue. São 21.381 mensagens enviadas no período (84.2% das enviadas no canal). que inflam o volume total sem representar trabalho de atendimento.", "<b>Ritmo necessário</b> = 540 minutos úteis do dia ÷ atendimentos que chegam por dia útil ao canal e exigem resposta humana. É o tempo máximo que o atendente pode gastar em cada caso para não virar o dia com fila. Mensagens automáticas não entram no cálculo.", "<b>A Shopee não gera tickets de pós-venda no Predize</b>: todo o atendimento do canal entra como protocolo de chat. Por isso a coluna de pós-venda aparece zerada para ela na tabela de canais.", "<b>Canal Via</b> não aparece nos gráficos por canal por representar fração mínima do volume de mensagens, mas está somado aos totais gerais e aparece na tabela de SLA de tickets.", "<b>Efeito da MIA</b> compara a média de retornos do cliente por ticket entre atendimentos que tiveram resposta da IA e os que não tiveram, considerando só tickets com histórico de mudança de status.", "<b>Atendimento, na seção de capacidade, é um ticket que recebeu pelo menos uma mensagem do cliente no mês</b> — não é mensagem nem conversa. Demanda, entrega e fila usam todos essa mesma unidade, para que as três se somem.", "<b>A reserva de 120 minutos por dia é um parâmetro, não uma medição.</b> Representa o tempo que cada atendente gasta fora da Predize com abertura de assistência técnica, e-mail, WhatsApp, reuniões e tarefas paralelas.             <li><b>Mediações e envios do Mercado Livre em ordem</b>: mediações caíram para 12 vendas (0,14%) e nenhuma das 91 vendas com o Envios saiu errada. O problema do canal está concentrado em um indicador só.</li>

      <li><b>Nível de serviço do Magalu em 94,0%</b>: parou de cair, mas segue abaixo da meta de 95% pela quinta leitura. É o único ponto em aberto do canal, e é prazo de entrega, não atendimento.</li>
      <li><b>Tempo de resposta é a pior dimensão do auditor de qualidade</b>: ${AUDIT.media.resposta}/100 na média ponderada, contra ${AUDIT.media.tom}/100 de tom de voz. A equipe escreve bem, mas demora.</li>
            <li><b>Causa raiz em produto</b>: defeito, avaria e peças faltando somam mais que atraso de entrega — assunto de embalagem e conferência, não de atendimento.</li></ul></div></div>`;

  h+=`<details class="met" style="margin-top:14px"><summary>Como atualizar estes números</summary>
    <ul class="ls"><li>Os dados ficam no bloco <b>RA</b>, no início do script, com dois períodos: <b>semestre</b> e <b>mes</b>.</li>
    <li>O <b>índice</b> é sempre calculado pelo Reclame Aqui sobre os últimos 6 meses; volume, notas e temas seguem o período selecionado.</li>

    <li><b>Índice de solução e "voltaria a comprar" estão defasados e fora da janela.</b> Seguem na ${RA.periodos.semestre.solucao_ref}, que ainda incluía março — mês que saiu do recorte. De lá para cá entraram 6 avaliações, das quais 2 são nota zero, então o valor real hoje deve estar <b>abaixo</b> dos ${RA.periodos.semestre.indice_solucao}% exibidos. Com o passivo zerado e o tempo de resposta no menor valor da série, <b>a resolução passou a ser a única alavanca que ainda pode mover o índice</b> — e é justamente a que não está sendo medida. Capturar a tela "Avaliações recebidas" é o item mais importante da próxima atualização.</li>
      <li><b>O painel do Magalu alterna entre dois formatos</b> — régua de faixas e metas com bases absolutas — e nesta leitura veio no segundo, com as bases: 2.897 pedidos entregues, 3.070 interações avaliadas e 41 cancelamentos. <b>A nota geral de 1 a 5 não aparece há cinco leituras e segue fixada em 4,3.</b> Como a agilidade subiu 3,3 pontos e o cancelamento caiu 0,2 no período sem a nota mudar, é provável que o 4,3 esteja defasado — capturar a régua é a informação mais útil a trazer do canal na próxima atualização.</li>

  return h;
}

/* ---------- abas ---------- */
function pintaTabs(){
  const t=[`<button class="tab ${atual==='geral'?'on':''}" data-k="geral"><i></i>Visão Geral</button>`,
    `<button class="tab ${atual==='rep'?'on':''}" data-k="rep"><i></i>Reputação <span class="bdg or">Diário</span></button>`,
    `<button class="tab ${atual==='ra'?'on':''}" data-k="ra"><i></i>Reclame Aqui <span class="bdg or">Regular</span></button>`];
  DATA.meses.forEach(m=>{
    const b = m.status==='fechado' ? '<span class="bdg gr">Fechado</span>'
            : m.status==='parcial' ? '<span class="bdg or">Parcial</span>'
            : '<span class="bdg gy">Aguardando</span>';
    t.push(`<button class="tab ${atual===m.key?'on':''} ${m.status==='fechado'&&atual!==m.key?'done':''}" data-k="${m.key}"><i></i>${m.nome} ${m.ano} ${b}</button>`);
  });
  el('tabs').innerHTML=t.join('');
  el('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{atual=b.dataset.k;pintaTabs();pintaTopo();render();window.scrollTo({top:0,behavior:'smooth'})});
}

function viewGeral(){
  const tot = comDados.reduce((a,m)=>{const k=m.dados.kpi;return{
    msgs:a.msgs+k.msgs, conv:a.conv+k.conversas, pos:a.pos+k.pos, rec:a.rec+k.reclam,
    pre:a.pre+k.pre, chat:a.chat+m.dados.chat.total, ab:a.ab+k.abertos, man:a.man+k.manual};},
    {msgs:0,conv:0,pos:0,rec:0,pre:0,chat:0,ab:0,man:0});
  const ult=comDados[comDados.length-1].dados;
  const kc=[
    {l:'Total de mensagens',v:NB(tot.msgs),g:'linear-gradient(90deg,#FF6B35,#F59E0B)',c:'#fff',s:'Todos os canais',gh:'💬',b:['b-nt',NB(tot.conv)+' conversas']},
    {l:'Protocolos de chat',v:NB(tot.chat),g:'linear-gradient(90deg,#3B82F6,#06B6D4)',c:'#fff',s:'Shopee e Magalu',gh:'🎧',b:['b-al',ult.chat.sla_hum_u+'% no SLA de 12h úteis']},
    {l:'Resposta mediana (útil)',v:ult.kpi.med_resp_u,g:'linear-gradient(90deg,#22C55E,#4ADE80)',c:'#4ADE80',s:'Dentro da escala 07h–17h',gh:'⏱',b:['b-ok',ult.kpi.p1h_u+'% em até 1h útil']},
    {l:'Tickets de pós-venda',v:NB(tot.pos),g:'linear-gradient(90deg,#A855F7,#EC4899)',c:'#fff',s:NB(tot.rec)+' reclamações formais',gh:'📦',b:['b-wr',NB(tot.ab)+' ainda em aberto']},
    {l:'Perguntas de pré-venda',v:NB(tot.pre),g:'linear-gradient(90deg,#EAB308,#FF6B35)',c:'#fff',s:'Em página de anúncio',gh:'🛒',b:['b-al',ult.pre.tipos.find(t=>t.t==='Agente Humano').sla+'% no SLA (humano)']},
    {l:'Respostas manuais',v:NB(tot.man),g:'linear-gradient(90deg,#06B6D4,#3B82F6)',c:'#fff',s:'Digitadas por atendente',gh:'✍️',b:['b-nt',ult.kpi.auto_pct+'% do total é automático']}
  ];
  if(ult.tempo_real){const E=ult.tempo_real.equipe;
    kc.push({l:'Tempo real por atendimento',v:String(E.por_atend).replace('.',',')+' min',
      g:'linear-gradient(90deg,#14B8A6,#22C55E)',c:'#5EEAD4',
      s:`Medido na plataforma · ${comDados[comDados.length-1].nome.toLowerCase()}`,gh:'⏱',
      b:[E.ocupacao>=70?'b-al':E.ocupacao>=45?'b-wr':'b-ok',E.ocupacao+'% da jornada ocupada']});}
  if(ult.capacidade_real){const C=ult.capacidade_real.equipe;
    kc.push({l:'Fila por dia útil',v:String(C.fila_dia).replace('.',','),
      g:'linear-gradient(90deg,#EF4444,#F97316)',c:'#F87171',
      s:`De ${String(C.demanda_dia).replace('.',',')} que chegam, ${String(C.entrega_dia).replace('.',',')} têm resposta humana`,gh:'📥',
      b:['b-al',String(C.fila_sem_nada_dia).replace('.',',')+' sem resposta nenhuma']});}
  let h = `<div class="slab">Indicadores acumulados <span class="hint">${comDados.length} mês(es) carregado(s)</span></div>`
        + `<div class="kgrid">${kc.map(cardKPI).join('')}</div>`
        + (ult.tempo_real?`<div class="note" style="margin-top:11px">${(()=>{const T=ult.tempo_real,E=T.equipe,
            o=[...T.atendentes].sort((a,b)=>a.por_atend-b.por_atend);
            return `<b>Tempo real por atendimento</b> é o tempo observado dentro da plataforma, não uma estimativa: respostas manuais separadas por até ${T.limiar} minutos contam como trabalho contínuo, e a soma desses blocos é dividida pelos atendimentos distintos. No último período a equipe gastou <b>${String(E.por_atend).replace('.',',')} minutos por atendimento</b> e ocupou <b>${E.ocupacao}% da jornada</b> — ${String(E.ativo_dia_h).replace('.',',')} das 9 horas úteis por pessoa. Individualmente vai de <b>${String(o[0].por_atend).replace('.',',')} min (${o[0].nome.split(' ')[0]})</b> a <b>${String(o[o.length-1].por_atend).replace('.',',')} min (${o[o.length-1].nome.split(' ')[0]})</b>, porque a fila de cada canal é diferente: chat resolve rápido, reclamação exige investigação. O detalhamento por atendente, com o teto de cada um, está na aba do mês.`;})()}</div>`:'')
        + (ult.capacidade_real?`<div class="note" style="margin-top:9px">${(()=>{const R=ult.capacidade_real,C=R.equipe,
            pior=[...R.atendentes].sort((a,b)=>b.fila_dia-a.fila_dia)[0];
            return `<b>A fila é o indicador que faltava.</b> Chegam <b>${String(C.demanda_dia).replace('.',',')} atendimentos por dia útil</b> e a equipe responde <b>${String(C.entrega_dia).replace('.',',')}</b> — ${String(C.cobertura).replace('.',',')}%. Dos ${String(C.fila_dia).replace('.',',')} que sobram, ${String(C.so_auto_dia).replace('.',',')} recebem só a resposta automática da Mia e <b>${String(C.fila_sem_nada_dia).replace('.',',')} não recebem nada</b> (${NB(C.sem_nada)} no mês). Descontando <b>${R.reserva} minutos por dia</b> para ${R.reserva_itens}, cabem ${String(C.capacidade).replace('.',',')} atendimentos por dia na equipe contra os ${String(C.demanda_dia).replace('.',',')} que chegam: <b>faltam ${String(C.deficit).replace('.',',')} por dia</b>. A maior fila é a de ${pior.nome.split(' ')[0]}, com ${FX(pior.fila_dia)} por dia. O detalhamento, com a repartição da jornada, está na aba do mês.`;})()}</div>`:'');

  h += `<div class="slab">Resumo por mês</div><div class="mgrid">`;
  DATA.meses.forEach((m,i)=>{
    if(!m.dados){h+=`<div class="mc empty"><div class="mn">${m.nome}</div><div class="mv">—</div>
      <div class="ms" style="color:#5E636D">Aguardando dados</div><div class="mf">Ainda não carregado</div></div>`;return;}
    const d=m.dados, c=MC[i%MC.length];
    const badge = d.chat.sla_hum_u>=50?'<span class="bdg2 b-ok">✅ '+d.chat.sla_hum_u+'% SLA chat</span>'
                 :'<span class="bdg2 b-al">⚠ '+d.chat.sla_hum_u+'% SLA chat</span>';
    h+=`<div class="mc" style="--c:${c}"><div class="mn">${m.nome} · ${m.status==='fechado'?'Fechado':'Parcial'}</div>
      <div class="mv">${NB(d.kpi.msgs)}</div><div class="ms">${NB(d.kpi.conversas)} conversas</div>
      ${badge}<div class="mf">Mediana útil ${d.kpi.med_resp_u} · ${d.kpi.dias_uteis} dias úteis</div></div>`;
  });
  h+=`</div>`;

  h += `<div class="slab">Comparativo mensal</div><div class="panel"><table>
    <thead><tr><th>Mês</th><th>Dias úteis</th><th>Mensagens</th><th>Conversas</th><th>Mediana útil</th><th>% até 1h útil</th><th>Protocolos</th><th>SLA chat útil</th><th>Tickets</th><th>Em aberto</th></tr></thead><tbody>`;
  comDados.forEach(m=>{const d=m.dados;
    h+=`<tr><td>${m.nome} ${m.ano}${m.status==='parcial'?' *':''}</td><td>${d.kpi.dias_uteis}</td><td>${NB(d.kpi.msgs)}</td><td>${NB(d.kpi.conversas)}</td>
    <td>${d.kpi.med_resp_u}</td><td>${d.kpi.p1h_u}%</td><td>${NB(d.chat.total)}</td><td>${d.chat.sla_hum_u}%</td>
    <td>${NB(d.kpi.pos)}</td><td>${NB(d.kpi.abertos)}</td></tr>`;});
  h+=`</tbody></table>${comDados.length===1?'<div class="note blue">Com um único mês carregado não há série histórica para comparar. Assim que agosto entrar, esta tabela mostra a variação mês a mês automaticamente.</div>':''}</div>`;

  const S=RA.periodos.semestre;
  h += `<div class="slab">Reputação externa <span class="hint">Reclame Aqui · últimos 6 meses</span></div>
    <div class="kgrid">`+[
      {l:'Índice Reclame Aqui',v:FX(RA.indice),g:'linear-gradient(90deg,#EAB308,#22C55E)',c:'#FACC15',
       s:`Faixa ${RA.faixa} · ${S.janela}`,gh:'😐',b:['b-nt','estável em '+FX(RA.indice)+' · '+FX(RA.paraRuim)+' até "Ruim"']},
      {l:'Reclamações no semestre',v:NB(S.total),g:'linear-gradient(90deg,#FF6B35,#F59E0B)',
       s:`${NB(S.respondidas)} respondidas · ${NB(S.nao_respondidas)} sem resposta`,gh:'📣',
       b:[S.nao_respondidas===0?'b-ok':'b-wr', S.nao_respondidas===0?'passivo zerado':NB(S.nao_respondidas)+' pendentes']},
      {l:'Tempo de resposta',v:S.tempo_resposta.split(' ')[0]+'d',g:'linear-gradient(90deg,#EF4444,#F97316)',c:'#F87171',
       s:`${S.tempo_resposta} · agosto sozinho: ${RA.periodos.mes.tempo_resposta}`,gh:'⏳',b:['b-ok','o menor da série']},
      {l:'Índice de solução',v:S.indice_solucao+'%',g:'linear-gradient(90deg,#EAB308,#22C55E)',c:'#FACC15',
       s:`leitura de 02/09 · ${S.avaliadas} avaliações na janela atual`,gh:'📊',b:['b-wr',S.voltaria+'% voltaria a comprar']}
    ].map(cardKPI).join('')+`</div>
    <div class="note" style="margin-top:11px"><b>O passivo foi zerado — ${S.nao_respondidas} reclamações sem resposta</b>, contra 17 há cinco dias —, a taxa de resposta subiu para ${S.pct_respondidas.toString().replace('.',',')}% e o tempo médio caiu para <b>${S.tempo_resposta}</b>, o menor da série. <b>E o índice não se moveu</b>: ${FX(RA.indice)} pela ${RA.leituras_estaveis}ª leitura, a ${FX(RA.paraRuim)} ponto de "Ruim". É a demonstração mais limpa de que <b>o índice mede resolução, não velocidade</b>: índice de solução em ${S.indice_solucao}%, ${S.voltaria}% de recompra e ${S.notas[0]} das ${S.avaliadas} avaliações em nota zero — ${Math.round(S.notas[0]/S.avaliadas*100)}%, a maior fatia já registrada. Setembro fechou em ${RAM('Set')} reclamações contra ${RAM('Ago')} em agosto, e outubro abriu com ${RAM('Out')} em cinco dias. Detalhamento na aba Reclame Aqui.</div>`;

  h += `<div class="slab">Qualidade do atendimento</div>
    <div class="panel"><p class="pt"><span class="tip">Auditor automático do Predize<span class="tipbox"><b>Como a nota é formada</b><br>A IA avalia cada mensagem em 5 critérios fixos, iguais para todos os sellers. Os <b>quatro primeiros</b> — empatia, tempo de resposta, clareza e tom de voz — julgam a mensagem de <b>quem atendeu</b>, seja humano ou a Mia. O <b>quinto, o CSAT</b>, é diferente: julga <b>como o comprador reagiu</b>, lendo as mensagens dele.<em>Passe o mouse sobre cada critério abaixo para ver o que ele mede.</em></span></span> <small>${AUDIT.periodo} · ${NB(AUDIT.total_tickets)} tickets avaliados</small></p>
      <div class="aud">${[...AUDIT.atendentes,{...AUDIT.ia,_ia:1}].map(a=>{
        const cor=v=>v>=75?'#22C55E':v>=60?'#EAB308':v>=45?'#F97316':'#EF4444';
        return `<div class="rc" style="--c:${a._ia?'#A855F7':cor(a.geral)}">
          <div class="rc-h"><h4>${a.nome.split(' ')[0]}${a._ia?' <span class="bdg2 b-nt" style="margin:0;font-size:9.5px">IA</span>':''}</h4>
            <span class="tip tr bdg2 ${a.geral>=60?'b-wr':'b-al'}" style="margin:0;border-bottom:0">${a.geral}/100<span class="tipbox" style="font-weight:400"><b>Nota geral</b><br>Média das cinco dimensões nas conversas fechadas do período, numa escala de 0 a 100. Cada mensagem do atendente é pontuada separadamente e depois consolidada por ticket.<em>Amostra: ${NB(a.tickets)} tickets avaliados em ${AUDIT.periodo}.</em></span></span>
            <span class="src">${a.canal} · ${NB(a.tickets)} tickets</span></div>
          ${AUDIT.dims.map(d=>`<div class="audrow"><span class="tip" style="color:#7C818C">${d.n}<span class="tipbox"><b>${d.n}</b><br>${d.d}${d.alerta?`<em>${d.alerta}</em>`:''}</span></span><b style="color:${cor(a[d.k])}">${a[d.k]}</b></div>
            <div class="audbar"><i style="width:${a[d.k]}%;background:${cor(a[d.k])}"></i></div>`).join('')}
        </div>`;}).join('')}</div>
      <div class="note"><b>O tempo de resposta é a pior dimensão dos três atendentes</b> — ${AUDIT.atendentes.map(a=>a.nome.split(' ')[0]+' '+a.resposta).join(', ')}, contra uma média ponderada de ${AUDIT.media.geral}/100 no geral. O tom de voz é a melhor (${AUDIT.media.tom}/100) e a clareza vem logo atrás (${AUDIT.media.clareza}/100): <b>a equipe escreve bem, mas demora</b>. É o mesmo diagnóstico que aparece no SLA dos marketplaces, agora medido dentro da conversa e não pelo relógio do canal.</div>
      <div class="note" style="margin-top:9px"><b>A Mia entra como referência, não como concorrente.</b> A IA pontua ${AUDIT.ia.geral}/100 contra ${AUDIT.media.geral} da equipe e ganha em todas as cinco dimensões, mas a diferença real está numa só: <b>tempo de resposta ${AUDIT.ia.resposta} contra ${AUDIT.media.resposta}</b>. Nas outras quatro o placar é apertado — empatia ${AUDIT.ia.empatia} a ${AUDIT.media.empatia}, clareza ${AUDIT.ia.clareza} a ${AUDIT.media.clareza}, tom ${AUDIT.ia.tom} a ${AUDIT.media.tom} e CSAT ${AUDIT.ia.csat} a ${AUDIT.media.csat}. Ou seja: <b>o que separa a IA da equipe é velocidade, não qualidade de escrita</b>. Ela também responde por ${NB(AUDIT.ia.tickets)} tickets avaliados, mais que os ${NB(AUDIT.total_tickets)} dos três humanos somados.</div>
      <div class="note" style="margin-top:9px">As amostras são muito desiguais: <b>${NB(AUDIT.atendentes[1].tickets)} tickets de ${AUDIT.atendentes[1].nome.split(' ')[0]} contra ${AUDIT.atendentes[0].tickets} e ${AUDIT.atendentes[2].tickets}</b> dos outros dois. As notas de ${AUDIT.atendentes[0].nome.split(' ')[0]} e ${AUDIT.atendentes[2].nome.split(' ')[0]} vêm de poucas conversas e oscilam muito com um caso isolado — use-as como indício, não como avaliação consolidada. ${AUDIT.excluidos.map(e=>e.nome.split(' ')[0]).join(' e ')} ficaram fora da análise: ${AUDIT.excluidos.map(e=>e.nome.split(' ')[0]+' ('+e.tickets+' tickets, '+e.motivo+')').join('; ')}.</div></div>`;

  h += `<div class="slab">Destaques do período</div><div class="g2">
    <div class="panel"><p class="pt">✅ O que está funcionando</p><ul class="ls">${ult.leitura.bom.map(x=>'<li>'+x+'</li>').join('')}</ul></div>
    <div class="panel"><p class="pt">⚠️ O que exige ação</p><ul class="ls">${ult.leitura.ruim.map(x=>'<li>'+x+'</li>').join('')}</ul></div></div>`;
  return h;
}
function cardKPI(k){
  return `<div class="kc" style="--g:${k.g};--c:${k.c||'#fff'}">
    <div class="lab">${k.l}</div><div class="val">${k.v}</div><div class="sub">${k.s}</div>
    ${k.b?`<span class="bdg2 ${k.b[0]}">${k.b[1]}</span>`:''}<div class="gh">${k.gh||''}</div></div>`;
}

/* ================= MÊS ================= */
function viewMes(m){
  if(!m.dados) return `<div class="empty-state fade"><div class="ei">📭</div>
    <h3>${m.nome} de ${m.ano} ainda não foi carregado</h3>
    <p>Assim que a exportação do Predize referente a ${m.nome.toLowerCase()} estiver pronta, substitua
    <code>"dados": null</code> pelo bloco do mês dentro de <code>DATA.meses</code>, no início do script deste arquivo.
    As abas, os totais e o resumo por mês se ajustam sozinhos.</p></div>`;
  const D=m.dados, K=D.kpi, C=D.chat;
  const kc=[
    {l:'Mensagens no mês',v:NB(K.msgs),g:'linear-gradient(90deg,#FF6B35,#F59E0B)',s:`${NB(K.recebidas)} recebidas · ${NB(K.enviadas)} enviadas`,gh:'💬',b:['b-nt',NB(K.conversas)+' conversas']},
    {l:'Resposta mediana (útil)',v:K.med_resp_u,g:'linear-gradient(90deg,#22C55E,#4ADE80)',c:'#4ADE80',s:`${K.med_resp} em tempo corrido`,gh:'⏱',b:['b-ok',K.p1h_u+'% em até 1h útil']},
    {l:'Protocolos de chat',v:NB(C.total),g:'linear-gradient(90deg,#3B82F6,#06B6D4)',s:'SLA de 12h úteis para o 1º contato',gh:'🎧',b:['b-al',C.sla_hum_u+'% no SLA útil']},
    {l:'Tickets de pós-venda',v:NB(K.pos),g:'linear-gradient(90deg,#A855F7,#EC4899)',s:`${NB(K.reclam)} reclamações formais`,gh:'📦',b:['b-wr',NB(K.abertos)+' em aberto']},
    {l:'Perguntas de pré-venda',v:NB(K.pre),g:'linear-gradient(90deg,#EAB308,#FF6B35)',s:'Na página do anúncio',gh:'🛒',b:['b-al',D.pre.tipos.find(t=>t.t==='Agente Humano').sla+'% no SLA (humano)']},
    {l:'Chegadas fora da escala',v:Math.round(K.rec_fora/K.recebidas*100)+'%',g:'linear-gradient(90deg,#A855F7,#EC4899)',s:`${NB(K.rec_fora)} mensagens fora de 07h–17h ou no fim de semana`,gh:'🌙',b:['b-nt',K.auto_pct+'% das respostas são automáticas']}
  ];
  let h = `<div class="slab">Visão do mês <span class="hint">${D.periodo.ini} a ${D.periodo.fim}</span></div>
           <div class="kgrid">${kc.map(cardKPI).join('')}</div>`;

  h += `<div class="slab">Canais</div>
    <div class="kgrid">`+
    D.canais.map(c=>`<div class="chc" style="--c:${CC[c.id]}"><h3>${c.nome}</h3>
      <div class="big">${NB(c.msgs)} <small>mensagens</small></div>
      <div class="kv"><span>Conversas</span><b>${NB(c.conversas)}</b></div>
      <div class="kv"><span>Resposta mediana (útil)</span><b>${c.med_u}</b></div>
      <div class="kv"><span>Pós-venda · reclamações</span><b>${NB(c.pos)} · ${NB(c.reclam)}</b></div></div>`).join('')+`</div>`;

  h += `<div class="slab">Ritmo do mês</div>
    <div class="panel"><p class="pt">Volume diário por canal <small>barras claras = fim de semana</small></p>
      <div id="c-dia"></div><div class="legend" id="l-dia"></div></div>
    <div class="panel" style="margin-top:14px"><p class="pt">Cobertura por hora <small>quem responde, e quando</small></p>
      <div id="c-hora"></div>
      <div class="legend">
        <span><i class="dot" style="background:#2E3138"></i> Recebidas do cliente</span>
        <span><i class="dot" style="background:rgba(255,107,53,.35)"></i> Escala 07h–11h e 12h–17h</span>
        <span><i class="dot" style="background:#FF6B35"></i> Resposta manual</span>
        <span><i class="dot" style="background:#06B6D4"></i> Resposta automática / IA</span></div>
      <div class="note" id="n-hora"></div></div>`;

  const entrou=D.atendentes.find(a=>a.inicio==='13/07');
  h += `<div class="slab">Equipe <span class="hint">${entrou?`Sara Juste iniciou em ${entrou.inicio} — indicadores dela cobrem ${entrou.dias_corridos} dias`:`Três atendentes ativos no período · ${D.periodo.ini} a ${D.periodo.fim}`}</span></div>
    <div class="g3">`+D.atendentes.map(a=>`
      <div class="at"><div class="top"><div class="av" style="background:${AVC[a.nome]}">${a.nome.split(' ').map(x=>x[0]).join('')}</div>
      <div><h3>${a.nome}</h3><div class="role">${a.canal} · ${a.canal_pct}% do trabalho</div></div></div>
      <span class="bdg2 ${a.inicio==='13/07'?'b-wr':'b-nt'}">${a.inicio==='13/07'?'Entrou em 13/07 · '+a.dias_corridos+' dias':(m.status==='parcial'?'Parcial · '+a.dias_corridos+' dias':'Mês completo · '+a.dias_corridos+' dias')}</span>
      <div class="mini">
        <div><div class="l">Mensagens</div><div class="v">${NB(a.msgs)}</div></div>
        <div><div class="l">Média/dia ativo</div><div class="v">${a.msg_dia}</div></div>
        <div><div class="l">Mediana útil</div><div class="v" style="font-size:16px">${a.med_u}</div></div>
        <div><div class="l">Dias ativos</div><div class="v">${a.dias_ativos}</div></div></div>
      <div style="margin-top:13px">
        <div class="kv"><span>Pós-venda · fechados</span><b>${a.pos?NB(a.pos)+' · '+a.fech_pct+'%':'—'}</b></div>
        <div class="kv"><span>Protocolos de chat</span><b>${NB((C.atendentes.find(x=>x.nome===a.nome)||{n:0}).n)}</b></div>
        <div class="kv"><span>Pré-venda · no SLA</span><b>${a.pre?NB(a.pre)+' · '+a.pre_sla+'%':'—'}</b></div>
        <div class="kv"><span>Respostas em até 1h útil</span><b>${a.p1h_u}%</b></div></div></div>`).join('')+`</div>`;

  const CG=D.carga;   // mantido: usado pela observação de composição da fila na seção de tempo real

  if(D.producao){const PR=D.producao, PE=PR.equipe;
    const mMax=Math.max(...PR.atendentes.map(a=>a.msgs));
    h += `<div class="slab">Produção de cada atendente <span class="hint">só o que foi digitado por uma pessoa · a Mia e as automáticas ficam de fora</span></div>
    <div class="panel"><p class="pt"><span class="tip">Mensagens e atendimentos no mês<span class="tipbox"><b>O que entra nesta conta</b><br>Somente as mensagens com origem <b>MANUAL</b> — digitadas por um atendente dentro da plataforma. Ficam de fora as da <b>Mia</b>, a mensageria automática do marketplace e os avisos de ausência.<br><b>Atendimento</b> aqui é um ticket distinto que a pessoa respondeu: se ela enviou 5 mensagens no mesmo caso, conta 1.<em>Das ${NB(PE.enviadas_total)} mensagens enviadas no mês, ${NB(PE.msgs)} (${String(PE.pct_humano).replace('.',',')}%) saíram de uma pessoa.</em></span></span> <small>${PR.dias_uteis} dias úteis · ${NB(PE.msgs)} mensagens e ${NB(PE.atend)} atendimentos no total</small></p>
      <div class="trg">${PR.atendentes.map(a=>`<div class="trc" style="--c:${AVC[a.nome]}">
          <h4><span class="dot" style="background:${AVC[a.nome]}"></span>${a.nome.split(' ')[0]}
            <span style="margin-left:auto;font-weight:600;font-size:11px;color:#7C818C">${a.dias_ativos} dias ativos</span></h4>
          <div class="cap2">Mensagens digitadas</div>
          <div class="big">${NB(a.msgs)}</div>
          <div class="trbar"><i style="width:${a.msgs/mMax*100}%;background:${AVC[a.nome]};opacity:.75"></i>
            <span>${FX(a.msgs_dia)}/dia útil</span></div>
          <div class="trrow"><span>Atendimentos respondidos</span><b>${NB(a.atend)}</b></div>
          <div class="trrow"><span>Atendimentos por dia útil</span><b style="color:#4ADE80">${FX(a.atend_dia)}</b></div>
          <div class="trrow"><span>Mensagens por atendimento</span><b>${FX(a.msgs_por_atend)}</b></div>
          ${a.tipos.map(t=>`<div class="trrow"><span style="color:#5E636D">${t.nome}</span><b style="font-weight:600;color:#9aa0aa">${NB(t.atend)} atend. · ${NB(t.msgs)} msg</b></div>`).join('')}
        </div>`).join('')}</div>
      <table style="margin-top:13px"><thead><tr><th>Atendente</th><th>Canais</th><th>Mensagens<br>digitadas</th><th>Atendimentos<br>respondidos</th><th>Msg por<br>atendimento</th><th>Mensagens<br>por dia útil</th><th>Atendimentos<br>por dia útil</th></tr></thead><tbody>
      ${PR.atendentes.map(a=>`<tr><td><span class="dot" style="background:${AVC[a.nome]};margin-right:8px"></span>${a.nome}</td>
        <td style="color:#7C818C">${a.canais.map(c=>c.nome+' ('+NB(c.atend)+')').join(' · ')}</td>
        <td><b>${NB(a.msgs)}</b></td><td><b style="color:#4ADE80">${NB(a.atend)}</b></td>
        <td>${FX(a.msgs_por_atend)}</td>
        <td>${FX(a.msgs_dia)}</td><td>${FX(a.atend_dia)}</td></tr>`).join('')}
      <tr class="tot"><td>Equipe</td><td style="color:#7C818C">3 pessoas</td>
        <td><b>${NB(PE.msgs)}</b></td><td><b style="color:#4ADE80">${NB(PE.atend)}</b></td>
        <td>${FX(PE.msgs_por_atend)}</td>
        <td>${FX(PE.msgs_dia)}</td><td>${FX(PE.atend_dia)}</td></tr></tbody></table>
      <div class="note"><b>Trabalho de pessoa é uma fatia pequena do volume total.</b> Das <b>${NB(PE.enviadas_total)} mensagens enviadas</b> no mês, apenas <b>${NB(PE.msgs)} (${String(PE.pct_humano).replace('.',',')}%)</b> foram digitadas por um atendente. A Mia respondeu ${NB(PE.mia)} e a mensageria automática do marketplace, ${NB(PE.outros_auto)}. É por isso que o total de mensagens do mês não serve para medir esforço da equipe: <b>os ${NB(PE.msgs)} desta seção servem</b>.</div>
      <div class="note" style="margin-top:9px">${(()=>{const o=[...PR.atendentes].sort((x,y)=>y.atend-x.atend), a1=o[0], a3=o[o.length-1];
        return `<b>${a1.nome.split(' ')[0]} respondeu ${NB(a1.atend)} atendimentos</b> contra ${NB(a3.atend)} de ${a3.nome.split(' ')[0]} — ${(a1.atend/a3.atend).toFixed(1).replace('.',',')} vezes mais. <b>Isso não é diferença de produtividade</b>, é diferença de fila: ${a1.nome.split(' ')[0]} gasta ${String(a1.msgs_por_atend).replace('.',',')} mensagens por caso e ${a3.nome.split(' ')[0]} gasta ${String(a3.msgs_por_atend).replace('.',',')}, porque chat da Shopee resolve numa resposta e reclamação de pós-venda exige investigação e idas e voltas. Comparar os dois pelo número bruto de atendimentos leva à conclusão errada.`;})()}</div></div>`;

        <tbody>${T.sla_tipo.filter(x=>x.n>=5).map(c=>`<tr><td>${c.t}</td><td>${NB(c.n)}</td><td>${NB(c.ok)}</td>
          <td style="color:${c.pct>=70?'#4ADE80':c.pct>=50?'#FACC15':'#F87171'};font-weight:700">${c.pct}%</td></tr>`).join('')}</tbody></table>
        <div class="note">O <b>Magalu cumpre ${T.sla_canal.find(c=>c.id==='magalu')?.pct}% do SLA</b> contra ${T.sla_canal.find(c=>c.id==='mercadolivre')?.pct}% do Mercado Livre. Por tipo, o gargalo é a <b>pré-venda (${T.sla_tipo.find(x=>x.t==='Pré-venda')?.pct}%)</b> — a mesma conclusão que aparece na seção de pré-venda, agora confirmada pelo prazo do próprio marketplace.</div></div>
      <div class="panel"><p class="pt">Situação dos tickets e principais motivos</p>
        <div id="t-status"></div>
        <table style="margin-top:14px"><thead><tr><th>Motivo do atendimento</th><th>Tickets</th><th>%</th></tr></thead>
        <tbody>${T.motivos.slice(0,6).map(m=>`<tr><td>${m.m.length>44?m.m.slice(0,42)+'…':m.m}</td><td>${NB(m.n)}</td><td>${m.pct}%</td></tr>`).join('')}</tbody></table>
        <div class="note">Motivo informado em ${NB(T.motivos_total)} dos ${NB(T.total)} tickets. <b>Dúvidas sobre entrega ou pedido atrasado lideram com ${T.motivos[0].pct}%</b> — o mesmo eixo logístico que aparece nas reclamações do Reclame Aqui.</div></div></div>`;

  h += `<div class="panel" style="margin-top:14px"><p class="pt">Ciclo de vida do atendimento <small>${NB(T.hist.total)} mudanças de status em ${NB(T.hist.tickets)} tickets</small></p>
      <div id="t-hist"></div>
      <div class="note">Cada ticket passa por <b>${T.hist.por_ticket} mudanças de status</b> em média. Foram ${NB(T.hist.respostas)} respostas da equipe e ${NB(T.hist.retornos)} retornos do cliente — a mediana é de <b>${T.hist.pingpong_med} trocas por ticket</b>, mas ${NB(T.hist.muitos)} deles (${T.hist.muitos_pct}%) passaram de 10 idas e voltas, chegando ao extremo de ${T.hist.pingpong_max}. Esses casos longos são os que consomem o tempo do atendente e costumam terminar em mediação ou reclamação pública. As reaberturas são raras (${T.hist.reaberturas}), então o problema não é fechar cedo demais: é a conversa que não conclui.</div></div>`;
  }

  h += `<div class="slab">Pós-venda</div><div class="g2">
    <div class="panel"><p class="pt">Situação dos tickets no fechamento do mês</p><div id="c-status"></div><div class="legend" id="l-status"></div></div>
    <div class="panel"><p class="pt">Motivos das reclamações <small>top 6</small></p><div id="c-motivo"></div></div></div>`;

  h += `<div class="slab">Pré-venda</div><div class="g2">
    <div class="panel"><p class="pt">Agente virtual × agente humano</p>
      <table><thead><tr><th>Tipo</th><th>Perguntas</th><th>Resposta mediana</th><th>No SLA</th><th>Gerou venda</th></tr></thead>
      <tbody>${D.pre.tipos.map(t=>`<tr><td>${t.t}</td><td>${t.n}</td><td>${t.med}</td><td>${t.sla}%</td><td>${t.venda}%</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td>${D.pre.total}</td><td>—</td><td>${D.pre.sla}%</td><td>${D.pre.venda}%</td></tr></tbody></table>
      <div class="note green">O agente virtual responde em <b>${D.pre.tipos.find(t=>t.t==='Agente Virtual').med}</b> e converte <b>${D.pre.tipos.find(t=>t.t==='Agente Virtual').venda}%</b>; o humano leva ${D.pre.tipos.find(t=>t.t==='Agente Humano').med} e converte ${D.pre.tipos.find(t=>t.t==='Agente Humano').venda}%. ${D.pre.sem_resposta} perguntas ficaram sem resposta.</div></div>
    <div class="panel"><p class="pt">Pré-venda por atendente</p>
      <table><thead><tr><th>Atendente</th><th>Perguntas</th><th>Resposta mediana</th><th>No SLA</th></tr></thead>
      <tbody>${D.atendentes.map(a=>`<tr><td><span class="dot" style="background:${AVC[a.nome]};margin-right:8px"></span>${a.nome}</td><td>${a.pre}</td><td>${a.pre_med}</td><td>${a.pre_sla}%</td></tr>`).join('')}
      <tr><td>Virtual / sem atendente</td><td>${D.sem_atendente.pre}</td><td>—</td><td>—</td></tr></tbody></table>
      <div class="note">Além destas ${D.pre.total} perguntas de anúncio, o chat trouxe outras <b>${NB(C.contexto.find(c=>c.c==='Pré-Venda').n)} conversas de pré-venda</b>, das quais ${C.contexto.find(c=>c.c==='Pré-Venda').hum}% chegaram a um atendente.</div></div></div>`;

  h += `<div class="slab">Leitura do mês</div><div class="g2">
    <div class="panel"><p class="pt">✅ O que está funcionando</p><ul class="ls">${D.leitura.bom.map(x=>'<li>'+x+'</li>').join('')}</ul></div>
    <div class="panel"><p class="pt">⚠️ O que exige ação</p><ul class="ls">${D.leitura.ruim.map(x=>'<li>'+x+'</li>').join('')}</ul></div></div>`;

  h += `<div class="slab">Notas</div><details class="met"><summary>Como ler estes números · critérios de cálculo</summary>
    <ul class="ls">${D.metodo.map(x=>'<li>'+x+'</li>').join('')}</ul></details>`;
  return h;
}

/* ---------- gráficos ---------- */
function graficos(D){
  const C=D.chat, K=D.kpi;
  /* dia */
  (function(){
    const S=D.serie,W=1000,H=225,p={l:40,r:10,t:12,b:28};
    const iw=W-p.l-p.r, ih=H-p.t-p.b, bw=iw/S.length, max=Math.max(...S.map(d=>d.total));
    const y=v=>p.t+ih-(v/max)*ih, s=svg(W,H);
    for(let i=0;i<=4;i++){const v=max*i/4;
      s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:y(v),y2:y(v),stroke:'#212329'}));
      s.appendChild(tx(p.l-8,y(v)+3.5,NB(Math.round(v)),{anchor:'end',size:9.5}));}
    const ord=['shopee','mercadolivre','magalu','madeira'];
    S.forEach((d,i)=>{const x=p.l+i*bw+bw*.16,w=bw*.68;let acc=0;const wk=d.dow>=5;
      ord.forEach(k=>{const v=d[k]||0;if(!v)return;const hh=(v/max)*ih;
        s.appendChild(mk('rect',{x,y:p.t+ih-acc-hh,width:w,height:hh,fill:CC[k],opacity:wk?.32:.95}));acc+=hh;});
      if(d.d%2===1)s.appendChild(tx(x+w/2,H-p.b+17,String(d.d).padStart(2,'0'),{size:9.5,fill:wk?'#4A4E57':'#7C818C'}));});

    el('l-dia').innerHTML=ord.map(k=>{const c=D.canais.find(c=>c.id===k);
      return c?`<span><i class="dot" style="background:${CC[k]}"></i>${c.nome} · ${NB(c.msgs)}</span>`:''}).filter(Boolean).join('');
  })();
  /* hora */
  (function(){
    const S=D.horas,W=1000,H=235,p={l:38,r:10,t:14,b:28};
    const iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/24,max=Math.max(...S.map(d=>Math.max(d.rec,d.man+d.bot)));
    const y=v=>p.t+ih-(v/max)*ih,s=svg(W,H);
    [[7,11],[12,17]].forEach(([a,b])=>{
      s.appendChild(mk('rect',{x:p.l+a*bw,y:p.t-6,width:(b-a)*bw,height:ih+6,fill:'rgba(255,107,53,.07)',rx:6}));});
    s.appendChild(tx(p.l+9*bw,p.t+7,'ESCALA 07h–11h',{fill:'rgba(255,138,91,.85)',size:9,weight:700}));
    s.appendChild(tx(p.l+14.5*bw,p.t+7,'ESCALA 12h–17h',{fill:'rgba(255,138,91,.85)',size:9,weight:700}));
    s.appendChild(tx(p.l+11.5*bw,p.t+7,'almoço',{fill:'#5E636D',size:8.5}));
    for(let i=0;i<=4;i++){const v=max*i/4;
      s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:y(v),y2:y(v),stroke:'#212329'}));
      s.appendChild(tx(p.l-8,y(v)+3.5,NB(Math.round(v)),{anchor:'end',size:9.5}));}
    S.forEach(d=>{const x=p.l+d.h*bw,g=bw*.40,w=bw*.30;
      s.appendChild(mk('rect',{x:x+bw*.14,y:y(d.rec),width:w,height:Math.max(1,ih-(y(d.rec)-p.t)),fill:'#2E3138',rx:2}));
      const hb=ih-(y(d.bot)-p.t),hh=ih-(y(d.man)-p.t);
      s.appendChild(mk('rect',{x:x+bw*.14+g,y:y(d.bot),width:w,height:Math.max(1,hb),fill:'#06B6D4',rx:2,opacity:.9}));
      s.appendChild(mk('rect',{x:x+bw*.14+g,y:y(d.bot)-hh,width:w,height:Math.max(0,hh),fill:'#FF6B35',rx:2}));
      if(d.h%2===0)s.appendChild(tx(x+bw/2,H-p.b+17,String(d.h).padStart(2,'0')+'h',{size:9.5}));});
    el('c-hora').appendChild(s);
    const nt=S.filter(d=>d.h<7||d.h>=17||d.h===11),rn=nt.reduce((a,b)=>a+b.rec,0),mn=nt.reduce((a,b)=>a+b.man,0);
    el('n-hora').innerHTML=`Considerando a escala de <b>07h–11h e 12h–17h, de segunda a sexta</b>, <b>${NB(K.rec_fora)} mensagens (${Math.round(K.rec_fora/K.recebidas*100)}%) chegam fora do expediente</b> — noites, intervalo de almoço e fins de semana. Nesses períodos quem responde é a automação: apenas ${NB(K.man_fora)} respostas manuais aconteceram fora da escala. O pico de demanda humana é entre 09h e 11h, no fim do primeiro bloco.`;
  })();
  /* funil */
  (function(){
    const st=[{l:'Protocolos abertos no mês',n:C.total,c:'#3B82F6'},
      {l:'Receberam a 1ª resposta (automática)',n:C.total-C.sem_1a,c:'#06B6D4'},
      {l:'Tiveram um atendente humano',n:C.com_humano,c:'#FF6B35'},
      {l:'Atendidos dentro de 12h úteis',n:C.buckets[0].n,c:'#EF4444'},

      if(i<st.length-1)s.appendChild(tx(bx+4,y+45,'↓ '+NB(d.n-st[i+1].n)+' não avançam',{anchor:'start',size:10}));});
    el('c-funil').appendChild(s);
    el('n-funil').innerHTML=`A automação cobre a abertura (${C.sla_any}% no prazo, ${C.t1_med} de mediana). O gargalo é o passo seguinte: <b>${NB(C.sem_humano)} conversas (${C.sem_humano_pct}%) nunca chegaram a um atendente</b>. Entre as que chegaram, a mediana é de ${C.t1h_med_u} de trabalho (${C.t1h_med} corridos) e <b>${C.sla_hum_u}% ficaram dentro das 12h úteis</b> — pelo relógio corrido seriam ${C.sla_hum}%. Os ${NB(C.fechados)} encerramentos formais refletem falta de registro de baixa, não taxa de resolução.`;
  })();
  /* buckets */
  (function(){
    const B=C.buckets,W=1000,rh=36,H=B.length*rh+6,cols=['#22C55E','#EAB308','#FF6B35','#EF4444','#2E3138'];
    const mx=Math.max(...B.map(b=>b.n)),bx=240,s=svg(W,H);
    B.forEach((b,i)=>{const y=i*rh+8,w=(b.n/mx)*(W-bx-130);
      s.appendChild(tx(0,y+18,b.b,{anchor:'start',size:12.5,fill:'#B7BBC4'}));

      s.appendChild(tx(bx+w+12,y+19,NB(b.n)+'  ·  '+b.pct+'%',{anchor:'start',size:11.5}));});
    el('c-bucket').appendChild(s);
  })();
  /* tickets: status + histórico */
  if(D.tickets){
    const T=D.tickets;
    (function(){
      const S=T.status,tot=S.reduce((a,b)=>a+b.n,0);
      const cols={'Mensageria automática':'#2E3138','Fechado':'#22C55E','Aguardando cliente':'#EAB308',
        'Bloqueado':'#7C818C','Aguardando atendente':'#EF4444','Deletado':'#4A4E57','Aberto':'#3B82F6'};
      const W=1000,rh=30,H=S.length*rh+10,mx=Math.max(...S.map(x=>x.n)),bx=210,s=svg(W,H);
      S.forEach((d,i)=>{const y=i*rh+8,w=(d.n/mx)*(W-bx-130);
        s.appendChild(tx(0,y+15,d.s,{anchor:'start',size:12,fill:'#B7BBC4'}));
        s.appendChild(mk('rect',{x:bx,y:y+3,width:Math.max(2,w),height:16,fill:cols[d.s]||'#3B82F6',rx:3,opacity:.88}));
        s.appendChild(tx(bx+w+10,y+16,NB(d.n)+'  ·  '+(d.n/tot*100).toFixed(1)+'%',{anchor:'start',size:11}));});
      el('t-status').appendChild(s);
    })();
    (function(){
      const TR=T.hist.transicoes,W=1000,rh=32,H=TR.length*rh+10,mx=Math.max(...TR.map(x=>x.n)),bx=330,s=svg(W,H);
      TR.forEach((d,i)=>{const y=i*rh+8,w=(d.n/mx)*(W-bx-120);
        const cor=d.t.includes('-> Fechado')?'#22C55E':d.t.startsWith('Aguardando Cliente')?'#EAB308':
                  d.t.includes('Bloqueado')?'#7C818C':'#FF6B35';
        s.appendChild(tx(0,y+16,d.t,{anchor:'start',size:11.5,fill:'#B7BBC4'}));
        s.appendChild(mk('rect',{x:bx,y:y+4,width:Math.max(2,w),height:16,fill:cor,rx:3,opacity:.85}));
        s.appendChild(tx(bx+w+10,y+17,NB(d.n),{anchor:'start',size:11}));});
      el('t-hist').appendChild(s);
    })();
  }
  /* status */
  (function(){
    const S=D.status,tot=S.reduce((a,b)=>a+b.n,0);
    const cols={'MENSAGERIA AUTOMATICA':'#2E3138','FECHADO':'#22C55E','AGUARDANDO CLIENTE OU MARKETPLACE':'#EAB308','BLOQUEADO':'#7C818C','AGUARDANDO ATENDENTE':'#EF4444','NOVO':'#3B82F6'};
    const lbl={'MENSAGERIA AUTOMATICA':'Mensageria automática','FECHADO':'Fechado','AGUARDANDO CLIENTE OU MARKETPLACE':'Aguardando cliente/marketplace','BLOQUEADO':'Bloqueado','AGUARDANDO ATENDENTE':'Aguardando atendente','NOVO':'Novo'};
    const W=1000,H=205,s=svg(W,H);let x=8;const iw=W-16;
    S.forEach(d=>{const w=(d.n/tot)*iw;
      s.appendChild(mk('rect',{x,y:8,width:Math.max(1,w-3),height:42,fill:cols[d.s],rx:5}));

      x+=w;});

    s.appendChild(tx(8,y0-14,'TICKETS POR RESPONSÁVEL',{anchor:'start',size:10,weight:700}));

    const mx=Math.max(...rows.map(r=>r.t));
    rows.forEach((r,i)=>{const y=y0+i*27,w=(r.t/mx)*(iw-330);
      s.appendChild(tx(8,y+11,r.n,{anchor:'start',size:11.5,fill:'#B7BBC4'}));

    el('c-status').appendChild(s);
    el('l-status').innerHTML=S.map(d=>`<span><i class="dot" style="background:${cols[d.s]}"></i>${lbl[d.s]} · ${NB(d.n)}</span>`).join('');
  })();
  /* motivos */
  (function(){
    const M=D.motivos.slice(0,6),W=1000,rh=32,H=M.length*rh+10,mx=Math.max(...M.map(m=>m.n)),bx=420,s=svg(W,H);

  })();
}

/* ---------- gráficos do Reclame Aqui ---------- */

      if(v)s.appendChild(mk('rect',{x:x+bw*.2,y:y(v),width:bw*.6,height:ih-(y(v)-p.t),fill:hh>=7&&hh<18?'#EF4444':'#7C3AED',rx:3,opacity:.9}));
      if(hh%2===0)s.appendChild(tx(x+bw/2,H-p.b+16,String(hh).padStart(2,'0'),{size:9.5}));}
