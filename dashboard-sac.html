          <th>Sem resposta<br>às 17h</th><th>Variação<br>do dia</th></tr></thead><tbody>
        ${FD.map(d=>linha(d.rot,DOW[d.dow],d.canal[c.id],d.maduro)).join('')}
        <tr class="tot"><td>Média por dia útil</td>
          <td><b>${NB(Math.round(c.med_p7))}</b></td>
          <td style="color:#FACC15"><b>${FX(ENT)}</b></td>
          <td style="width:132px"><div class="cbar" style="width:${Math.max(8,ENT/Math.max(...FD.map(d=>d.canal[c.id].ent))*100)}%"><i style="width:${Q.atendente/ENT*100}%;background:#22C55E"></i><i style="width:${Q.ia/ENT*100}%;background:#38BDF8"></i><i style="width:${(Q.fora+Q.outro+Q.fila)/ENT*100}%;background:#3F444C"></i></div></td>
          <td style="color:#4ADE80"><b>${FX(Q.atendente)}</b></td>
          <td style="color:#38BDF8"><b>${FX(Q.ia)}</b></td>
          <td style="color:#7C818C">${FX(Q.fora)}</td>
          <td style="color:#F87171">${FX(Q.outro)}</td>
          <td style="color:#7C818C">${FX(Q.fila)}</td>
          <td><b style="color:#4ADE80">${NB(Math.round(c.med_p17))}</b></td>
          <td style="color:#4ADE80;font-weight:700">−${NB(Math.abs(Math.round(c.med_p17-c.med_p7)))}</td></tr>
        </tbody></table></div>`;}).join('');
    h += `<div class="panel" style="margin-top:14px">
      <div class="alertbox" data-rot="Como se lê"><span class="oi">!</span><span><b>Como ler cada quadro.</b> <b>Pendentes às 07h</b> é o que o canal já tinha em "Aguardando Atendente" na abertura; <b>entraram na fila</b> é o que caiu nela ao longo do dia. As cinco colunas seguintes dizem o destino <b>dessas entradas</b>: resposta do <b>atendente</b>, da <b>Mia</b>, dada <b>por fora</b> (direto no marketplace), saída <b>sem resposta</b> (fechamento ou bloqueio) e o que <b>ainda estava na fila</b> no corte da exportação. <b>Sem resposta às 17h</b> é o estoque no fechamento da jornada, e a variação compara com as 07h.</span></div>
      <div class="alertbox rd" data-rot="Alerta"><span class="oi">!</span><span><b>Os últimos ${FD.length-FL.dias_maduros} dias ainda não fecharam.</b> A exportação foi tirada na manhã de 22/10, então parte do que entrou em ${FD.slice(FL.dias_maduros).map(d=>d.rot).join(', ')} seguia na fila no corte — ${NB(FD.slice(FL.dias_maduros).reduce((t,d)=>t+d.q_fila,0))} tickets. Como a Mia responde em minutos e uma pessoa leva horas, isso derruba a coluna do atendente nesses dias. As linhas aparecem esmaecidas e <b>a média usa só os ${FL.dias_maduros} dias já resolvidos</b>, até ${FL.ult_maduro}.</span></div>
      <div class="alertbox" data-rot="Atenção"><span class="oi">!</span><span><b>Os três canais somam o quadro geral.</b> A fila do atendente nesta seção cobre apenas ${FL.canais_incluidos.join(', ')} — Madeira Madeira e Via tiveram menos de uma dezena de passagens pela fila no período inteiro e ficaram de fora. ${(()=>{const o=[...CN].sort((a,b)=>(b.med_q_mad||b.med_q).ia/(b.med_ent_mad||b.med_ent)-(a.med_q_mad||a.med_q).ia/(a.med_ent_mad||a.med_ent))[0];
        return `A dependência da automação é bem diferente entre eles: ${CN.map(x=>{const q=x.med_q_mad||x.med_q;return x.nome+' com '+Math.round(q.ia/(q.ia+q.atendente)*100)+'% de Mia';}).join(', ')}.`;})()}</span></div></div>`;
  }


  const entrou=D.atendentes.find(a=>a.inicio==='13/07');

  const CG=D.carga;   // mantido: usado pela observação de composição da fila na seção de tempo real

  if(D.producao){const PR=D.producao, PE=PR.equipe;
    const mMax=Math.max(...PR.atendentes.map(a=>a.msgs));
    h += `<div class="slab">Produção de cada atendente <span class="hint">só o que foi digitado por uma pessoa · a Mia e as automáticas ficam de fora</span></div>

      <div class="trg">${PR.atendentes.map(a=>`<div class="trc" style="--c:${AVC[a.nome]}">
          <h4><span class="dot" style="background:${AVC[a.nome]}"></span>${a.nome.split(' ')[0]}
            <span style="margin-left:auto;font-weight:600;font-size:11px;color:#7C818C">${a.dias_ativos} dias ativos</span></h4>
          <div class="cap2">Mensagens digitadas</div>
          <div class="big">${NB(a.msgs)}</div>
          <div class="trbar"><i style="width:${a.msgs/mMax*100}%;background:${AVC[a.nome]};opacity:.75"></i>
            <span>${FX(a.msgs_dia)}/dia útil</span></div>
          <div class="trrow"><span>Atendimentos respondidos</span><b>${NB(a.atend)}</b></div>
          <div class="trrow"><span>Atendimentos por dia útil</span><b style="color:#4ADE80">${FX(a.atend_dia)}</b></div>
          <div class="trrow"><span>Mensagens por atendimento</span><b>${FX(a.msgs_por_atend)}</b></div>
          ${a.tipos.map(t=>`<div class="trrow"><span style="color:#5E636D">${t.nome}</span><b style="font-weight:600;color:#9aa0aa">${NB(t.atend)} atend. · ${NB(t.msgs)} msg</b></div>`).join('')}
        </div>`).join('')}</div>
      <table style="margin-top:13px"><thead><tr><th>Atendente</th><th>Canais</th><th>Mensagens<br>digitadas</th><th>Atendimentos<br>respondidos</th><th>Msg por<br>atendimento</th><th>Mensagens<br>por dia útil</th><th>Atendimentos<br>por dia útil</th></tr></thead><tbody>
      ${PR.atendentes.map(a=>`<tr><td><span class="dot" style="background:${AVC[a.nome]};margin-right:8px"></span>${a.nome}</td>
        <td style="color:#7C818C">${a.canais.map(c=>c.nome+' ('+NB(c.atend)+')').join(' · ')}</td>
        <td><b>${NB(a.msgs)}</b></td><td><b style="color:#4ADE80">${NB(a.atend)}</b></td>
        <td>${FX(a.msgs_por_atend)}</td>
        <td>${FX(a.msgs_dia)}</td><td>${FX(a.atend_dia)}</td></tr>`).join('')}
      <tr class="tot"><td>Equipe</td><td style="color:#7C818C">3 pessoas</td>
        <td><b>${NB(PE.msgs)}</b></td><td><b style="color:#4ADE80">${NB(PE.atend)}</b></td>
        <td>${FX(PE.msgs_por_atend)}</td>
        <td>${FX(PE.msgs_dia)}</td><td>${FX(PE.atend_dia)}</td></tr></tbody></table>
      <div class="note"><b>Trabalho de pessoa é uma fatia pequena do volume total.</b> Das <b>${NB(PE.enviadas_total)} mensagens enviadas</b> no mês, apenas <b>${NB(PE.msgs)} (${String(PE.pct_humano).replace('.',',')}%)</b> foram digitadas por um atendente. A Mia respondeu ${NB(PE.mia)} e a mensageria automática do marketplace, ${NB(PE.outros_auto)}. É por isso que o total de mensagens do mês não serve para medir esforço da equipe: <b>os ${NB(PE.msgs)} desta seção servem</b>.</div>
      <div class="note" style="margin-top:9px">${(()=>{const o=[...PR.atendentes].sort((x,y)=>y.atend-x.atend), a1=o[0], a3=o[o.length-1];
        return `<b>${a1.nome.split(' ')[0]} respondeu ${NB(a1.atend)} atendimentos</b> contra ${NB(a3.atend)} de ${a3.nome.split(' ')[0]} — ${(a1.atend/a3.atend).toFixed(1).replace('.',',')} vezes mais. <b>Isso não é diferença de produtividade</b>, é diferença de fila: ${a1.nome.split(' ')[0]} gasta ${String(a1.msgs_por_atend).replace('.',',')} mensagens por caso e ${a3.nome.split(' ')[0]} gasta ${String(a3.msgs_por_atend).replace('.',',')}, porque chat da Shopee resolve numa resposta e reclamação de pós-venda exige investigação e idas e voltas. Comparar os dois pelo número bruto de atendimentos leva à conclusão errada.`;})()}</div></div>`;
  }

  if(D.producao && D.producao.matriz){ const MZ=D.producao.matriz, PC=MZ.canais;
    const mxp=Math.max(...MZ.pessoas.map(p=>p.msgs));
    h += `<div class="panel" style="margin-top:14px"><p class="pt"><span class="tip">Quem respondeu, canal por canal<span class="tipbox"><b>O que entra nesta conta</b><br>Todas as mensagens com origem <b>MANUAL</b> do período, cruzadas por <b>quem digitou</b> e <b>em qual canal</b> — sem filtrar por cargo. Usuários administrativos aparecem na mesma tabela, marcados.<br><b>Atendimentos</b> são tickets distintos: cinco mensagens no mesmo caso contam 1.<em>A soma das linhas é o total de mensagens manuais do mês; a soma dos atendimentos pode ser menor que o total do canal quando duas pessoas tocam o mesmo ticket.</em></span></span> <small>${MZ.dias_uteis} dias úteis · ${NB(MZ.total_msgs)} mensagens manuais em ${NB(MZ.total_atend)} atendimentos</small></p>

      ${MZ.pessoas.map(p=>`<tr><td><span class="dot" style="background:${AVC[p.nome]||'#7C818C'};margin-right:8px"></span>${p.nome}${p.equipe?'':' <span class="bdg2 b-nt" style="margin:0">administrativo</span>'}
          <div style="color:#5E636D;font-size:11px;margin-top:2px;margin-left:16px">${p.dias} dias com registro · ${p.primeiro} a ${p.ultimo}</div></td>
        ${PC.map(c=>{const x=p.canais[c.id];

  if(D.tempo_real){const TR=D.tempo_real, EQ=TR.equipe;

`;

    ].map(cardKPI).join('')+`</div>
    <div style="margin-top:14px">

          <td>${NB(c.n)}</td><td>${NB(c.ok)}</td><td style="color:${c.pct>=70?'#4ADE80':c.pct>=50?'#FACC15':'#F87171'};font-weight:700">${c.pct}%</td></tr>`).join('')}</tbody></table>
        <table style="margin-top:16px"><thead><tr><th>Tipo de atendimento</th><th>Avaliados</th><th>No prazo</th><th>%</th></tr></thead>

/* ---------- gráficos ---------- */
function graficos(D){
  const C=D.chat, K=D.kpi;
  /* fila diaria: estoque (07h/17h) + fluxo (entradas/respostas) */
  if(D.fila)(function(){
    const S=D.fila.dias,W=1000,p={l:48,r:14,t:16,b:30};
    const HA=170,GAP=40,HB=132,H=p.t+HA+GAP+HB+p.b;
    const iw=W-p.l-p.r,bw=iw/S.length;
    const passo=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)))/2;return Math.ceil(v/p)*p;};
    const maxS=passo(Math.max(...S.map(d=>Math.max(d.p7,d.p17)))*1.06);
    const maxF=passo(Math.max(...S.map(d=>Math.max(d.ent,d.resp)))*1.06);
    const yS=v=>p.t+HA-(v/maxS)*HA, yB0=p.t+HA+GAP, yB=v=>yB0+HB-(v/maxF)*HB;
    const s=svg(W,H);
    s.appendChild(tx(p.l,p.t-4,'ESTOQUE — TICKETS AGUARDANDO ATENDENTE',{anchor:'start',size:9,weight:700,fill:'#6B7079'}));
    s.appendChild(tx(p.l,yB0-10,'FLUXO DO DIA — ENTRARAM NA FILA vs SAÍRAM',{anchor:'start',size:9,weight:700,fill:'#6B7079'}));
    for(let i=0;i<=4;i++){const v=maxS*i/4;
      s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:yS(v),y2:yS(v),stroke:'#212329'}));
      s.appendChild(tx(p.l-8,yS(v)+3.5,NB(Math.round(v)),{anchor:'end',size:9.5}));}
    for(let i=0;i<=3;i++){const v=maxF*i/3;
      s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:yB(v),y2:yB(v),stroke:'#212329'}));
      s.appendChild(tx(p.l-8,yB(v)+3.5,NB(Math.round(v)),{anchor:'end',size:9.5}));}
    /* zigue-zague do estoque: 07h -> 17h (dia) e 17h -> 07h seguinte (noite) */
    S.forEach((d,i)=>{
      const x7=p.l+i*bw+bw*.26, x17=p.l+i*bw+bw*.78;
      const cor=d.delta>0?'#F87171':'#4ADE80';
      s.appendChild(mk('line',{x1:x7,x2:x17,y1:yS(d.p7),y2:yS(d.p17),stroke:cor,'stroke-width':2.6,'stroke-linecap':'round'}));
      if(i<S.length-1){const xn=p.l+(i+1)*bw+bw*.26;
        s.appendChild(mk('line',{x1:x17,x2:xn,y1:yS(d.p17),y2:yS(S[i+1].p7),stroke:'#5E636D','stroke-width':1.5,'stroke-dasharray':'3 3'}));}
      s.appendChild(mk('circle',{cx:x7,cy:yS(d.p7),r:3.2,fill:'#0A0A0B',stroke:'#F87171','stroke-width':2}));
      s.appendChild(mk('circle',{cx:x17,cy:yS(d.p17),r:3.2,fill:cor}));
      if(i===0||i===S.length-1||d.p17===Math.max(...S.map(z=>z.p17)))
        s.appendChild(tx(x17,yS(d.p17)-9,NB(d.p17),{size:9.5,fill:'#C9CDD4',weight:700}));
      /* fluxo */
      const g=bw*.42,w=bw*.30,xb=p.l+i*bw+bw*.12;
      s.appendChild(mk('rect',{x:xb,y:yB(d.ent),width:w,height:Math.max(1,yB(0)-yB(d.ent)),fill:'#FF6B35',rx:2,opacity:.92}));
      s.appendChild(mk('rect',{x:xb+g,y:yB(d.resp),width:w,height:Math.max(1,yB(0)-yB(d.resp)),fill:'#22C55E',rx:2,opacity:.92}));
      s.appendChild(tx(p.l+i*bw+bw/2,H-p.b+16,d.rot,{size:9.5,fill:'#7C818C'}));
    });
    el('c-fila').appendChild(s);
    el('l-fila').innerHTML=
      `<span><u style="background:#0A0A0B;border:2px solid #F87171;border-radius:50%"></u>Abertura às 07h</span>`+
      `<span><u style="background:#9aa0aa;border-radius:50%"></u>Fechamento às 17h</span>`+
      `<span><u style="background:#4ADE80"></u>Dia em que a fila caiu</span>`+
      `<span><u style="background:#F87171"></u>Dia em que a fila subiu</span>`+
      `<span><u style="background:#5E636D"></u>Entre jornadas (noite e fim de semana)</span>`+
      `<span><u style="background:#FF6B35"></u>Entraram na fila</span><span><u style="background:#22C55E"></u>Saíram da fila</span>`;
  })();
  /* composicao da fila das 07h por canal */
  if(D.fila&&D.fila.canais&&D.fila.canais.length)(function(){
    const S=D.fila.dias,W=1000,H=250,p={l:48,r:14,t:26,b:30};
    const ord=['shopee','mercadolivre','magalu','madeira','via'].filter(k=>S[0].canal[k]!==undefined);
    const iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/S.length;
    const passo=v=>{const q=Math.pow(10,Math.floor(Math.log10(v)))/2;return Math.ceil(v/q)*q;};
    const max=passo(Math.max(...S.map(d=>d.p7))*1.06);
    const y=v=>p.t+ih-(v/max)*ih,s=svg(W,H);
    s.appendChild(tx(p.l,p.t-10,'PENDENTES ÀS 07h — COMPOSIÇÃO POR CANAL',{anchor:'start',size:9,weight:700,fill:'#6B7079'}));
    for(let i=0;i<=4;i++){const v=max*i/4;
      s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:y(v),y2:y(v),stroke:'#212329'}));
      s.appendChild(tx(p.l-8,y(v)+3.5,NB(Math.round(v)),{anchor:'end',size:9.5}));}
    S.forEach((d,i)=>{const x=p.l+i*bw+bw*.17,w=bw*.66;let acc=0;
      ord.forEach(k=>{const v=d.canal[k].p7;if(!v)return;const hh=(v/max)*ih;
        s.appendChild(mk('rect',{x,y:p.t+ih-acc-hh,width:w,height:hh,fill:CC[k]||'#3F444C',opacity:.92}));acc+=hh;});
      s.appendChild(tx(x+w/2,H-p.b+16,d.rot,{size:9.5,fill:'#7C818C'}));});
    el('c-filac').appendChild(s);
    el('l-filac').innerHTML=ord.map(k=>{const c=D.fila.canais.find(c=>c.id===k);
      return c?`<span><u style="background:${CC[k]||'#3F444C'}"></u>${c.nome} · ${NB(c.p7_fim)} em ${S[S.length-1].rot}</span>`:''}).filter(Boolean).join('');
  })();
}

/* ---------- gráficos do Reclame Aqui ---------- */
function graficosRA(){
  const R=RA, P=RA.periodos[raPer];
  document.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{raPer=b.dataset.per;render();});
  /* régua */
  (function(){
    const faixas=[{l:'Não recomendada',c:'#7C3AED',a:0,b:5},{l:'Ruim',c:'#EF4444',a:5,b:6},
      {l:'Regular',c:'#EAB308',a:6,b:7},{l:'Bom',c:'#3B82F6',a:7,b:8},
      {l:'Ótimo',c:'#16A34A',a:8,b:10},{l:'RA1000',c:'#4ADE80',a:10,b:10.6}];
    const W=1000,H=110,pad=10,iw=W-pad*2,esc=v=>pad+(v/10.6)*iw,s=svg(W,H);
    faixas.forEach(f=>{const x=esc(f.a),w=esc(f.b)-x;
      s.appendChild(mk('rect',{x,y:34,width:w-3,height:30,fill:f.c,rx:5,opacity:f.l===R.faixa?1:.35}));
      s.appendChild(tx(x+w/2,54,f.l,{fill:f.l===R.faixa?'#fff':'#0A0A0B',size:11,weight:700}));
      if(f.b<=10)s.appendChild(tx(esc(f.b),80,f.b,{size:10}));});
    const px=esc(R.indice);
    s.appendChild(mk('path',{d:`M${px} 30 l-7 -10 l14 0 z`,fill:'#fff'}));
    s.appendChild(tx(px,14,`você está aqui · ${FX(R.indice)}`,{fill:'#fff',size:11.5,weight:700}));
    s.appendChild(mk('line',{x1:esc(7),x2:esc(7),y1:34,y2:70,stroke:'#3B82F6','stroke-dasharray':'3 3'}));
    s.appendChild(tx(esc(7),100,'próxima meta: 7,0 (Bom)',{fill:'#60A5FA',size:10.5}));
    s.appendChild(mk('circle',{cx:esc(R.indice_ref),cy:49,r:4,fill:'none',stroke:'#7C818C','stroke-width':1.5}));
    /* se o rotulo do pico ficar colado no da meta, desce uma linha */
    const colide=Math.abs(esc(R.indice_ref)-esc(7))<150;
    s.appendChild(tx(esc(R.indice_ref),colide?116:100,R.indice_ref_rot+': '+FX(R.indice_ref),{fill:'#7C818C',size:10}));
    el('ra-regua').appendChild(s);
  })();
  /* hora */
  (function(){
    const W=1000,H=200,p={l:30,r:8,t:12,b:26},iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/24;
    const max=Math.max(...Object.values(P.horas)),y=v=>p.t+ih-(v/max)*ih,s=svg(W,H);
    s.appendChild(mk('rect',{x:p.l+7*bw,y:p.t-4,width:11*bw,height:ih+4,fill:'rgba(255,107,53,.06)',rx:5}));
    const step=Math.max(1,Math.ceil(max/5));
    for(let i=0;i<=max;i+=step){s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:y(i),y2:y(i),stroke:'#212329'}));
      s.appendChild(tx(p.l-7,y(i)+3.5,i,{anchor:'end',size:9.5}));}
    for(let hh=0;hh<24;hh++){const v=P.horas[hh]||0,x=p.l+hh*bw;
      if(v)s.appendChild(mk('rect',{x:x+bw*.2,y:y(v),width:bw*.6,height:ih-(y(v)-p.t),fill:hh>=7&&hh<18?'#EF4444':'#7C3AED',rx:3,opacity:.9}));
      if(hh%2===0)s.appendChild(tx(x+bw/2,H-p.b+16,String(hh).padStart(2,'0'),{size:9.5}));}
    el('ra-hora').appendChild(s);
    const dentro=Object.entries(P.horas).filter(([h])=>+h>=7&&+h<18).reduce((a,[,v])=>a+v,0);
    const fora=P.total-dentro;
    el('ra-nhora').innerHTML=`<b>${Math.round(dentro/P.total*100)}% das reclamações chegam em horário comercial</b> (${dentro} de ${NB(P.total)}), com pico entre 9h e 13h. As ${fora} restantes chegam fora da janela de atendimento.`;
  })();
  /* dia */
  (function(){
    const W=1000,H=200,p={l:30,r:8,t:12,b:26},iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/31;
    const vals=Object.values(P.dias_mes),max=Math.max(...vals),y=v=>p.t+ih-(v/max)*ih,s=svg(W,H);
    const step=Math.max(1,Math.ceil(max/5));
    for(let i=0;i<=max;i+=step){s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:y(i),y2:y(i),stroke:'#212329'}));
      s.appendChild(tx(p.l-7,y(i)+3.5,i,{anchor:'end',size:9.5}));}
    for(let d=1;d<=31;d++){const v=P.dias_mes[d]||0,x=p.l+(d-1)*bw;
      if(v)s.appendChild(mk('rect',{x:x+bw*.18,y:y(v),width:bw*.64,height:ih-(y(v)-p.t),fill:v>=max*0.85?'#EF4444':'#FF6B35',rx:3,opacity:.9}));
      if(d%2===1)s.appendChild(tx(x+bw/2,H-p.b+16,String(d).padStart(2,'0'),{size:9.5}));}
    el('ra-dia').appendChild(s);
    const media=(P.total/P.dias).toFixed(1).replace('.',',');
    const picos=Object.entries(P.dias_mes).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0].padStart(2,'0'));
    el('ra-ndia').innerHTML=raPer==='semestre'
      ? `Fluxo constante ao longo do mês, sem sazonalidade clara — média de <b>${media} reclamações por dia do calendário</b> somando os 6 meses. É demanda recorrente, não um incidente pontual.`
      : `Média de <b>${media} reclamações por dia do calendário</b> em ${P.rotulo.toLowerCase().replace(' · parcial','')}, com os maiores volumes nos dias <b>${picos.join(' e ')}</b>.`;
  })();
  /* meses */
  if(el('ra-mes')&&P.meses.length>1){
    const M=P.meses,W=1000,H=200,p={l:34,r:8,t:16,b:26};
    const iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/M.length;
    const max=Math.max(...M.map(m=>m.n)),y=v=>p.t+ih-(v/max)*ih,s=svg(W,H);
    for(let i=0;i<=max;i+=10){s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:y(i),y2:y(i),stroke:'#212329'}));
      s.appendChild(tx(p.l-7,y(i)+3.5,i,{anchor:'end',size:9.5}));}
    M.forEach((m,i)=>{const x=p.l+i*bw;
      s.appendChild(mk('rect',{x:x+bw*.24,y:y(m.n),width:bw*.52,height:ih-(y(m.n)-p.t),
        fill:m.parcial?'#3B82F6':'#FF6B35',rx:4,opacity:m.parcial?.55:.9}));
      s.appendChild(tx(x+bw/2,y(m.n)-7,m.n,{size:11.5,fill:'#fff',weight:700}));
      s.appendChild(tx(x+bw/2,H-p.b+16,m.m+(m.parcial?' *':''),{size:10.5}));});
    el('ra-mes').appendChild(s);
    const med=(M.filter(m=>!m.parcial).reduce((a,b)=>a+b.n,0)/6).toFixed(1);
    el('ra-nmes').innerHTML=`${(()=>{const ch=M.filter(x=>!x.parcial),ult=ch[ch.length-1],pen=ch[ch.length-2],pc=M.find(x=>x.parcial);
      return `Depois de cinco meses entre <b>32 e 41 reclamações</b>, <b>${ult.m==='Ago'?'agosto':ult.m} fechou em ${ult.n}</b> — queda de ${Math.round((1-ult.n/pen.n)*100)}% sobre o mês anterior e o menor volume da janela.`+
        (pc?` Setembro aparece com ${pc.n} porque a janela cobre só os ${RA.periodos.semestre.janela.slice(-10,-8)} primeiros dias do mês.`:'')+
        ` É a primeira quebra do platô, mas ainda é um mês só: setembro fechado é que confirma se virou tendência.`;})()} <span style="color:#5E636D">* mês parcial.</span>`;
  }
  /* notas */
  if(el('ra-notas')&&P.top_avaliadas.length){
    const N=P.notas,W=1000,H=200,p={l:30,r:8,t:16,b:26};
    const iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/11;
    const max=Math.max(...Object.values(N)),y=v=>p.t+ih-(v/max)*ih,s=svg(W,H);
    const step=Math.max(1,Math.ceil(max/5));
    for(let i=0;i<=max;i+=step){s.appendChild(mk('line',{x1:p.l,x2:W-p.r,y1:y(i),y2:y(i),stroke:'#212329'}));
      s.appendChild(tx(p.l-7,y(i)+3.5,i,{anchor:'end',size:9.5}));}
    for(let n=10;n>=0;n--){const v=N[n]||0,x=p.l+(10-n)*bw;
      const cor=n>=9?'#22C55E':n>=7?'#84CC16':n>=5?'#EAB308':n>=3?'#FF6B35':'#EF4444';
      if(v){s.appendChild(mk('rect',{x:x+bw*.22,y:y(v),width:bw*.56,height:ih-(y(v)-p.t),fill:cor,rx:3,opacity:.9}));
        s.appendChild(tx(x+bw/2,y(v)-6,v,{size:11,fill:'#fff',weight:700}));}
      s.appendChild(tx(x+bw/2,H-p.b+16,n,{size:10.5}));}
    el('ra-notas').appendChild(s);
    const prom=(N[10]||0)+(N[9]||0),det=Object.entries(N).filter(([n])=>+n<=6).reduce((a,b)=>a+b[1],0);
    el('ra-nnotas').innerHTML=`<b>${N[0]||0} avaliações nota zero</b> contra ${prom} notas 9 e 10. Os detratores (até 6) somam ${det} das ${P.avaliadas}, o que puxa a média para ${(P.nota_media??RA.nota_consumidor).toFixed(2).replace('.',',')}/10. A concentração no extremo zero é típica de cliente que avaliou depois de desistir — e é o indicador mais lento de virar, porque só se move quando um cliente novo avalia bem.`;
  }
  /* problemas e produtos */
  [['ra-prob',P.problemas,'#EF4444'],['ra-prod',P.produtos,'#3B82F6'],['ra-cat',P.categorias||[],'#A855F7']].forEach(([id,arr,cor])=>{
    if(!el(id)||!arr.length)return;
    const W=1000,rh=34,H=arr.length*rh+8,mx=Math.max(...arr.map(a=>a.v)),bx=330,s=svg(W,H);
    arr.forEach((a,i)=>{const y=i*rh+8,w=(a.v/mx)*(W-bx-110);
      s.appendChild(tx(0,y+16,a.p,{anchor:'start',size:12.5,fill:'#B7BBC4'}));
      s.appendChild(mk('rect',{x:bx,y:y+3,width:Math.max(2,w),height:18,fill:cor,rx:4,opacity:i===0?.92:.55}));
      s.appendChild(tx(bx+w+10,y+17,a.v.toFixed(2).replace('.',',')+'%',{anchor:'start',size:11}));});
    el(id).appendChild(s);
  });
  /* temas */
  (function(){
    const T=P.temas,W=1000,rh=34,H=T.length*rh+8,mx=Math.max(...T.map(t=>t.v)),bx=400,s=svg(W,H);
    T.forEach((t,i)=>{const y=i*rh+8,w=(t.v/mx)*(W-bx-120);
      const lbl=t.t.length>48?t.t.slice(0,46)+'…':t.t;
      s.appendChild(tx(0,y+16,`${i+1}. ${lbl}`,{anchor:'start',size:12.5,fill:'#B7BBC4'}));
      s.appendChild(mk('rect',{x:bx,y:y+3,width:Math.max(2,w),height:18,fill:i===0?'#EF4444':'#FF6B35',rx:4,opacity:i===0?.92:.6}));
      s.appendChild(tx(bx+w+10,y+17,NB(t.v)+' visualizações',{anchor:'start',size:11}));});
    el('ra-tema').appendChild(s);
  })();
}

/* ---------- render ---------- */
/* ======================================================
   LEITURAS RECOLHIDAS
   Toda nota interpretativa (.note) e caixa de observação (.obsbox)
   vira um marcador "!" que só revela o texto no hover.
   ====================================================== */
function leituras(root){
  if(!root) return;
  root.querySelectorAll('.note, .obsbox, .alertbox').forEach(n=>{
    if(n.dataset.le) return;
    const txt=(n.textContent||'').trim();
    if(!txt) return;                       // notas ainda vazias (gráficos) são tratadas depois
    let cls='', rot='Leitura';
    const st=(n.getAttribute('style')||'');
    if(n.classList.contains('obsbox')){
      if(/239,68,68/.test(st)){cls=' ru';rot='Alerta';}
      else if(/234,179,8/.test(st)){cls=' al';rot='Atenção';}
      else if(/34,197,94/.test(st)){cls=' bo';rot='Destaque';}
      else {rot='Observação';}
    }
    if(n.classList.contains('alertbox')){
      cls = n.classList.contains('cor') ? ' bo' : n.classList.contains('rd') ? ' ru' : ' al';
      rot = n.classList.contains('cor') ? 'Correção' : 'Leitura do canal';
      if(n.getAttribute('data-rot')) rot = n.getAttribute('data-rot');
    }
    const html=n.innerHTML.replace(/<span class="oi">[^<]*<\/span>/,'').replace(/^\s*<span>[^<]{0,4}<\/span>\s*/,'').replace(/^\s*<span>|<\/span>\s*$/g,'');
    const span=document.createElement('span');
    span.className='le'+cls;
    span.dataset.le='1';
    span.innerHTML='<i>!</i>'+rot+'<span class="tipbox">'+html+'</span>';
    span.title='';
    n.replaceWith(span);
  });
  // tooltips perto da borda direita abrem alinhados à direita; os do fim da página, para baixo
  const lg=root.getBoundingClientRect?root.getBoundingClientRect():null;
  root.querySelectorAll('.le').forEach(e=>{
    const r=e.getBoundingClientRect();
    if(lg && r.left-lg.left > lg.width*0.55) e.classList.add('right');
    if(r.top < 260) e.classList.add('down');
  });
}

function render(){
  const v=el('view');
  if(atual==='ra'){v.innerHTML=`<div class="fade">${viewRA()}</div>`;graficosRA();leituras(v);return;}
  if(atual==='rep'){v.innerHTML=`<div class="fade">${viewRep()}</div>`;leituras(v);return;}
  if(atual==='geral'){v.innerHTML=`<div class="fade">${viewGeral()}</div>`;leituras(v);return;}
  const m=DATA.meses.find(x=>x.key===atual);
  v.innerHTML=`<div class="fade">${viewMes(m)}</div>`;
  if(m.dados) graficos(m.dados);
  leituras(v);
}
pintaRepBar();pintaTabs();pintaTopo();render();
