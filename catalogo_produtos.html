<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo De Produtos — EasyHouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115;
  --panel:#161a21;
  --panel-2:#1d222b;
  --line:#272d38;
  --line-soft:#1f242e;
  --txt:#e8ecf2;
  --txt-dim:#8b94a3;
  --txt-faint:#5a6472;
  --accent:#ff6a2b;
  --accent-soft:#ff6a2b22;
  --livre:#3bb273;
  --easy:#ff6a2b;
  --madeira:#c08a3e;
  --esplanada:#4a90d9;
  --belmicro:#9b6bd6;
  --radius:14px;
  --shadow:0 8px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, #1b2a3a55, transparent 60%),
    radial-gradient(900px 500px at -5% 110%, #2a1a1255, transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:'Inter Tight',sans-serif;
  min-height:100vh;
  padding:28px clamp(14px,4vw,48px);
}
.wrap{max-width:1280px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:46px;height:46px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),#ff9a5b);
  display:grid;place-items:center;font-family:'Sora';font-weight:800;
  color:#0f1115;font-size:22px;box-shadow:0 6px 18px var(--accent-soft)}
.title h1{font-family:'Sora';font-weight:800;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.5px;line-height:1.05}
.title .sub{color:var(--txt-dim);font-size:13px;margin-top:3px}
.title .sub b{color:var(--accent);font-weight:600}
.kpis{display:flex;gap:12px;flex-wrap:wrap}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px 16px;min-width:96px}
.kpi .n{font-family:'Sora';font-weight:700;font-size:20px;line-height:1}
.kpi .l{color:var(--txt-dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-top:5px}
.filters{
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:20px;box-shadow:var(--shadow)}
.filters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--txt-dim);margin-bottom:7px;font-weight:600}
.field input,.field select{
  width:100%;background:var(--bg);border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:10px 12px;font-size:14px;
  font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:var(--txt-faint)}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field select{appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%238b94a3' stroke-width='2'><path d='M3 5l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
.filter-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:10px}
.count{font-size:13px;color:var(--txt-dim)}
.count b{color:var(--txt);font-family:'Sora';font-weight:700}
.clear{
  background:transparent;border:1px solid var(--line);color:var(--txt-dim);
  padding:8px 16px;border-radius:9px;cursor:pointer;font-size:13px;font-family:inherit;
  transition:.15s}
.clear:hover{border-color:var(--accent);color:var(--accent)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--txt-dim)}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%}
.table-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.thead{
  display:grid;grid-template-columns:1.7fr 1fr .9fr 1.4fr;gap:14px;
  padding:14px 20px;background:var(--panel-2);border-bottom:1px solid var(--line);
  font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--txt-dim);font-weight:600}
.rows{max-height:60vh;overflow-y:auto}
.rows::-webkit-scrollbar{width:9px}
.rows::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.row{
  display:grid;grid-template-columns:1.7fr 1fr .9fr 1.4fr;gap:14px;align-items:center;
  padding:14px 20px;border-bottom:1px solid var(--line-soft);transition:background .12s}
.row:hover{background:var(--panel-2)}
.row:last-child{border-bottom:none}
.item-name{font-weight:600;font-size:14.5px;letter-spacing:-.2px}
.item-tek{font-size:11.5px;color:var(--txt-faint);margin-top:3px}
.item-tek span{color:var(--txt-dim)}
.cod-pill{
  display:inline-block;font-family:'Sora';font-weight:600;font-size:13px;
  background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:var(--txt)}
.mask-wrap{display:flex;flex-direction:column;gap:4px}
.mask-name{font-size:13.5px;font-weight:500}
.mask-empty{font-size:13px;color:var(--txt-faint);font-style:italic}
.lojistas{display:flex;flex-direction:column;gap:5px}
.lojista{display:flex;align-items:center;gap:8px;font-size:13.5px}
.lojista .dot{flex-shrink:0}
.lojista.pref{font-weight:700}
.lojista.pref::after{content:'\2605';color:var(--accent);font-size:12px;margin-left:2px}
.lojista.dimmed{color:var(--txt-dim);font-weight:400}
.badge-livre{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--livre)}
.empty-state{padding:60px 20px;text-align:center;color:var(--txt-dim)}
.empty-state .big{font-size:34px;margin-bottom:10px}
footer{margin-top:22px;text-align:center;color:var(--txt-faint);font-size:12px}
@media(max-width:760px){
  .thead{display:none}
  .row{grid-template-columns:1fr;gap:10px;padding:16px 18px}
  .row>div::before{content:attr(data-l);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt-faint);margin-bottom:4px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">

        <h1>Catálogo De Produtos</h1>

  <div class="legend" id="legend"></div>

  <div class="table-card">
    <div class="thead">
      <div>Item</div>
      <div>Cód. Item</div>
      <div>Máscara</div>
      <div>Lojistas / Preferência</div>

    <div class="rows" id="rows"></div>
  </div>

  <footer>Catálogo gerado a partir de <b>Catálogo_de_produto_28_05</b> &middot; &#9733; indica o lojista com preferência de negociação</footer>
</div>

const COLORS = {
  'LIVRE PARA NEGOCIAR':'var(--livre)',
  'EASY HOUSE':'var(--easy)',
  'MADEIRA MADEIRA':'var(--madeira)',
  'ESPLANADA':'var(--esplanada)',
  'BELMICRO':'var(--belmicro)'
};
function colorOf(name){return COLORS[name]||'var(--txt-dim)';}

const masks=[...new Set(DATA.map(d=>d.mask).filter(Boolean))].sort();
const prefs=[...new Set(DATA.map(d=>d.pref).filter(Boolean))].sort();
const selMask=document.getElementById('fMask');
masks.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;selMask.appendChild(o);});
const selPref=document.getElementById('fPref');
prefs.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;selPref.appendChild(o);});

const legend=document.getElementById('legend');
prefs.forEach(p=>{
  const s=document.createElement('span');
  s.innerHTML='<i class="dot" style="background:'+colorOf(p)+'"></i>'+p;
  legend.appendChild(s);
});

const els={
  cod:document.getElementById('fCod'),
  desc:document.getElementById('fDesc'),
  mask:selMask, pref:selPref,
  rows:document.getElementById('rows'),
  vis:document.getElementById('visCount'),
  tot:document.getElementById('totCount'),
};

function lojistaLine(name,isPref){
  if(!name)return '';
  const cls='lojista'+(isPref?' pref':(isPref===false?' dimmed':''));
  return '<div class="'+cls+'"><i class="dot" style="background:'+colorOf(name)+'"></i>'+name+'</div>';
}

function render(list){
  els.rows.innerHTML='';
  if(!list.length){
    els.rows.innerHTML='<div class="empty-state"><div class="big">&#8709;</div>Nenhum registro encontrado com esses filtros.</div>';
  }
  list.forEach(d=>{
    const row=document.createElement('div');
    row.className='row';
    let lojHtml='';
    const hasLoj = d.loj1 || d.loj2;
    if(!hasLoj){
      lojHtml='<span class="badge-livre"><i class="dot" style="background:'+colorOf(d.pref)+'"></i>'+(d.pref||'—')+'</span>';
    } else {
      const l1pref = d.loj1 && d.loj1===d.pref;
      const l2pref = d.loj2 && d.loj2===d.pref;
      const both = d.loj1 && d.loj2;
      lojHtml += lojistaLine(d.loj1, both ? l1pref : (l1pref?true:null));
      if(d.loj2) lojHtml += lojistaLine(d.loj2, l2pref);
    }
    const maskHtml = d.mask
      ? '<div class="mask-name">'+d.mask+'</div>'
      : '<div class="mask-empty">— sem máscara —</div>';
    row.innerHTML=
      '<div data-l="Item"><div class="item-name">'+d.desc+'</div>'+
      '<div class="item-tek">Tek System: <span>'+(d.tek||'—')+'</span></div></div>'+
      '<div data-l="Cód. Item"><span class="cod-pill">'+d.cod+'</span></div>'+
      '<div data-l="Máscara" class="mask-wrap">'+maskHtml+'</div>'+
      '<div data-l="Lojistas" class="lojistas">'+lojHtml+'</div>';
    els.rows.appendChild(row);
  });
  els.vis.textContent=list.length;
}

function applyFilters(){
  const cod=els.cod.value.trim().toLowerCase();
  const desc=els.desc.value.trim().toLowerCase();
  const mask=els.mask.value;
  const pref=els.pref.value;
  const out=DATA.filter(d=>
    (!cod||d.cod.toLowerCase().includes(cod))&&
    (!desc||d.desc.toLowerCase().includes(desc))&&
    (!mask||d.mask===mask)&&
    (!pref||d.pref===pref)
  );
  render(out);
}

[els.cod,els.desc].forEach(e=>e.addEventListener('input',applyFilters));
[els.mask,els.pref].forEach(e=>e.addEventListener('change',applyFilters));
document.getElementById('btnClear').addEventListener('click',function(){
  els.cod.value='';els.desc.value='';els.mask.value='';els.pref.value='';
  applyFilters();
});
